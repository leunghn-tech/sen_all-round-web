<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">

    <!-- Tailwind CSS -->

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 拖曳與選取互動樣式 - 放大與圓潤化適合SEN學生 */
        .drop-zone { transition: all 0.2s ease; border-width: 4px; }
        .drop-zone.dragover { background-color: #fef08a; border-color: #eab308; transform: scale(1.05); }
        .draggable-item { cursor: grab; transition: transform 0.1s, box-shadow 0.1s; touch-action: none; border: 2px solid transparent; }
        .draggable-item:active { cursor: grabbing; transform: scale(0.95); }
        .draggable-item.selected { border-color: #f97316; background-color: #fed7aa; transform: translateY(-3px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); color: #c2410c; }
        
        /* 購物清單按鈕特效 */
        .shopping-btn { transition: transform 0.2s, box-shadow 0.2s; }
        .shopping-btn:active { transform: scale(0.9); }
        .memory-flash { animation: flash 0.5s ease-in-out; }
        @keyframes flash { 0%, 100% { opacity: 1; filter: brightness(1); } 50% { opacity: 0.8; filter: brightness(1.2); box-shadow: 0 0 20px #fbbf24;} }

        /* 煙火特效粒子 - 成功時的強烈正向回饋 */
        .confetti { position: fixed; width: 12px; height: 12px; z-index: 9999; pointer-events: none; animation: fall linear forwards; border-radius: 50%; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.5); opacity: 0; }
        }
        
        /* 錯誤震動特效 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .pointer-events-none { pointer-events: none; }
    </style>
</head>

<body class="bg-orange-50 flex flex-col h-screen overflow-hidden text-gray-800 font-sans">

                    { q: "當你準備過馬路，看到行人紅綠燈是「紅色小人」在閃爍，你應該怎麼做？", options: ["立刻停下等候綠燈", "快步跑過馬路", "繼續一邊玩手機一邊走過馬路"], answer: 0, hint: "紅燈閃爍代表不能過馬路。" },

                    { q: "登上巴士付了車費之後，為了自身安全，我們應該最先做好什麼事？", options: ["在走廊上跑來跑去", "找空座位坐好並扶穩扶手", "把頭和手伸出窗外看風景"], answer: 1, hint: "巴士開動會搖晃，要立刻扶穩或坐下。" },
                    { q: "你想走到馬路對面，但附近沒有交通燈，你應該選擇哪裡過馬路才安全？", options: ["行人天橋、隧道或斑馬線", "直接從馬路中間快速跑過去", "跨越路邊的鐵欄杆過去"], answer: 0, hint: "使用合法的過路設施才安全。" }
                ]
            },
            {
                id: 15, stage: "第六階段：進階生活應用", title: "15. 快餐店點餐機", type: "choice",
                desc: "任務：學習使用快餐店的自助點餐機和預算控制。",
                questions: [
                    { q: "你今天只有 30 元的預算，以下哪一個套餐是你足夠錢買得起的？", options: ["28元的魚柳包套餐", "35元的牛肉皇套餐", "42元的炸雞分享桶"], answer: 0, hint: "找一個價錢少於 30 元的套餐。" },
                    { q: "你在點餐機點了一個 25 元的漢堡包和一杯 7 元的汽水，你總共需要付多少錢？", options: ["32元", "30元", "28元", "35元"], answer: 0, hint: "25 加 7 等於幾多？" },
                    { q: "你有 40 元，買了 22 元的芝士漢堡後，還想加配一款小食，以下哪一款小食在你的剩餘預算內？", options: ["25元的雞翼(4隻)", "15元的細薯條", "20元的蘋果批"], answer: 1, hint: "40 減去 22 剩下 18 元，只能買便宜過 18 元的小食。" },
                    { q: "自助點餐機螢幕上顯示「請選擇取餐方式」，你想在店內坐下慢慢吃，應該點擊哪一個按鈕？", options: ["外賣自取 / 帶走", "堂食 / 店內食用", "取消交易"], answer: 1, hint: "在餐廳裡面吃叫做「堂食」。" }
                ]
            }
        ];

        // ==========================================
        // 2. 全局狀態與 Local Storage
        // ==========================================
        let state = { currentLevelIndex: 0, energyAnswered: 0 };
        // 計算總題數
        const totalQuestions = idLevels.reduce((sum, level) => sum + level.questions.length, 0);

        let currentQIndex = 0;
        let userSequence = []; 
        let globalSelectedObj = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadProgress();
            initSidebar();
            loadLevel(state.currentLevelIndex);
            
            document.getElementById('toggle-sidebar').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('-translate-x-full');
                sidebar.classList.toggle('hidden');
            });
        });

        function saveProgress() {
            try {
                localStorage.setItem('senIdState', JSON.stringify(state));
            } catch(e) {
                console.warn("無法儲存進度 (可能在預覽模式或無痕模式)：", e);
            }
            updateEnergy();
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('senIdState');
                if(saved) {
                    const parsedState = JSON.parse(saved);
                    // 確保屬性存在，避免舊資料結構出錯
                    if (parsedState && typeof parsedState.currentLevelIndex === 'number') {
                        state.currentLevelIndex = parsedState.currentLevelIndex;
                    }
                    if (parsedState && typeof parsedState.energyAnswered === 'number') {
                        state.energyAnswered = parsedState.energyAnswered;
                    }
                    if(state.currentLevelIndex >= idLevels.length || state.currentLevelIndex < 0) {
                        state.currentLevelIndex = 0;
                    }
                }
            } catch(e) {
                console.warn("無法讀取進度 (可能在預覽模式或無痕模式)：", e);
                // 讀取失敗時重置狀態
                state = { currentLevelIndex: 0, energyAnswered: 0 };
            }
            updateEnergy();
        }

        function resetProgress() {
            if(confirm("確定要重新開始所有訓練任務嗎？")) {
                state = { currentLevelIndex: 0, energyAnswered: 0 };
                saveProgress();
                initSidebar();
                loadLevel(0);
            }
        }

        function updateEnergy() {
            const bar = document.getElementById('energy-bar');
            const text = document.getElementById('energy-text');
            let percent = Math.min(Math.round((state.energyAnswered / totalQuestions) * 100), 100);
            bar.style.width = percent + '%';
            text.innerText = percent + '%';
        }

        function initSidebar() {
            const list = document.getElementById('level-list');
            list.innerHTML = '';
            let currentStage = "";
            
            idLevels.forEach((level, index) => {
                if (level.stage !== currentStage) {
                    currentStage = level.stage;
                    const stageDiv = document.createElement('div');
                    stageDiv.className = 'text-xs font-black text-orange-400 mt-5 mb-2 px-2 border-l-4 border-orange-400';
                    stageDiv.innerText = currentStage;
                    list.appendChild(stageDiv);
                }

                const btn = document.createElement('button');
                const isActive = index === state.currentLevelIndex;
                btn.className = `w-full text-left px-3 py-3 rounded-2xl border-2 transition font-bold text-sm flex items-center gap-2 ${isActive ? 'border-orange-500 bg-orange-50 text-orange-700 shadow-md transform scale-[1.02]' : 'border-orange-100 bg-white hover:border-yellow-400 text-gray-600'}`;
                btn.innerHTML = `<i class="fa-solid fa-star ${isActive ? 'text-yellow-400' : 'text-gray-300'} w-5 text-center"></i> <span class="truncate">${level.title}</span>`;
                
                btn.onclick = () => {
                    state.currentLevelIndex = index;
                    saveProgress();
                    initSidebar(); 
                    loadLevel(state.currentLevelIndex);
                };
                list.appendChild(btn);
            });
        }

        // ==========================================
        // 3. 關卡渲染控制器
        // ==========================================
        function loadLevel(levelIndex) {
            currentQIndex = 0;
            const level = idLevels[levelIndex];
            
            document.getElementById('current-stage-tag').innerText = level.stage;
            document.getElementById('current-level-title').innerText = level.title;
            document.getElementById('current-level-desc').innerText = level.desc;
            
            renderProgressNodes(level);
            renderQuestion();
        }

        function renderProgressNodes(level) {
            const container = document.getElementById('progress-nodes');
            container.innerHTML = '';
            const qCount = level.questions.length;
            
            for(let i=0; i<qCount; i++) {
                const node = document.createElement('div');
                node.className = 'flex items-center gap-1';
                const circle = document.createElement('div');
                circle.className = `w-8 h-8 rounded-full flex items-center justify-center font-black text-sm border-2 transition-all duration-300 ${i < currentQIndex ? 'bg-green-500 border-green-500 text-white shadow-md' : (i === currentQIndex ? 'bg-yellow-300 border-yellow-400 text-yellow-800 shadow-md scale-110' : 'bg-gray-100 border-gray-200 text-gray-400')}`;
                circle.innerHTML = i < currentQIndex ? '<i class="fa-solid fa-check"></i>' : (i + 1);
                node.appendChild(circle);
                container.appendChild(node);
            }
        }

        function renderQuestion() {
            const level = idLevels[state.currentLevelIndex];
            if(currentQIndex >= level.questions.length) {
                showLevelComplete();
                return;
            }

            const qData = level.questions[currentQIndex];
            const area = document.getElementById('interactive-area');
            const hintArea = document.getElementById('hint-content');
            const feedback = document.getElementById('feedback-area');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            area.innerHTML = ''; 
            feedback.className = 'hidden'; 
            submitBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            if(retryBtn) retryBtn.classList.add('hidden');
            userSequence = [];
            globalSelectedObj = null;
            
            renderProgressNodes(level);
            hintArea.innerText = qData.hint || "請仔細看看，動手試試看！";
            
            setTimeout(() => playTTS(qData.q || qData.text || qData.audioText || level.desc), 500);
            
            if (level.type === 'drag-category') renderCategory(qData, area, submitBtn);
            else if (level.type === 'choice') renderChoice(qData, area);
            else if (level.type === 'sequence') renderSequence(qData, area, submitBtn);
            else if (level.type === 'memory') renderShoppingMemory(qData, area, submitBtn);
            else if (level.type === 'fill-blank') renderFillBlank(qData, area, submitBtn);
        }

        function clearSelection() {
            document.querySelectorAll('.draggable-item').forEach(el => el.classList.remove('selected'));
            globalSelectedObj = null;
        }

        // ==========================================
        // 4. 題型引擎區
        // ==========================================
        
        // 引擎 A: 拖曳分類 
        function renderCategory(qData, container, submitBtn) {
            const boxesContainer = document.createElement('div');
            boxesContainer.className = 'flex flex-col sm:flex-row gap-6 w-full justify-center mb-8';

            let categoryMap = {}; 
            
            qData.categories.forEach(cat => {
                categoryMap[cat] = [];
                const boxWrapper = document.createElement('div');
                boxWrapper.className = 'flex flex-col items-center flex-1 w-full sm:max-w-[250px]';
                
                const box = document.createElement('div');
                box.className = 'drop-zone w-full min-h-[160px] border-4 border-dashed border-orange-300 rounded-3xl flex flex-col items-center p-3 bg-orange-50 shadow-sm transition relative overflow-hidden';
                box.innerHTML = `
                    <div class="bg-white rounded-full w-14 h-14 flex items-center justify-center mb-2 shadow-sm pointer-events-none">
                        <i class="fa-solid fa-basket-shopping text-3xl text-orange-400"></i>
                    </div>
                    <span class="font-black text-lg bg-orange-200 text-orange-800 px-4 py-1 rounded-full pointer-events-none">${cat}</span>
                `;
                
                const itemContainer = document.createElement('div');
                itemContainer.className = 'w-full flex flex-wrap justify-center gap-2 mt-4 pointer-events-none';
                box.appendChild(itemContainer);

                box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('dragover'); });
                box.addEventListener('dragleave', () => { box.classList.remove('dragover'); });
                box.addEventListener('drop', (e) => {
                    e.preventDefault(); box.classList.remove('dragover');
                    const wordText = e.dataTransfer.getData('text/plain');
                    if(wordText) processCategoryDrop(wordText, cat, itemContainer);
                });
                box.addEventListener('click', () => {
                    if(globalSelectedObj) processCategoryDrop(globalSelectedObj.dataset.text, cat, itemContainer, globalSelectedObj);
                });

                boxWrapper.appendChild(box);
                boxesContainer.appendChild(boxWrapper);
            });

            const wordsContainer = document.createElement('div');
            wordsContainer.className = 'flex flex-wrap gap-4 w-full justify-center min-h-[80px] bg-gray-100 p-6 rounded-3xl shadow-inner border-2 border-gray-200';
            
            qData.words.forEach(w => {
                const wordBlock = document.createElement('div');
                wordBlock.className = 'draggable-item bg-white text-gray-800 border-2 border-orange-200 font-black text-xl py-3 px-5 rounded-2xl shadow-md select-none transition flex items-center gap-3 cursor-pointer';
                wordBlock.draggable = true;
                wordBlock.dataset.text = w.text;
                
                wordBlock.innerHTML = `
                    <span>${w.text}</span>
                    <button class="tts-btn bg-sky-100 hover:bg-sky-200 text-sky-600 rounded-full w-8 h-8 flex items-center justify-center transition shrink-0" title="讀出來">
                        <i class="fa-solid fa-volume-high text-sm pointer-events-none"></i>
                    </button>
                `;

                wordBlock.querySelector('.tts-btn').addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    playTTS(w.text);
                });
                
                wordBlock.addEventListener('dragstart', (e) => { 
                    e.dataTransfer.setData('text/plain', w.text); 
                    wordBlock.style.opacity = '0.5'; 
                    clearSelection();
                });
                wordBlock.addEventListener('dragend', (e) => { e.target.style.opacity = '1'; });
                
                wordBlock.addEventListener('click', (e) => {
                    e.stopPropagation();
                    clearSelection();
                    wordBlock.classList.add('selected'); 
                    globalSelectedObj = wordBlock;
                    playTTS("你選了：" + w.text + "。請點擊對應的籃子。");
                });

                wordsContainer.appendChild(wordBlock);
            });

            container.appendChild(boxesContainer);
            container.appendChild(wordsContainer);
            
            const hintNode = document.createElement('p');
            hintNode.className = 'text-sm font-bold text-orange-600 mt-2 text-center w-full bg-yellow-100/50 p-3 rounded-xl border border-yellow-200';
            hintNode.innerHTML = '👉 玩法：可以用手指「拉」物品到籃子，或者「先點物品，再點籃子」。';
            container.appendChild(hintNode);

            function processCategoryDrop(wordText, targetCat, targetContainer, selectedObj = null) {
                const wordData = qData.words.find(w => w.text === wordText);
                if (!wordData) return;

                const sourceEl = selectedObj || wordsContainer.querySelector(`[data-text="${wordText}"]`);
                if (!sourceEl) return;

                if (wordData.cat === targetCat) {
                    sourceEl.className = 'bg-green-100 text-green-800 border-2 border-green-400 font-black text-base py-2 px-3 rounded-xl shadow-sm m-1 flex items-center justify-center';
                    sourceEl.draggable = false;
                    sourceEl.onclick = null; 
                    const btn = sourceEl.querySelector('.tts-btn');
                    if (btn) btn.style.display = 'none';
                    
                    targetContainer.appendChild(sourceEl);
                    playTTS("叻仔！放啱咗啦。");
                    
                    if (wordsContainer.children.length === 0) {
                        setTimeout(() => handleResult(true), 500);
                    }
                } else {
                    sourceEl.classList.add('animate-shake');
                    sourceEl.classList.remove('selected');
                    globalSelectedObj = null;
                    playTTS("唔啱喎，再試下啦！");
                    setTimeout(() => sourceEl.classList.remove('animate-shake'), 400);
                }
            }
        }

        // 引擎 B: 選擇題
        function renderChoice(qData, container) {
            const qText = document.createElement('h4');
            qText.className = 'text-2xl font-black text-gray-800 mb-8 text-center leading-relaxed whitespace-pre-line';
            qText.innerText = qData.q;
            container.appendChild(qText);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'flex flex-col gap-4 w-full max-w-md';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'bg-white border-4 border-orange-200 hover:border-orange-500 hover:bg-orange-50 text-gray-800 font-black text-xl py-4 px-6 rounded-2xl shadow-sm transition transform hover:-translate-y-1 w-full text-left flex items-center justify-between';
                btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-circle-chevron-right text-orange-300"></i>`;
                
                btn.onclick = () => {
                    const isCorrect = (idx === qData.answer);
                    if(isCorrect) {
                        btn.classList.replace('border-orange-200', 'border-green-500');
                        btn.classList.replace('hover:border-orange-500', 'border-green-500');
                        btn.classList.add('bg-green-50', 'text-green-800');
                    } else {
                        btn.classList.replace('border-orange-200', 'border-red-500');
                        btn.classList.add('bg-red-50', 'text-red-800', 'animate-shake');
                    }
                    setTimeout(() => handleResult(isCorrect), 300);
                };
                optionsDiv.appendChild(btn);
            });
            container.appendChild(optionsDiv);
        }

        // 引擎 C: 排序題 (點擊依序放入)
        function renderSequence(qData, container, submitBtn) {
            const slotDiv = document.createElement('div');
            slotDiv.className = 'flex flex-wrap gap-2 w-full justify-center mb-8 min-h-[100px] p-4 bg-orange-100 rounded-2xl border-2 border-orange-200';
            
            const words = [...qData.words].sort(() => Math.random() - 0.5); // 打亂順序
            userSequence = [];

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'flex flex-wrap justify-center gap-4 w-full';

            words.forEach(w => {
                const btn = document.createElement('button');
                btn.className = 'bg-white border-2 border-orange-300 text-gray-800 font-black text-lg py-3 px-5 rounded-xl shadow transition hover:bg-orange-50';
                btn.innerText = w;
                
                btn.onclick = () => {
                    if(btn.parentElement === optionsDiv) {
                        slotDiv.appendChild(btn);
                        userSequence.push(w);
                        btn.classList.replace('bg-white', 'bg-yellow-100');
                    } else {
                        optionsDiv.appendChild(btn);
                        userSequence = userSequence.filter(item => item !== w);
                        btn.classList.replace('bg-yellow-100', 'bg-white');
                    }
                    submitBtn.classList.toggle('hidden', userSequence.length !== words.length);
                };
                optionsDiv.appendChild(btn);
            });

            container.appendChild(slotDiv);
            container.appendChild(optionsDiv);
            
            const hintNode = document.createElement('p');
            hintNode.className = 'text-sm font-bold text-orange-600 mt-4 text-center w-full';
            hintNode.innerHTML = '👉 順序點擊選項，把它們排好！';
            container.appendChild(hintNode);

            submitBtn.onclick = () => {
                const isCorrect = userSequence.join(',') === qData.answer.join(',');
                handleResult(isCorrect);
            };
        }

        // 引擎 D: 填空題
        function renderFillBlank(qData, container, submitBtn) {
            const sentenceDiv = document.createElement('div');
            sentenceDiv.className = 'text-2xl font-black text-gray-800 mb-8 leading-loose text-center bg-white p-6 rounded-2xl shadow-sm border-2 border-gray-100 w-full';
            
            let htmlText = qData.text;
            qData.blanks.forEach((b, i) => {
                htmlText = htmlText.replace(`[__${i+1}__]`, `<span class="inline-block w-24 h-12 bg-gray-100 border-b-4 border-dashed border-orange-400 mx-2 align-middle text-center text-orange-600 cursor-pointer transition hover:bg-orange-50" data-index="${i}" id="blank-${i}"></span>`);
            });
            sentenceDiv.innerHTML = htmlText;
            container.appendChild(sentenceDiv);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'flex flex-wrap justify-center gap-4 w-full bg-orange-50 p-6 rounded-2xl border-2 border-orange-200';
            
            let userAnswers = new Array(qData.blanks.length).fill(null);
            let activeBlankIndex = 0; // 預設選中第一個空格

            function updateBlankHighlight() {
                qData.blanks.forEach((_, i) => {
                    const el = document.getElementById(`blank-${i}`);
                    if(i === activeBlankIndex) {
                        el.classList.add('bg-yellow-100', 'border-orange-500');
                    } else {
                        el.classList.remove('bg-yellow-100', 'border-orange-500');
                    }
                });
            }

            sentenceDiv.querySelectorAll('span[data-index]').forEach(span => {
                span.onclick = () => {
                    activeBlankIndex = parseInt(span.dataset.index);
                    updateBlankHighlight();
                    // 如果空格內已有東西，退回選項區
                    if(userAnswers[activeBlankIndex]) {
                        const optBtn = optionsDiv.querySelector(`[data-val="${userAnswers[activeBlankIndex]}"]`);
                        if(optBtn) optBtn.classList.remove('hidden');
                        span.innerText = '';
                        userAnswers[activeBlankIndex] = null;
                        submitBtn.classList.add('hidden');
                    }
                };
            });

            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'bg-white border-2 border-gray-300 text-gray-800 font-black text-xl py-3 px-5 rounded-xl shadow-sm transition hover:bg-orange-100 hover:border-orange-400';
                btn.innerText = opt;
                btn.dataset.val = opt;
                
                btn.onclick = () => {
                    if(activeBlankIndex !== null) {
                        const blankSpan = document.getElementById(`blank-${activeBlankIndex}`);
                        // 如果該格已有答案，先恢復
                        if(userAnswers[activeBlankIndex]) {
                             const oldBtn = optionsDiv.querySelector(`[data-val="${userAnswers[activeBlankIndex]}"]`);
                             if(oldBtn) oldBtn.classList.remove('hidden');
                        }
                        blankSpan.innerText = opt;
                        userAnswers[activeBlankIndex] = opt;
                        btn.classList.add('hidden'); // 在選項區隱藏
                        
                        // 自動跳下一個未填的空格
                        let nextBlank = userAnswers.indexOf(null);
                        activeBlankIndex = nextBlank !== -1 ? nextBlank : null;
                        updateBlankHighlight();

                        if(!userAnswers.includes(null)) {
                            submitBtn.classList.remove('hidden');
                        }
                    } else {
                        playTTS("請先點擊你想填寫的橫線！");
                    }
                };
                optionsDiv.appendChild(btn);
            });

            container.appendChild(optionsDiv);
            updateBlankHighlight();

            submitBtn.onclick = () => {
                const isCorrect = userAnswers.every((ans, idx) => ans === qData.blanks[idx]);
                handleResult(isCorrect);
            };
        }

        // 引擎 E: 記憶題 (聽聲音後順序點擊)
        function renderShoppingMemory(qData, container, submitBtn) {
            const controlDiv = document.createElement('div');
            controlDiv.className = 'flex flex-col items-center gap-4 mb-8 w-full';
            
            const playAudioBtn = document.createElement('button');
            playAudioBtn.className = 'bg-blue-500 hover:bg-blue-400 text-white font-black text-xl py-4 px-8 rounded-full shadow-lg transition flex items-center gap-3 animate-bounce';
            playAudioBtn.innerHTML = '<i class="fa-solid fa-ear-listen text-2xl"></i> 聽聽媽媽要買什麼？';
            
            playAudioBtn.onclick = () => {
                playAudioBtn.classList.remove('animate-bounce');
                playAudioBtn.classList.add('memory-flash');
                setTimeout(() => playAudioBtn.classList.remove('memory-flash'), 500);
                playTTS(qData.audioText);
            };
            controlDiv.appendChild(playAudioBtn);
            container.appendChild(controlDiv);

            const cartDiv = document.createElement('div');
            cartDiv.className = 'w-full min-h-[120px] bg-gray-100 rounded-2xl border-4 border-dashed border-gray-300 p-4 flex gap-2 justify-center items-center flex-wrap mb-6';
            cartDiv.innerHTML = '<span class="text-gray-400 font-bold"><i class="fa-solid fa-cart-shopping"></i> 購物車 (還空空的)</span>';
            container.appendChild(cartDiv);

            const itemsPool = ["🍎 蘋果", "🍌 香蕉", "🍓 士多啤梨", "🥛 牛奶", "🍞 麵包", "🧃 果汁", "🥚 雞蛋"];
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'flex flex-wrap justify-center gap-4 w-full';

            userSequence = [];

            itemsPool.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'shopping-btn bg-white border-2 border-orange-200 text-gray-800 font-black text-xl py-3 px-4 rounded-2xl shadow transition hover:bg-orange-50';
                btn.innerText = item;
                
                btn.onclick = () => {
                    if (cartDiv.querySelector('span.text-gray-400')) cartDiv.innerHTML = '';
                    
                    const clonedBtn = btn.cloneNode(true);
                    clonedBtn.className = 'bg-yellow-100 border-2 border-yellow-400 text-yellow-800 font-black text-lg py-2 px-3 rounded-xl m-1';
                    
                    // 點擊購物車內的物品可取消
                    clonedBtn.onclick = () => {
                        cartDiv.removeChild(clonedBtn);
                        userSequence = userSequence.filter(i => i !== item);
                        if (userSequence.length === 0) cartDiv.innerHTML = '<span class="text-gray-400 font-bold"><i class="fa-solid fa-cart-shopping"></i> 購物車 (還空空的)</span>';
                        submitBtn.classList.toggle('hidden', userSequence.length === 0);
                    };

                    cartDiv.appendChild(clonedBtn);
                    userSequence.push(item);
                    submitBtn.classList.remove('hidden');
                    playTTS("放入 " + item);
                };
                optionsDiv.appendChild(btn);
            });
            container.appendChild(optionsDiv);

            submitBtn.onclick = () => {
                const isCorrect = userSequence.join(',') === qData.answer.join(',');
                handleResult(isCorrect);
            };
        }

        // ==========================================
        // 5. 邏輯判定與回饋處理
        // ==========================================
        function handleResult(isCorrect) {
            const feedback = document.getElementById('feedback-area');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const retryBtn = document.getElementById('retry-btn');
            const interactiveArea = document.getElementById('interactive-area');

            submitBtn.classList.add('hidden');
            feedback.classList.remove('hidden');
            
            if(isCorrect) {
                state.energyAnswered++;
                saveProgress();
                
                feedback.className = 'p-4 rounded-xl text-xl font-black text-center transition-all shadow-sm bg-green-100 text-green-700 border-2 border-green-400';
                feedback.innerHTML = '<i class="fa-solid fa-face-smile-beam text-2xl"></i> 好叻呀！答啱咗啦！';
                playTTS("好叻呀！答啱咗啦！");
                
                interactiveArea.classList.add('pointer-events-none', 'opacity-70');
                nextBtn.classList.remove('hidden');
                if(retryBtn) retryBtn.classList.add('hidden');
                createConfetti();
            } else {
                feedback.className = 'p-4 rounded-xl text-xl font-black text-center transition-all shadow-sm bg-red-100 text-red-700 border-2 border-red-400 animate-shake';
                feedback.innerHTML = '<i class="fa-solid fa-circle-exclamation text-2xl"></i> 差少少咋，再試下啦！';
                playTTS("差少少咋，再試下啦！");
                
                if(retryBtn) retryBtn.classList.remove('hidden');
                interactiveArea.classList.remove('pointer-events-none', 'opacity-70');
            }
        }

        function checkCurrentAnswer() {
            // 這個按鈕主要被綁定在對應引擎的 onclick 裡處理了。預防點擊報錯。
        }

        function nextQuestion() {
            currentQIndex++;
            renderQuestion();
        }

        function retryQuestion() {
            const level = idLevels[state.currentLevelIndex];
            // 重新渲染當前題目
            renderQuestion();
        }

        function showLevelComplete() {
            const area = document.getElementById('interactive-area');
            const hintArea = document.getElementById('hint-content');
            const feedback = document.getElementById('feedback-area');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            submitBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            if(retryBtn) retryBtn.classList.add('hidden');
            feedback.classList.add('hidden');
            hintArea.innerText = "完成整個任務啦！";

            area.innerHTML = `
                <div class="text-center flex flex-col items-center animate-bounce">
                    <i class="fa-solid fa-medal text-6xl text-yellow-400 mb-4 drop-shadow-md"></i>
                    <h3 class="text-3xl font-black text-orange-600 mb-2">恭喜完成階段任務！</h3>
                    <p class="text-gray-600 font-bold mb-6">你做得好好呀！</p>
                    <button onclick="goToNextLevel()" class="bg-orange-500 hover:bg-orange-400 text-white text-xl font-black px-8 py-4 rounded-full shadow-lg transition transform hover:scale-105">
                        挑戰下一個任務 <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            `;
            playTTS("恭喜完成階段任務！你做得好好呀！");
            createConfetti();
        }

        function goToNextLevel() {
            if (state.currentLevelIndex < idLevels.length - 1) {
                state.currentLevelIndex++;
                saveProgress();
                initSidebar();
                loadLevel(state.currentLevelIndex);
            } else {
                alert("太棒了！你已經完成了所有的樂活小鎮任務！");
            }
        }

        // ==========================================
        // 6. 輔助功能：語音 (TTS) 與 特效
        // ==========================================
        function playTTS(text) {
            if (!text) {
                // 如果沒有傳入文字，抓取當前題目的提示或文字
                const level = idLevels[state.currentLevelIndex];
                if(currentQIndex < level.questions.length) {
                    const q = level.questions[currentQIndex];
                    text = q.audioText || q.q || q.text || level.desc;
                } else {
                    return;
                }
            }
            
            // 過濾掉 Emoji 以免機器人讀出奇怪的聲音
            const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{2300}-\u{23FF}]/gu, '');

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止先前的朗讀
                const msg = new SpeechSynthesisUtterance(cleanText);
                msg.lang = 'zh-HK'; 
                msg.rate = 0.9; // 放慢一點適合SEN
                window.speechSynthesis.speak(msg);
            } else {
                console.log("瀏覽器不支持語音朗讀:", cleanText);
            }
        }

        function createConfetti() {
            const colors = ['#fde047', '#fb923c', '#f87171', '#4ade80', '#60a5fa'];
            for (let i = 0; i < 50; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 1) + 's';
                conf.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(conf);
                
                // 動畫結束後自動刪除節點
                setTimeout(() => conf.remove(), 3000);
            }
        }
    </script>
</body>
</html>
