        /* 拖曳與選取互動樣式 - 放大與圓潤化適合SEN學生 */
        .drop-zone { transition: all 0.2s ease; border-width: 4px; }
        .drop-zone.dragover { background-color: #fef08a; border-color: #eab308; transform: scale(1.05); }
        .draggable-item { cursor: grab; transition: transform 0.1s, box-shadow 0.1s; touch-action: none; border: 2px solid transparent; }

        .draggable-item.selected { border-color: #f97316; background-color: #fed7aa; transform: translateY(-3px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); color: #c2410c; }
        
        /* 購物清單按鈕特效 */
        .shopping-btn { transition: transform 0.2s, box-shadow 0.2s; }
        .shopping-btn:active { transform: scale(0.9); }
        .memory-flash { animation: flash 0.5s ease-in-out; }
        @keyframes flash { 0%, 100% { opacity: 1; filter: brightness(1); } 50% { opacity: 0.8; filter: brightness(1.2); box-shadow: 0 0 20px #fbbf24;} }

        /* 煙火特效粒子 - 成功時的強烈正向回饋 */
        .confetti { position: fixed; width: 12px; height: 12px; z-index: 9999; pointer-events: none; animation: fall linear forwards; border-radius: 50%; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.5); opacity: 0; }
        }
        
        /* 錯誤震動特效 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }

        // ==========================================
        // 2. 全局狀態與 Local Storage
        // ==========================================
        let state = { currentLevelIndex: 0, energyAnswered: 0 };
        // 計算總題數
        const totalQuestions = idLevels.reduce((sum, level) => sum + level.questions.length, 0);

        let currentQIndex = 0;
        let userSequence = []; 
        let globalSelectedObj = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadProgress();
            initSidebar();
            loadLevel(state.currentLevelIndex);
            
            document.getElementById('toggle-sidebar').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('-translate-x-full');
                sidebar.classList.toggle('hidden');
            });
        });

        function saveProgress() {
            localStorage.setItem('senIdState', JSON.stringify(state));
            updateEnergy();
        }

        function loadProgress() {
            const saved = localStorage.getItem('senIdState');
            if(saved) {
                state = JSON.parse(saved);
                if(state.currentLevelIndex >= idLevels.length) state.currentLevelIndex = 0;
            }
            updateEnergy();
        }

        function resetProgress() {
            if(confirm("確定要重新開始所有訓練任務嗎？")) {
                state = { currentLevelIndex: 0, energyAnswered: 0 };
                saveProgress();
                initSidebar();
                loadLevel(0);
            }
        }

        function updateEnergy() {
            const bar = document.getElementById('energy-bar');
            const text = document.getElementById('energy-text');
            let percent = Math.min(Math.round((state.energyAnswered / totalQuestions) * 100), 100);
            bar.style.width = percent + '%';
            text.innerText = percent + '%';
        }

        function initSidebar() {
            const list = document.getElementById('level-list');
            list.innerHTML = '';
            let currentStage = "";
            
            idLevels.forEach((level, index) => {
                if (level.stage !== currentStage) {
                    currentStage = level.stage;
                    const stageDiv = document.createElement('div');
                    stageDiv.className = 'text-xs font-black text-orange-400 mt-5 mb-2 px-2 border-l-4 border-orange-400';
                    stageDiv.innerText = currentStage;
                    list.appendChild(stageDiv);
                }

                const btn = document.createElement('button');
                const isActive = index === state.currentLevelIndex;
                btn.className = `w-full text-left px-3 py-3 rounded-2xl border-2 transition font-bold text-sm flex items-center gap-2 ${isActive ? 'border-orange-500 bg-orange-50 text-orange-700 shadow-md transform scale-[1.02]' : 'border-orange-100 bg-white hover:border-yellow-400 text-gray-600'}`;
                btn.innerHTML = `<i class="fa-solid fa-star ${isActive ? 'text-yellow-400' : 'text-gray-300'} w-5 text-center"></i> <span class="truncate">${level.title}</span>`;
                
                btn.onclick = () => {
                    state.currentLevelIndex = index;
                    saveProgress();
                    initSidebar(); 
                    loadLevel(state.currentLevelIndex);
                };
                list.appendChild(btn);
            });
        }

        // ==========================================
        // 3. 關卡渲染控制器
        // ==========================================
        function loadLevel(levelIndex) {
            currentQIndex = 0;
            const level = idLevels[levelIndex];
            
            document.getElementById('current-stage-tag').innerText = level.stage;
            document.getElementById('current-level-title').innerText = level.title;
            document.getElementById('current-level-desc').innerText = level.desc;
            
            renderProgressNodes(level);
            renderQuestion();
        }

        function renderProgressNodes(level) {
            const container = document.getElementById('progress-nodes');
            container.innerHTML = '';
            const qCount = level.questions.length;
            
            for(let i=0; i<qCount; i++) {
                const node = document.createElement('div');
                node.className = 'flex items-center gap-1';
                const circle = document.createElement('div');
                circle.className = `w-8 h-8 rounded-full flex items-center justify-center font-black text-sm border-2 transition-all duration-300 ${i < currentQIndex ? 'bg-green-500 border-green-500 text-white shadow-md' : (i === currentQIndex ? 'bg-yellow-300 border-yellow-400 text-yellow-800 shadow-md scale-110' : 'bg-gray-100 border-gray-200 text-gray-400')}`;
                // 已完成顯示打勾
                circle.innerHTML = i < currentQIndex ? '<i class="fa-solid fa-check"></i>' : (i + 1);
                node.appendChild(circle);
                container.appendChild(node);
            }
        }

        function renderQuestion() {
            const level = idLevels[state.currentLevelIndex];
            if(currentQIndex >= level.questions.length) {
                showLevelComplete();
                return;
            }

            const qData = level.questions[currentQIndex];
            const area = document.getElementById('interactive-area');
            const hintArea = document.getElementById('hint-content');
            const feedback = document.getElementById('feedback-area');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            area.innerHTML = ''; 
            feedback.className = 'hidden'; 
            submitBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            if(retryBtn) retryBtn.classList.add('hidden');
            userSequence = [];
            globalSelectedObj = null;
            
            renderProgressNodes(level);
            hintArea.innerText = qData.hint || "請仔細看看，動手試試看！";
            
            // 自動播放題目提示音 (延遲一點讓畫面先渲染)
            setTimeout(() => playTTS(), 500);
            
            if (level.type === 'drag-category') renderCategory(qData, area, submitBtn);
            else if (level.type === 'choice') renderChoice(qData, area);
            else if (level.type === 'sequence') renderSequence(qData, area, submitBtn);
            else if (level.type === 'memory') renderShoppingMemory(qData, area, submitBtn);
            else if (level.type === 'fill-blank') renderFillBlank(qData, area, submitBtn);
        }

        // ==========================================
        // 4. 題型引擎區
        // ==========================================
        
        // 引擎 A: 拖曳分類 (專為SEN優化，卡片更大，視覺回饋更強)
        function renderCategory(qData, container, submitBtn) {
            const boxesContainer = document.createElement('div');
            boxesContainer.className = 'flex flex-col sm:flex-row gap-6 w-full justify-center mb-8';

            let categoryMap = {}; 
            
            qData.categories.forEach(cat => {
                categoryMap[cat] = [];
                const boxWrapper = document.createElement('div');
                boxWrapper.className = 'flex flex-col items-center flex-1 w-full sm:max-w-[250px]';
                
                // 籃子樣式
                const box = document.createElement('div');
                box.className = 'drop-zone w-full min-h-[160px] border-4 border-dashed border-orange-300 rounded-3xl flex flex-col items-center p-3 bg-orange-50 shadow-sm transition relative overflow-hidden';
                box.innerHTML = `
                    <div class="bg-white rounded-full w-14 h-14 flex items-center justify-center mb-2 shadow-sm pointer-events-none">
                        <i class="fa-solid fa-basket-shopping text-3xl text-orange-400"></i>
                    </div>
                    <span class="font-black text-lg bg-orange-200 text-orange-800 px-4 py-1 rounded-full pointer-events-none">${cat}</span>
                `;
                
                const itemContainer = document.createElement('div');
                itemContainer.className = 'w-full flex flex-wrap justify-center gap-2 mt-4 pointer-events-none';
                box.appendChild(itemContainer);

                box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('dragover'); });
                box.addEventListener('dragleave', () => { box.classList.remove('dragover'); });
                box.addEventListener('drop', (e) => {
                    e.preventDefault(); box.classList.remove('dragover');
                    const wordText = e.dataTransfer.getData('text/plain');
                    if(wordText) processCategoryDrop(wordText, cat, itemContainer);
                });
                box.addEventListener('click', () => {
                    if(globalSelectedObj) processCategoryDrop(globalSelectedObj.dataset.text, cat, itemContainer, globalSelectedObj);
                });

                boxWrapper.appendChild(box);
                boxesContainer.appendChild(boxWrapper);
            });

            // 下方物品區
            const wordsContainer = document.createElement('div');
            wordsContainer.className = 'flex flex-wrap gap-4 w-full justify-center min-h-[80px] bg-gray-100 p-6 rounded-3xl shadow-inner border-2 border-gray-200';
            
            qData.words.forEach(w => {
                const wordBlock = document.createElement('div');
                wordBlock.className = 'draggable-item bg-white text-gray-800 border-2 border-orange-200 font-black text-xl py-3 px-5 rounded-2xl shadow-md select-none transition flex items-center gap-3';
                wordBlock.draggable = true;
                wordBlock.dataset.text = w.text;
                
                wordBlock.innerHTML = `
                    <span>${w.text}</span>
                    <button class="tts-btn bg-sky-100 hover:bg-sky-200 text-sky-600 rounded-full w-8 h-8 flex items-center justify-center transition shrink-0" title="讀出來">
                        <i class="fa-solid fa-volume-high text-sm pointer-events-none"></i>
                    </button>
                `;

                wordBlock.querySelector('.tts-btn').addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    playTTS(w.text);
                });
                
                wordBlock.addEventListener('dragstart', (e) => { 
                    e.dataTransfer.setData('text/plain', w.text); 
                    wordBlock.style.opacity = '0.5'; 
                    clearSelection();
                });
                wordBlock.addEventListener('dragend', (e) => { e.target.style.opacity = '1'; });
                
                wordBlock.addEventListener('click', (e) => {
                    e.stopPropagation();
                    clearSelection();
                    wordBlock.classList.add('selected'); 
                    globalSelectedObj = wordBlock;
                    // 點擊也給予語音回饋
                    playTTS("你選了：" + w.text + "。請點擊對應的籃子。");
                });

                wordsContainer.appendChild(wordBlock);
            });

            container.appendChild(boxesContainer);
            container.appendChild(wordsContainer);
            
            const hintNode = document.createElement('p');
            hintNode.className = 'text-sm font-bold text-orange-600 mt-2 text-center w-full bg-yellow-100/50 p-3 rounded-xl border border-yellow-200';
            hintNode.innerHTML = '👉 玩法：可以用手指「拉」物品到籃子，或者「先點物品，再點籃子」。';
            container.appendChild(hintNode);

            function processCategoryDrop(wordText, targetCat, targetContainer, selectedObj = null) {
                const wordData = qData.words.find(w => w.text === wordText);
                if (!wordData) return;

                const sourceEl = selectedObj || wordsContainer.querySelector(`[data-text="${wordText}"]`);
                if (!sourceEl) return;

                if (wordData.cat === targetCat) {
                    // 答對了
                    sourceEl.className = 'bg-green-100 text-green-800 border-2 border-green-400 font-black text-base py-2 px-3 rounded-xl shadow-sm m-1 flex items-center justify-center';
                    sourceEl.draggable = false;
                    sourceEl.onclick = null; 
                    const btn = sourceEl.querySelector('.tts-btn');
                    if (btn) btn.style.display = 'none';
                    
                    targetContainer.appendChild(sourceEl);
                    playTTS("叻仔！放啱咗啦。");
                    
                    if (wordsContainer.children.length === 0) {
                        setTimeout(() => handleResult(true), 500);
                    }
                } else {
                    // 答錯
                    playTTS("唔啱喎，再試下！");
                    sourceEl.classList.add('animate-shake', 'bg-red-100', 'border-red-500');
                    setTimeout(() => {
                        sourceEl.classList.remove('animate-shake', 'bg-red-100', 'border-red-500', 'selected');
                    }, 500);
                }
                clearSelection();
            }

            function clearSelection() {
                document.querySelectorAll('.draggable-item').forEach(el => {
                    el.classList.remove('selected');
                });
                globalSelectedObj = null;
            }
        }

        // 引擎 B: 選擇題 (選項字體加大，加入Emoji，視覺清晰)
        function renderChoice(qData, container) {
            const qText = document.createElement('div');
            qText.className = 'bg-orange-50 border-l-8 border-orange-400 p-5 rounded-2xl shadow-sm w-full mb-6 relative whitespace-pre-wrap';
            qText.innerHTML = `<p class="text-xl sm:text-2xl font-black text-gray-800 leading-normal">${qData.q}</p>`;

            const optsDiv = document.createElement('div');
            optsDiv.className = 'flex flex-col gap-4 w-full';

            qData.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'text-left w-full p-4 sm:p-6 border-4 border-gray-200 rounded-2xl hover:border-orange-400 hover:bg-orange-50 transition text-gray-700 font-black text-lg sm:text-xl flex gap-4 items-center bg-white relative shadow-sm';
                
                btn.innerHTML = `
                    <div class="indicator-icon w-8 h-8 rounded-full border-4 border-gray-300 flex items-center justify-center shrink-0 transition-colors bg-gray-50"></div> 
                    <span class="flex-1">${optText}</span>
                    <div class="tts-btn bg-sky-100 text-sky-600 hover:bg-sky-200 rounded-full w-12 h-12 flex items-center justify-center transition shrink-0 shadow-sm z-10" title="讀出來">
                        <i class="fa-solid fa-volume-high text-lg pointer-events-none"></i>
                    </div>
                `;
                
                btn.querySelector('.tts-btn').addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    playTTS(optText);
                });

                btn.onclick = (e) => {
                    if (e.target.closest('.tts-btn')) return;

                    // 鎖定所有按鈕
                    const allBtns = optsDiv.querySelectorAll('button');
                    allBtns.forEach(b => b.style.pointerEvents = 'none');
                    
                    const iconDiv = btn.querySelector('.indicator-icon');
                    
                    if (idx === qData.answer) {
                        btn.classList.replace('border-gray-200', 'border-green-500');
                        btn.classList.add('bg-green-50', 'text-green-800');
                        iconDiv.classList.replace('border-gray-300', 'border-green-500');
                        iconDiv.classList.replace('bg-gray-50', 'bg-green-500');
                        iconDiv.innerHTML = '<i class="fa-solid fa-check text-white text-base"></i>';
                        handleResult(true);
                    } else {
                        btn.classList.replace('border-gray-200', 'border-red-500');
                        btn.classList.add('bg-red-50', 'text-red-800');
                        iconDiv.classList.replace('border-gray-300', 'border-red-500');
                        iconDiv.classList.replace('bg-gray-50', 'bg-red-500');
                        iconDiv.innerHTML = '<i class="fa-solid fa-xmark text-white text-base"></i>';
                        handleResult(false);
                    }
                };
                optsDiv.appendChild(btn);
            });
            container.appendChild(qText);
            container.appendChild(optsDiv);
        }

        // 引擎 C: 排序題 (使用數字與大圖塊)
        function renderSequence(qData, container, submitBtn) {
            container.innerHTML = `<p class="text-lg font-black text-orange-600 mb-4 bg-orange-100 p-3 rounded-xl w-full text-center">任務主題：${qData.orig || ''}</p>`;
            
            const targetArea = document.createElement('div');
            targetArea.className = 'w-full min-h-[100px] bg-white border-4 border-dashed border-orange-300 rounded-2xl p-4 flex flex-col gap-3 mb-6 items-center shadow-inner transition-all';
            
            const sourceArea = document.createElement('div');
            sourceArea.className = 'flex flex-wrap gap-3 justify-center bg-gray-100 p-5 rounded-2xl border-2 border-gray-200 w-full';
            
            // 打亂順序
            let availableWords = [...qData.words].sort(() => Math.random() - 0.5);
            let isChecking = false;

            function updateView() {
                if(isChecking) return;
                
                targetArea.innerHTML = '';
                sourceArea.innerHTML = '';
                
                // 顯示已選區域
                userSequence.forEach((word, index) => {
                    const el = document.createElement('div');
                    el.className = 'w-full max-w-md bg-green-500 text-white px-4 py-3 rounded-xl font-black text-lg shadow-md cursor-pointer hover:bg-green-600 transition flex items-center justify-between';
                    el.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="bg-white text-green-600 w-8 h-8 rounded-full flex items-center justify-center shadow-inner">${index + 1}</span>
                            <span>${word}</span>
                        </div>
                        <div class="tts-btn bg-black/20 hover:bg-black/40 text-white rounded-full w-8 h-8 flex items-center justify-center transition shrink-0" title="讀出來">
                            <i class="fa-solid fa-volume-high text-xs pointer-events-none"></i>
                        </div>
                    `;
                    
                    el.querySelector('.tts-btn').addEventListener('click', (e) => { e.stopPropagation(); playTTS(word); });
                    // 點擊退回
                    el.onclick = () => { 
                        playTTS("拿走");
                        userSequence.splice(index, 1); availableWords.push(word); updateView(); 
                    };
                    targetArea.appendChild(el);
                });

                // 顯示未選區域
                availableWords.forEach((word, index) => {
                    const el = document.createElement('div');
                    el.className = 'bg-white border-4 border-orange-200 text-gray-800 px-4 py-3 rounded-xl font-black text-lg shadow-sm cursor-pointer hover:border-orange-400 hover:bg-orange-50 transition flex items-center gap-3';
                    el.innerHTML = `
                        <span>${word}</span>
                        <div class="tts-btn bg-sky-100 text-sky-600 hover:bg-sky-200 rounded-full w-8 h-8 flex items-center justify-center transition shrink-0" title="讀出來">
                            <i class="fa-solid fa-volume-high text-xs pointer-events-none"></i>
                        </div>
                    `;
                    
                    el.querySelector('.tts-btn').addEventListener('click', (e) => { e.stopPropagation(); playTTS(word); });
                    el.onclick = () => { 
                        playTTS("排入");
                        availableWords.splice(index, 1); userSequence.push(word); updateView(); 
                    };
                    sourceArea.appendChild(el);
                });

                if (userSequence.length === 0) {
                    targetArea.innerHTML = '<span class="text-gray-400 font-bold mt-4">請按順序點擊下方的方塊，把它們排進來</span>';
                }

                // 自動檢查機制
                if(availableWords.length === 0) {
                    isChecking = true;
                    const isCorrect = JSON.stringify(userSequence) === JSON.stringify(qData.answer);
                    
                    if(isCorrect) {
                        targetArea.classList.replace('border-orange-300', 'border-green-500');
                        targetArea.classList.add('bg-green-50');
                        targetArea.style.pointerEvents = 'none';
                        handleResult(true);
                    } else {
                        targetArea.classList.replace('border-orange-300', 'border-red-500');
                        targetArea.classList.add('bg-red-50', 'animate-shake');
                        targetArea.style.pointerEvents = 'none';
                        handleResult(false);
                    }
                }
            }
            
            container.appendChild(targetArea);
            container.appendChild(sourceArea);
            
            updateView();
            window.checkCurrentAnswer = undefined;
            submitBtn.classList.add('hidden');
        }

        // 引擎 D: 超市購物記憶 (聽覺記憶結合圖像)
        function renderShoppingMemory(qData, container, submitBtn) {
            const controls = document.createElement('div');
            controls.className = 'mb-6 w-full flex flex-col items-center gap-4 bg-blue-50 p-6 rounded-3xl border-4 border-blue-200';
            controls.innerHTML = `
                <img src="https://placehold.co/100x100/FFD700/000000?text=🛒" alt="購物車" class="w-20 h-20 rounded-full shadow-md bg-white p-2">
                <button onclick="playTTS()" class="bg-blue-500 hover:bg-blue-600 text-white font-black py-4 px-8 rounded-full shadow-lg flex items-center gap-3 text-xl animate-bounce">
                    <i class="fa-solid fa-ear-listen text-2xl"></i> 點擊聽媽媽的購物清單
                </button>
            `;
            
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-2 sm:grid-cols-3 gap-4 p-6 bg-gray-100 rounded-3xl w-full mx-auto shadow-inner border-2 border-gray-200';
            
            // 購物項目圖庫 (Emoji)
            const storeItems = [
                {id: 'milk', text: '牛奶', icon: '🥛'},
                {id: 'apple', text: '蘋果', icon: '🍎'},
                {id: 'bread', text: '麵包', icon: '🍞'},
                {id: 'banana', text: '香蕉', icon: '🍌'},
                {id: 'juice', text: '果汁', icon: '🧃'},
                {id: 'egg', text: '雞蛋', icon: '🥚'}
            ];

            const answerDisplay = document.createElement('div');
            answerDisplay.className = 'mt-6 min-h-[80px] p-4 bg-white border-4 border-dashed border-orange-400 rounded-2xl flex flex-wrap gap-4 justify-center w-full items-center shadow-inner relative';
            answerDisplay.innerHTML = '<span class="absolute top-[-15px] left-4 bg-orange-400 text-white px-3 py-1 rounded-full text-xs font-bold">我的購物籃</span>';

            storeItems.forEach(item => {
                const btnContainer = document.createElement('div');
                btnContainer.className = 'flex flex-col justify-center items-center h-28 bg-white border-4 border-gray-200 rounded-2xl shadow-sm cursor-pointer shopping-btn hover:border-orange-400';
                
                btnContainer.innerHTML = `
                    <span class="text-4xl mb-2">${item.icon}</span>
                    <span class="font-black text-gray-700">${item.text}</span>
                `;
                
                btnContainer.onclick = () => {
                    if (userSequence.length >= qData.answer.length) return;

                    // 點擊特效與發音
                    btnContainer.classList.add('memory-flash', 'bg-yellow-50', 'border-yellow-400');
                    setTimeout(() => btnContainer.classList.remove('memory-flash', 'bg-yellow-50', 'border-yellow-400'), 500);
                    playTTS("放入 " + item.text);
                    
                    userSequence.push(item.id);
                    
                    // 顯示在購物籃
                    const cartItem = document.createElement('div');
                    cartItem.className = 'w-16 h-16 flex flex-col justify-center items-center bg-gray-50 border-2 border-gray-300 rounded-xl shadow-sm animate-pulse';
                    cartItem.innerHTML = `<span class="text-2xl">${item.icon}</span><span class="text-[10px] font-bold text-gray-500">${item.text}</span>`;
                    answerDisplay.appendChild(cartItem);
                    
                    if (userSequence.length === qData.answer.length) {
                        submitBtn.classList.remove('hidden');
                        // 提示提交
                        setTimeout(() => playTTS("選好啦，請按提交答案！"), 1000);
                    }
                };
                grid.appendChild(btnContainer);
            });

            container.appendChild(controls);
            container.appendChild(grid);
            container.appendChild(answerDisplay);

            window.checkCurrentAnswer = () => {
                const isCorrect = JSON.stringify(userSequence) === JSON.stringify(qData.answer);
                handleResult(isCorrect);
                if(!isCorrect) {
                    // 答錯清空購物籃
                    answerDisplay.innerHTML = '<span class="absolute top-[-15px] left-4 bg-orange-400 text-white px-3 py-1 rounded-full text-xs font-bold">我的購物籃</span>'; 
                }
            };
        }

        // 引擎 E: 填空題 (支援點擊與拖曳，加入視覺化卡片)
        function renderFillBlank(qData, container, submitBtn) {
            let htmlText = qData.text;
            qData.blanks.forEach((ans, idx) => {
                // 加大空格，讓SEN學生容易點擊
                htmlText = htmlText.replace(`[__${idx+1}__]`, `<span class="drop-zone inline-block min-w-[120px] h-12 align-middle border-b-4 border-dashed border-orange-500 mx-2 px-3 text-center text-orange-700 font-black bg-orange-100 cursor-pointer blank-slot rounded-t-xl transition-colors shadow-inner text-xl" data-idx="${idx}"></span>`);
            });

            const textBlock = document.createElement('div');
            textBlock.className = 'text-xl sm:text-2xl leading-loose font-bold text-gray-800 bg-white p-6 sm:p-8 rounded-3xl shadow-sm w-full border-4 border-orange-100';
            textBlock.innerHTML = htmlText;

            const optionsArea = document.createElement('div');
            optionsArea.className = 'flex flex-wrap gap-4 justify-center mt-8 p-6 bg-gray-100 rounded-3xl w-full shadow-inner min-h-[100px] border-2 border-gray-200';

            let userAnswers = new Array(qData.blanks.length).fill(null);
            
            function clearSelection() {
                optionsArea.querySelectorAll('.draggable-item').forEach(el => el.classList.remove('selected'));
                globalSelectedObj = null;
            }

            function renderOptions() {
                optionsArea.innerHTML = '';
                qData.options.forEach(opt => {
                    if(!userAnswers.includes(opt)) {
                        const btn = document.createElement('div');
                        btn.className = 'draggable-item bg-white border-4 border-sky-200 text-sky-800 px-5 py-3 rounded-2xl font-black text-xl shadow-md cursor-grab select-none flex items-center gap-3';
                        btn.draggable = true;
                        
                        btn.innerHTML = `
                            <span>${opt}</span>
                            <button class="tts-btn bg-sky-100 hover:bg-sky-200 text-sky-600 rounded-full w-8 h-8 flex items-center justify-center transition shrink-0" title="讀出來">
                                <i class="fa-solid fa-volume-high text-xs pointer-events-none"></i>
                            </button>
                        `;

                        btn.querySelector('.tts-btn').addEventListener('click', (e) => {
                            e.stopPropagation();
                            playTTS(opt);
                        });
                        
                        btn.addEventListener('dragstart', (e) => {
                            e.dataTransfer.setData('text/plain', opt);
                            btn.style.opacity = '0.5';
                            clearSelection();
                        });
                        btn.addEventListener('dragend', (e) => { e.target.style.opacity = '1'; });
                        
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            clearSelection();
                            btn.classList.add('selected');
                            globalSelectedObj = btn;
                            playTTS("選了 " + opt + "，請點上面的空格。");
                        });

                        optionsArea.appendChild(btn);
                    }
                });
            }

            function setupDropZones() {
                const slots = textBlock.querySelectorAll('.blank-slot');
                slots.forEach((slot, idx) => {
                    slot.innerText = userAnswers[idx] || '';
                    if(userAnswers[idx]) {
                        slot.classList.add('bg-green-100', 'border-green-600', 'text-green-800');
                        slot.classList.remove('bg-orange-100', 'border-orange-500', 'text-orange-700');
                    } else {
                        slot.classList.remove('bg-green-100', 'border-green-600', 'text-green-800');
                        slot.classList.add('bg-orange-100', 'border-orange-500', 'text-orange-700');
                    }

                    slot.onclick = (e) => {
                        e.stopPropagation();
                        if (globalSelectedObj && !userAnswers[idx]) {
                            userAnswers[idx] = globalSelectedObj.innerText.replace(/[\n\r]+|[\s]{2,}/g, ' ').trim().split('\n')[0]; // 提取文字部分
                            clearSelection();
                            updateState();
                        } 
                        else if (userAnswers[idx]) {
                            playTTS("拿走");
                            userAnswers[idx] = null;
                            updateState();
                        }
                    };

                    slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('dragover'); });
                    slot.addEventListener('dragleave', () => { slot.classList.remove('dragover'); });
                    slot.addEventListener('drop', (e) => {
                        e.preventDefault(); 
                        slot.classList.remove('dragover');
                        const text = e.dataTransfer.getData('text/plain');
                        if(!userAnswers[idx]) {
                            userAnswers[idx] = text;
                            updateState();
                        }
                    });
                });
            }

            function updateState() {
                setupDropZones();
                renderOptions();
                if(!userAnswers.includes(null)) submitBtn.classList.remove('hidden');
                else submitBtn.classList.add('hidden');
            }

            container.appendChild(textBlock);
            container.appendChild(optionsArea);
            
            const hintNode = document.createElement('p');
            hintNode.className = 'text-sm font-bold text-orange-600 mt-2 text-center w-full bg-yellow-100/50 p-3 rounded-xl border border-yellow-200';
            hintNode.innerHTML = '👉 玩法：把詞語「拉」到空格中，或者「先點詞語，再點空格」。';
            container.appendChild(hintNode);
            
            updateState();

            window.checkCurrentAnswer = () => {
                const isCorrect = JSON.stringify(userAnswers) === JSON.stringify(qData.blanks);
                if(isCorrect) {
                    fireConfetti();
                    const fullText = qData.text.replace(/\[__\d+__\]/g, () => userAnswers.shift());
                    playTTS("叻仔！完整句子是：" + fullText);
                }
                handleResult(isCorrect);
            };
        }

        // ==========================================
        // 5. 結果判定與過場邏輯
        // ==========================================
        function handleResult(isCorrect) {
            const feedback = document.getElementById('feedback-area');
            const nextBtn = document.getElementById('next-btn');
            const submitBtn = document.getElementById('submit-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            feedback.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-300', 'bg-green-50', 'text-green-700', 'border-green-300');
            submitBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            if (retryBtn) retryBtn.classList.add('hidden');

            if(isCorrect) {
                playTTS("答對了！你好叻啊！");
                fireConfetti();
                feedback.classList.add('bg-green-50', 'text-green-700', 'border-4', 'border-green-300');
                feedback.innerHTML = '<i class="fa-solid fa-face-laugh-beam text-4xl mb-2 block text-green-500 animate-bounce"></i> 答對了！你好叻啊！';
                nextBtn.classList.remove('hidden');
            } else {
                playTTS("哎呀，唔啱喎。看提示再試一次吧。");
                feedback.classList.add('bg-red-50', 'text-red-700', 'border-4', 'border-red-300');
                feedback.innerHTML = '<i class="fa-solid fa-face-frown text-4xl mb-2 block text-red-400"></i> 哎呀，唔啱喎。再試一次吧！';
                userSequence = []; 
                if (retryBtn) retryBtn.classList.remove('hidden');
            }
        }

        function retryQuestion() {
            renderQuestion();
        }

        function nextQuestion() {
            state.energyAnswered++;
            saveProgress();
            currentQIndex++;
            renderQuestion();
        }

        function showLevelComplete() {
            playTTS("太棒了！這個任務完成啦！請在左邊選另一個任務。");
            document.getElementById('interactive-area').innerHTML = `
                <div class="text-center animate-bounce mt-10 p-8 bg-yellow-50 rounded-full border-8 border-yellow-200">
                    <i class="fa-solid fa-star text-8xl text-yellow-400 mb-4 drop-shadow-lg"></i>
                    <h2 class="text-3xl font-black text-orange-600 mb-2">任務完成！</h2>
                    <p class="text-orange-800 font-bold text-lg">你拿到了一顆星星！⭐</p>
                </div>
            `;
            document.getElementById('hint-content').innerText = "好叻仔！請在左邊的選單，揀下一個任務啦！";
            document.getElementById('feedback-area').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('submit-btn').classList.add('hidden');
            fireConfetti();
        }

        // ==========================================
        // 6. 煙火特效與純淨語音 (TTS)
        // ==========================================
        function fireConfetti() {
            const colors = ['#fde047', '#f97316', '#38bdf8', '#4ade80'];
            for(let i=0; i<60; i++) {
                let confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000); 
            }
        }

        function playTTS(customText = null) {
            const level = idLevels[state.currentLevelIndex];
            if(!level || !level.questions[currentQIndex]) return;
            const qData = level.questions[currentQIndex];
            
            let textToRead = customText;
            if(!textToRead) {
                if (qData.audioText) textToRead = qData.audioText;
                else if (level.type === 'drag-category') textToRead = qData.desc + " " + qData.hint;
                else textToRead = (qData.q || "") + " " + (qData.orig || "");
            }

            // 過濾掉所有 Emoji 與括號內的內容，讓語音朗讀不會唸出奇怪的代碼
            let cleanedText = typeof textToRead === 'string' 
                ? textToRead.replace(/[\(（].*?[\)）]/g, '')
                            .replace(/[\u{1F600}-\u{1F6FF}\u{1F300}-\u{1F5FF}\u{1F900}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F1E6}-\u{1F1FF}\u{1F200}-\u{1F251}\u{1F004}\u{1F0CF}\u{1F170}-\u{1F171}\u{1F17E}-\u{1F17F}\u{1F18E}\u{3030}\u{2B50}\u{2B55}\u{2934}-\u{2935}\u{2B05}-\u{2B07}\u{2B1B}-\u{2B1C}\u{3297}\u{3299}\u{303D}\u{00A9}\u{00AE}\u{2122}\u{23F3}\u{24C2}\u{23E9}-\u{23EF}\u{25B6}\u{23F8}-\u{23FA}]/gu, '')
                            .replace(/[1-4]️⃣/g, '') // 處理特殊數字emoji
                : textToRead;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(cleanedText);
                utterance.lang = 'zh-HK'; // 廣東話
                utterance.rate = 0.8; // 速度放慢，適合 SEN 學生
                utterance.pitch = 1.1; // 稍微提高音調顯得親切
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
