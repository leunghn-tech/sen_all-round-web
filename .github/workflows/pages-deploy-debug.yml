name: Pages deploy (debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo root files
        run: ls -la

      - name: Show index.html head if exists
        run: |
          if [ -f index.html ]; then
            echo "---- index.html (first 40 lines) ----"
            head -n 40 index.html || true
          else
            echo "index.html not found at repo root"
          fi

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: |
            .

      - name: Debug: print repo size
        run: du -sh . || true

      - name: Deploy to GitHub Pages (debug)
        uses: actions/deploy-pages@v5
        id: deploy

      - name: Show deploy outputs
        run: |
          echo "deployment_id=${{ steps.deploy.outputs.deployment_id || 'n/a' }}"
          echo "deployment_status=${{ steps.deploy.outputs.deployment_status || 'n/a' }}"
