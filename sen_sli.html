<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLI 言語障礙特工通訊局 (12大核心訓練)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 拖曳與選取互動樣式 */
        .drop-zone { transition: all 0.2s ease; }
        .drop-zone.dragover { background-color: #d1fae5; border-color: #10b981; transform: scale(1.02); }
        .draggable-item { cursor: grab; transition: transform 0.1s, box-shadow 0.1s; touch-action: none; }
        .draggable-item:active { cursor: grabbing; transform: scale(0.95); }
        .draggable-item.selected { box-shadow: 0 0 0 4px #fbbf24; transform: translateY(-2px); } /* 點擊選取狀態 */
        
        /* 記憶題按鈕特效 */
        .memory-btn:active { transform: scale(0.95); }
        .memory-flash { animation: flash 0.5s ease-in-out; }
        @keyframes flash { 0%, 100% { opacity: 1; filter: brightness(1); } 50% { opacity: 0.8; filter: brightness(1.5); box-shadow: 0 0 15px currentColor;} }

        /* 煙火特效粒子 */
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 9999; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        
        /* 錯誤震動特效 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        .pointer-events-none { pointer-events: none; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen overflow-hidden text-gray-800 font-sans">

    <!-- 頂部導航列 -->
    <nav class="bg-indigo-900 text-white shadow-md no-print z-20 shrink-0">
        <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <!-- 返回同工專區首頁按鈕 --> 
                <a href="index.html#professional" class="flex items-center gap-2 bg-indigo-800 hover:bg-indigo-700 px-3 py-2 rounded-xl transition text-indigo-100 hover:text-white shadow-inner">
                    <i class="fa-solid fa-house"></i>
                    <span class="text-[11px] sm:text-xs font-bold hidden sm:inline">返回同工專區首頁</span>
                </a>
                <div class="flex flex-col justify-center border-l border-indigo-700/50 pl-4">
                    <h1 class="text-sm sm:text-base font-black tracking-tight leading-none">SLI 言語障礙特工通訊局</h1>
                    <span class="text-[9px] text-indigo-200 font-bold block mt-1 uppercase tracking-widest">SLI Agent Training Camp</span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="resetProgress()" class="text-xs bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg font-bold transition">
                    <i class="fa-solid fa-rotate-right"></i> 重置進度
                </button>
                <button id="toggle-sidebar" class="flex items-center gap-2 bg-teal-600 hover:bg-teal-500 px-4 py-2 rounded-full text-sm font-bold transition shadow">
                    <i class="fa-solid fa-bars"></i>
                    <span class="hidden sm:inline">目錄</span>
                </button>
                <div class="flex items-center gap-3 bg-white/10 px-4 py-1.5 rounded-full">
                    <i class="fa-solid fa-bolt text-yellow-400"></i>
                    <span class="text-xs font-bold hidden sm:inline">特工電量 :</span>
                    <div class="w-24 sm:w-32 h-2.5 bg-gray-600 rounded-full overflow-hidden">
                        <div id="energy-bar" class="h-full bg-green-400 transition-all duration-500 ease-out" style="width: 0%;"></div>
                    </div>
                    <span id="energy-text" class="text-xs font-bold text-green-300">0%</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主體雙欄架構 -->
    <div class="flex flex-1 overflow-hidden relative">
        <!-- 左側邊欄 -->
        <aside id="sidebar" class="w-72 bg-white shadow-xl flex flex-col shrink-0 transition-transform duration-300 z-10 border-r border-gray-200">
            <div class="p-4 border-b border-gray-100 bg-teal-50">
                <h2 class="text-teal-800 font-bold text-sm flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved"></i> 12 大特工訓練任務
                </h2>
                <p class="text-xs text-teal-600 mt-1">進度自動儲存</p>
            </div>
            <div id="level-list" class="flex-1 overflow-y-auto p-3 space-y-4 no-scrollbar pb-20">
                <!-- 動態生成關卡選單 -->
            </div>
        </aside>

        <!-- 右側主內容區 -->
        <main class="flex-1 bg-slate-100 p-4 sm:p-6 overflow-y-auto flex flex-col">
            <div class="max-w-6xl mx-auto w-full bg-white rounded-3xl shadow-lg p-6 flex flex-col border border-gray-100 flex-1">
                
                <!-- 標題與進度 -->
                <div class="mb-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <span id="current-stage-tag" class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full mb-2 inline-block">階段</span>
                            <h2 id="current-level-title" class="text-2xl font-black text-teal-700 mb-1">載入中...</h2>
                            <p id="current-level-desc" class="text-gray-500 text-sm mb-4">任務準備中...</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 w-full flex-wrap" id="progress-nodes"></div>
                </div>

                <hr class="border-gray-200 mb-4">

                <!-- 互動區 & 提示板 -->
                <div class="flex flex-col lg:flex-row gap-6 flex-1">
                    <!-- 左半部：互動區 -->
                    <div class="flex-1 border-2 border-gray-100 rounded-2xl p-6 flex flex-col bg-gray-50 relative shadow-inner min-h-[400px]">
                        <div class="absolute top-4 right-4 z-10 flex gap-2">
                            <button onclick="checkCurrentAnswer()" id="submit-btn" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white rounded-full px-4 py-2 text-sm font-bold shadow transition">
                                <i class="fa-solid fa-check"></i> 提交答案
                            </button>
                            <button onclick="playTTS()" class="text-teal-600 hover:text-teal-800 bg-teal-100 hover:bg-teal-200 rounded-full w-10 h-10 flex items-center justify-center transition shadow-sm" title="語音朗讀">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                        <h3 class="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-gamepad text-indigo-500"></i> 特工操作台
                        </h3>
                        <!-- 動態生成題目內容 -->
                        <div id="interactive-area" class="flex-1 flex flex-col justify-center items-center gap-4 w-full"></div>
                    </div>

                    <!-- 右半部：提示板 -->
                    <div class="w-full lg:w-1/3 bg-teal-50/50 border-2 border-teal-100 rounded-2xl p-5 flex flex-col">
                        <h3 class="text-lg font-bold text-teal-800 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-lightbulb text-yellow-500"></i> 情報提示板
                        </h3>
                        <div class="bg-white rounded-xl p-4 shadow-sm border border-teal-50 flex-1 flex flex-col">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="bg-yellow-100 text-yellow-800 text-[10px] font-bold px-2 py-0.5 rounded">難度分析</span>
                                <span id="difficulty-badge" class="text-xs font-bold text-gray-500"></span>
                            </div>
                            <p id="hint-content" class="text-gray-700 text-sm leading-relaxed mb-4">任務提示將顯示於此...</p>
                            
                            <div class="mt-auto">
                                <div id="feedback-area" class="hidden p-4 rounded-xl text-sm font-bold text-center transition-all shadow-inner"></div>
                                <button id="next-btn" onclick="nextQuestion()" class="hidden w-full mt-3 bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 rounded-xl shadow transition">
                                    進入下一題 <i class="fa-solid fa-arrow-right"></i>
                                </button>
                                <button id="retry-btn" onclick="retryQuestion()" class="hidden w-full mt-3 bg-orange-500 hover:bg-orange-400 text-white font-bold py-3 rounded-xl shadow transition">
                                    <i class="fa-solid fa-rotate-right"></i> 重新作答
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // ==========================================
        // 1. 12 大關卡題庫資料 (由淺入深)
        // ==========================================
        const sliLevels = [
            // --- 第一階段：詞彙與語意訓練 ---
            {
                id: 1, stage: "第一階段：詞彙與語意訓練", title: "1. 情報歸檔室 (詞彙分類)", type: "drag-category",
                desc: "任務：將詞彙拖曳（或點擊選取）到正確的類別箱中，建立語意網絡。",
                questions: [
                    { 
                        diff: "★★☆ 綜合", 
                        categories: ["交通工具", "通訊設備", "特工武器"], 
                        words: [
                            { text: "對講機", cat: "通訊設備" },
                            { text: "私家車", cat: "交通工具" },
                            { text: "手槍", cat: "特工武器" },
                            { text: "直升機", cat: "交通工具" },
                            { text: "無人機", cat: "通訊設備" }
                        ],
                        hint: "請觀察下方 5 個積木，把它們分門別類放進適合的箱子裡。" 
                    }
                ]
            },
            {
                id: 2, stage: "第一階段：詞彙與語意訓練", title: "2. 密碼提取庫 (特徵命名)", type: "choice",
                desc: "任務：根據系統提供的 3 個特徵線索，選出最精確的名詞（解決詞窮問題）。",
                questions: [
                    { diff: "★☆☆ 基礎", q: "線索：\n1. 有四個輪子\n2. 可以在路上跑\n3. 需要入汽油", options: ["單車", "飛機", "私家車", "直升機"], answer: 2, hint: "不能飛，但可以在陸地上快速移動。" },
                    { diff: "★★☆ 中階", q: "線索：\n1. 戴在手腕上\n2. 有指針或數字\n3. 用來看時間", options: ["手銬", "手錶", "指南針", "手套"], answer: 1, hint: "滴答滴答，特工要注意任務時間！" },
                    { diff: "★★★ 高階", q: "線索：\n1. 穿在衣服裡面\n2. 很重\n3. 可以擋住子彈", options: ["雨衣", "避彈衣", "西裝", "降落傘"], answer: 1, hint: "保護特工生命安全的重要防護裝備。" }
                ]
            },
            {
                id: 3, stage: "第一階段：詞彙與語意訓練", title: "3. 裝備補給站 (量詞配對)", type: "choice",
                desc: "任務：特工常搞錯量詞！請為上方顯示的裝備選擇正確的量詞。",
                questions: [
                    { diff: "★☆☆ 基礎", q: "一 (  ) 手槍", options: ["把", "台", "架", "張"], answer: 0, hint: "有手柄可以握住的物品，通常用這個量詞。" },
                    { diff: "★★☆ 中階", q: "一 (  ) 直升機", options: ["把", "台", "架", "張"], answer: 2, hint: "有骨架結構的大型飛行機器。" },
                    { diff: "★★★ 高階", q: "一 (  ) 機密文件", options: ["本", "份", "個", "部"], answer: 1, hint: "由幾張紙組成的成套資料。" }
                ]
            },
            // --- 第二階段：句法與文法結構 ---
            {
                id: 4, stage: "第二階段：句法與文法結構", title: "4. 線路重組台 (SVO 語序)", type: "sequence",
                desc: "任務：將打亂的積木，依「主詞＋動詞＋受詞」正確文法順序排列。",
                questions: [
                    { diff: "★☆☆ 基礎", orig: "情報：描述特工與壞人的行動", words: ["壞人", "特工", "抓住", "了"], answer: ["特工", "抓住", "壞人", "了"], hint: "誰(做動作的人) + 做什麼(動作) + 誰/什麼(承受動作的人/物)。" },
                    { diff: "★★☆ 中階", orig: "情報：描述隊長與情報的關係", words: ["情報", "發現了", "隊長"], answer: ["隊長", "發現了", "情報"], hint: "想想看，是情報發現隊長，還是隊長發現情報？" },
                    { diff: "★★★ 高階", orig: "情報：描述特工制服敵人的過程", words: ["迅速地", "勇敢的特工", "敵人", "制服了"], answer: ["勇敢的特工", "迅速地", "制服了", "敵人"], hint: "加入副詞：誰(主角) + 怎樣地做 + 什麼事 + 誰(對象)。" }
                ]
            },
            {
                id: 5, stage: "第二階段：句法與文法結構", title: "5. 因果分析儀 (連接詞)", type: "choice",
                desc: "任務：選出邏輯與連接詞皆正確的下半句，完成情報報告。",
                questions: [
                    { diff: "★☆☆ 基礎", q: "「因為敵人發現我們了，...」", options: ["所以我們必須撤退。", "但是天氣很好。", "然後吃午餐。"], answer: 0, hint: "「因為...所以...」表示原因和結果。" },
                    { diff: "★★☆ 中階", q: "「雖然特工受了傷，...」", options: ["所以他回家了。", "但是他仍然完成任務。", "而且裝備很重。"], answer: 1, hint: "「雖然...但是...」表示轉折，結果出乎意料。" },
                    { diff: "★★★ 高階", q: "「如果我們能找到密碼，...」", options: ["因為門沒鎖。", "就可以打開保險箱。", "雖然任務失敗了。"], answer: 1, hint: "「如果...就...」表示假設的情況與隨之發生的結果。" }
                ]
            },
            {
                id: 6, stage: "第二階段：句法與文法結構", title: "6. 真偽辨識器 (否定句轉換)", type: "sequence",
                desc: "任務：將提供的碎片，重組成與原意「相反」的否定句。",
                questions: [
                    { diff: "★☆☆ 基礎", orig: "原意：任務已經順利完成", words: ["任務", "並未", "順利", "完成"], answer: ["任務", "並未", "順利", "完成"], hint: "不使用「不」，使用「並未」。" },
                    { diff: "★★☆ 中階", orig: "原意：所有敵人都逃跑了", words: ["沒有", "任何", "敵人", "逃跑"], answer: ["沒有", "任何", "敵人", "逃跑"], hint: "表示全盤否定，使用「沒有任何」。" },
                    { diff: "★★★ 高階", orig: "原意：特工總是準時到達", words: ["特工", "從來", "不曾", "準時", "到達"], answer: ["特工", "從來", "不曾", "準時", "到達"], hint: "表示過去到現在都沒發生過，使用「從來不曾」。" }
                ]
            },
            {
                id: 7, stage: "第二階段：句法與文法結構", title: "7. 干擾電波過濾 (音韻/形近詞)", type: "choice",
                desc: "任務：通訊受到干擾！請從發音或字形相似的選項中，選出語意正確的字填空。",
                questions: [
                    { diff: "★☆☆ 基礎", q: "特工需要去 ___ 裝備。", options: ["買", "賣", "著"], answer: 0, hint: "發音相似：特工缺少裝備，需要去商店「購置」。" },
                    { diff: "★★☆ 中階", q: "任務完成後，我們在 ___ 口集合。", options: ["窗", "穿", "村"], answer: 0, hint: "發音相似：建築物用來看外面的玻璃開口。" },
                    { diff: "★★★ 高階", q: "這份機密文件非常 ___ 要。", options: ["重", "童", "懂"], answer: 0, hint: "字形相似/發音相近：表示非常關鍵、不可缺少。" }
                ]
            },
            // --- 第三階段：聽覺記憶與語用 ---
            {
                id: 8, stage: "第三階段：聽覺記憶與語用", title: "8. 長官指令廣播 (聽覺記憶)", type: "memory",
                desc: "任務：不提供文字，點擊「語音廣播」聽取指令，並按順序點擊正確的按鈕。",
                questions: [
                    { diff: "★☆☆ 基礎", audioText: "先按紅色方形，再按藍色圓形", answer: ["red-square", "blue-circle"], hint: "記住兩個指令的顏色和形狀順序。" },
                    { diff: "★★☆ 中階", audioText: "先按綠色圓形，再按黃色三角形", answer: ["green-circle", "yellow-triangle"], hint: "記住兩個指令的順序。" },
                    { diff: "★★★ 高階", audioText: "先按藍色三角形，然後按紅色方形，最後按綠色圓形", answer: ["blue-triangle", "red-square", "green-circle"], hint: "閉上眼睛聽，在腦海中畫出三個圖形。" }
                ]
            },
            {
                id: 9, stage: "第三階段：聽覺記憶與語用", title: "9. 線人接頭點 (語用回應)", type: "choice",
                desc: "任務：選出最符合當下情境且具備「同理心」的適切回應。",
                questions: [
                    { diff: "★☆☆ 基礎", q: "線人慌張地說：「我今天把密碼本弄丟了，好煩惱。」", options: ["那是你的問題。", "哦，真糟糕。", "別急，我陪你一起找找看。"], answer: 2, hint: "對方遇到困難，我們應該提供實質幫助並安撫情緒。" },
                    { diff: "★★☆ 中階", q: "隊友受傷了說：「這個包袱太重了，我走不動。」", options: ["你太弱了吧。", "那我幫你拿一部分，我們慢慢走。", "快點走，別拖累大家。"], answer: 1, hint: "團隊合作中，要展現體諒與支援。" },
                    { diff: "★★★ 高階", q: "長官嚴肅地說：「這次任務失敗，大家都有責任。」", options: ["不關我的事，是隊長的問題。", "對不起長官，我們會檢討改進。", "對啊，天氣太差了。"], answer: 1, hint: "面對長官檢討，推卸責任不禮貌，應表達承擔與改善的態度。" }
                ]
            },
            // --- 第四階段：進階敘事與邏輯 ---
            {
                id: 10, stage: "第四階段：進階敘事與邏輯", title: "10. 案件重演室 (5W1H 提問)", type: "choice",
                desc: "任務：觀察情報，回答對應的 WH (誰/哪裡/何時/做什麼) 問題。",
                questions: [
                    { diff: "★☆☆ 基礎", q: "情報：昨晚，特工阿明在金庫裡安裝了監視器。 \n\n問題：特工『在哪裡』放置追蹤器/監視器？", options: ["昨晚", "特工阿明", "金庫裡", "安裝監視器"], answer: 2, hint: "『在哪裡』(Where) 問的是地點。" },
                    { diff: "★★☆ 中階", q: "情報：為了獲取指紋，隊長用特製膠帶黏取了玻璃杯。 \n\n問題：隊長『為什麼』要用特製膠帶？", options: ["隊長", "特製膠帶", "黏取玻璃杯", "為了獲取指紋"], answer: 3, hint: "『為什麼』(Why) 問的是目的或原因。" },
                    { diff: "★★★ 高階", q: "情報：明天早上八點，臥底將會帶著手提箱出現在火車站。 \n\n問題：臥底『何時』會出現？", options: ["火車站", "帶著手提箱", "明天早上八點", "臥底"], answer: 2, hint: "『何時』(When) 問的是時間。" }
                ]
            },
            {
                id: 11, stage: "第四階段：進階敘事與邏輯", title: "11. 監視畫面修復 (事件排序)", type: "sequence",
                desc: "任務：依照時間發生的先後邏輯，將事件正確排序。",
                questions: [

            {
                id: 15, stage: "第五階段：發音與咬字校準", title: "15. 繞口令發射站 (咬字綜合測試)", type: "sequence",
                desc: "任務：將字詞按正確順序排列，組成無懶音的繞口令。排列前可先點擊喇叭 📣 聆聽各個詞彙。",
                questions: [
                    { diff: "★★☆ 中階", orig: "🎧 請點擊特工操作台右上角的喇叭聽取語音，然後重組繞口令", audioText: "一蚊一隻龜，七蚊一隻雞", words: ["一蚊", "一隻龜", "七蚊", "一隻雞"], answer: ["一蚊", "一隻龜", "七蚊", "一隻雞"], hint: "注意聽清楚數字和動物的配對！" },
                    { diff: "★★★ 高階", orig: "🎧 請點擊特工操作台右上角的喇叭聽取語音，然後重組繞口令", audioText: "入實驗室撳緊急掣", words: ["入", "實驗室", "撳", "緊急", "掣"], answer: ["入", "實驗室", "撳", "緊急", "掣"], hint: "注意嘴型與連續動作的發音。" },
                    { diff: "★★★ 終極", orig: "🎧 請點擊特工操作台右上角的喇叭聽取語音，然後重組繞口令", audioText: "郵差叔叔送信純熟迅速送出", words: ["郵差叔叔", "送信", "純熟", "迅速", "送出"], answer: ["郵差叔叔", "送信", "純熟", "迅速", "送出"], hint: "連續的 'S' (思) 音考驗，請仔細聽並排列。" }
                ]
            }
        ];

        // ==========================================
        // 2. 全局狀態與 Local Storage
        // ==========================================
        let state = { currentLevelIndex: 0, energyAnswered: 0 };
        const totalQuestions = 30; // 概算題數

        let currentQIndex = 0;
        let userSequence = []; 
        let globalSelectedObj = null; // 用於儲存「點擊」選中的DOM，支援無拖曳操作

        document.addEventListener("DOMContentLoaded", () => {
            loadProgress();
            initSidebar();
            loadLevel(state.currentLevelIndex);
            
            document.getElementById('toggle-sidebar').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('-translate-x-full');
                sidebar.classList.toggle('hidden');
            });
        });

        function saveProgress() {
            localStorage.setItem('sliAgentState', JSON.stringify(state));
            updateEnergy();
        }

        function loadProgress() {
            const saved = localStorage.getItem('sliAgentState');
            if(saved) {
                state = JSON.parse(saved);
                if(state.currentLevelIndex >= sliLevels.length) state.currentLevelIndex = 0;
            }
            updateEnergy();
        }

        function resetProgress() {
            if(confirm("確定要重置所有特工訓練進度嗎？")) {
                state = { currentLevelIndex: 0, energyAnswered: 0 };
                saveProgress();
                initSidebar();
                loadLevel(0);
            }
        }

        function updateEnergy() {
            const bar = document.getElementById('energy-bar');
            const text = document.getElementById('energy-text');
            let percent = Math.min(Math.round((state.energyAnswered / totalQuestions) * 100), 100);
            bar.style.width = percent + '%';
            text.innerText = percent + '%';
        }

        function initSidebar() {
            const list = document.getElementById('level-list');
            list.innerHTML = '';
            let currentStage = "";
            
            sliLevels.forEach((level, index) => {
                if (level.stage !== currentStage) {
                    currentStage = level.stage;
                    const stageDiv = document.createElement('div');
                    stageDiv.className = 'text-[10px] font-black text-gray-400 mt-4 mb-2 uppercase tracking-widest pl-2';
                    stageDiv.innerText = currentStage;
                    list.appendChild(stageDiv);
                }

                const btn = document.createElement('button');
                const isActive = index === state.currentLevelIndex;
                btn.className = `w-full text-left px-3 py-2.5 rounded-xl border-2 transition font-bold text-xs sm:text-sm flex items-center gap-2 ${isActive ? 'border-orange-500 bg-orange-50 text-orange-700 shadow-md' : 'border-gray-200 bg-white hover:border-teal-300 text-gray-600'}`;
                btn.innerHTML = `<i class="fa-solid fa-unlock-keyhole text-teal-500 w-4"></i> <span class="truncate">${level.title}</span>`;
                
                btn.onclick = () => {
                    state.currentLevelIndex = index;
                    saveProgress();
                    initSidebar(); 
                    loadLevel(state.currentLevelIndex);
                };
                list.appendChild(btn);
            });
        }

        // ==========================================
        // 3. 關卡渲染控制器
        // ==========================================
        function loadLevel(levelIndex) {
            currentQIndex = 0;
            const level = sliLevels[levelIndex];
            
            document.getElementById('current-stage-tag').innerText = level.stage;
            document.getElementById('current-level-title').innerText = level.title;
            document.getElementById('current-level-desc').innerText = level.desc;
            
            renderProgressNodes(level);
            renderQuestion();
        }

        function renderProgressNodes(level) {
            const container = document.getElementById('progress-nodes');
            container.innerHTML = '';
            const qCount = level.questions.length;
            
            for(let i=0; i<qCount; i++) {
                const node = document.createElement('div');
                node.className = 'flex items-center';
                const circle = document.createElement('div');
                circle.className = `w-6 h-6 sm:w-8 sm:h-8 rounded-full flex items-center justify-center font-bold text-xs border-2 transition-colors ${i < currentQIndex ? 'bg-teal-500 border-teal-500 text-white' : (i === currentQIndex ? 'bg-white border-teal-500 text-teal-600' : 'bg-gray-100 border-gray-300 text-gray-400')}`;
                circle.innerText = i + 1;
                node.appendChild(circle);
                
                if (i < qCount - 1) {
                    const line = document.createElement('div');
                    line.className = `h-0.5 w-4 sm:w-8 transition-colors ${i < currentQIndex ? 'bg-teal-500' : 'bg-gray-300'}`;
                    node.appendChild(line);
                }
                container.appendChild(node);
            }
        }

        function renderQuestion() {
            const level = sliLevels[state.currentLevelIndex];
            if(currentQIndex >= level.questions.length) {
                showLevelComplete();
                return;
            }

            const qData = level.questions[currentQIndex];
            const area = document.getElementById('interactive-area');
            const hintArea = document.getElementById('hint-content');
            const feedback = document.getElementById('feedback-area');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            area.innerHTML = ''; 
            feedback.className = 'hidden'; 
            submitBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            if(retryBtn) retryBtn.classList.add('hidden');
            userSequence = [];
            globalSelectedObj = null;
            
            renderProgressNodes(level);
            hintArea.innerText = qData.hint || "請仔細觀察題目，完成特工任務！";
            document.getElementById('difficulty-badge').innerText = qData.diff || "";
            
            if (level.type === 'drag-category') renderCategory(qData, area, submitBtn);
            else if (level.type === 'choice') renderChoice(qData, area);
            else if (level.type === 'sequence') renderSequence(qData, area, submitBtn);
            else if (level.type === 'memory') renderMemory(qData, area, submitBtn);
            else if (level.type === 'fill-blank') renderFillBlank(qData, area, submitBtn);
        }

        // ==========================================
        // 4. 五大題型引擎
        // ==========================================
        
        // 引擎 A: 拖曳分類 (房間1) - 完全重寫修復 Bug
        function renderCategory(qData, container, submitBtn) {
            // 上方箱子區
            const boxesContainer = document.createElement('div');
            boxesContainer.className = 'flex flex-wrap gap-4 w-full justify-center mb-8';

            let categoryMap = {}; // 追蹤每個箱子的狀態
            
            qData.categories.forEach(cat => {
                categoryMap[cat] = [];
                const boxWrapper = document.createElement('div');
                boxWrapper.className = 'flex flex-col items-center flex-1 min-w-[120px] max-w-[200px]';
                
                const box = document.createElement('div');
                box.className = 'drop-zone w-full min-h-[120px] border-4 border-dashed border-indigo-300 rounded-2xl flex flex-col items-center p-2 text-indigo-800 bg-white shadow-sm transition relative overflow-hidden';
                box.innerHTML = `<i class="fa-solid fa-box-open text-2xl mb-1 mt-2 text-indigo-400 pointer-events-none"></i><span class="font-bold text-sm bg-indigo-100 px-2 rounded pointer-events-none">${cat}</span>`;
                
                const itemContainer = document.createElement('div');
                itemContainer.className = 'w-full flex flex-col gap-1 mt-2 pointer-events-none';
                box.appendChild(itemContainer);

                // 註冊 Drop & Click 事件
                box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('dragover'); });
                box.addEventListener('dragleave', () => { box.classList.remove('dragover'); });
                box.addEventListener('drop', (e) => {
                    e.preventDefault(); box.classList.remove('dragover');
                    const wordText = e.dataTransfer.getData('text/plain');
                    if(wordText) {
                        processCategoryDrop(wordText, cat, itemContainer);
                    }
                });
                box.addEventListener('click', () => {
                    if(globalSelectedObj) {
                        processCategoryDrop(globalSelectedObj.dataset.text, cat, itemContainer, globalSelectedObj);
                    }
                });

                boxWrapper.appendChild(box);
                boxesContainer.appendChild(boxWrapper);
            });

            // 下方積木區
            const wordsContainer = document.createElement('div');
            wordsContainer.className = 'flex flex-wrap gap-3 w-full justify-center min-h-[60px] bg-gray-200 p-4 rounded-xl shadow-inner';
            
            qData.words.forEach(w => {
                const wordBlock = document.createElement('div');
                wordBlock.className = 'draggable-item bg-indigo-600 text-white font-bold py-2 px-3 sm:px-4 rounded-lg shadow-lg select-none transition-colors flex items-center gap-2 pr-2';
                wordBlock.draggable = true;
                wordBlock.dataset.text = w.text;
                
                wordBlock.innerHTML = `
                    <span>${w.text}</span>
                    <button class="tts-btn bg-black/20 hover:bg-black/40 text-white rounded-full w-6 h-6 flex items-center justify-center transition shrink-0" title="朗讀選項">
                        <i class="fa-solid fa-bullhorn text-[10px] pointer-events-none"></i>
                    </button>
                `;

                // 加入專屬語音按鈕事件
                wordBlock.querySelector('.tts-btn').addEventListener('click', (e) => {
                    e.stopPropagation(); // 避免觸發點擊選取
                    playTTS(w.text);
                });
                
                // Drag 事件
                wordBlock.addEventListener('dragstart', (e) => { 
                    e.dataTransfer.setData('text/plain', w.text); 
                    wordBlock.style.opacity = '0.5'; 
                    clearSelection();
                });
                wordBlock.addEventListener('dragend', (e) => { e.target.style.opacity = '1'; });
                
                // Click (取代拖曳) 事件
                wordBlock.addEventListener('click', (e) => {
                    e.stopPropagation();
                    clearSelection();
                    wordBlock.classList.add('selected', 'bg-yellow-500'); // 點擊時變色提示
                    wordBlock.classList.remove('bg-indigo-600');
                    globalSelectedObj = wordBlock;
                });

                wordsContainer.appendChild(wordBlock);
            });

            container.appendChild(boxesContainer);
            container.appendChild(wordsContainer);
            
            const hintNode = document.createElement('p');
            hintNode.className = 'text-xs text-gray-500 mt-4 text-center w-full bg-yellow-100 p-2 rounded';
            hintNode.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> 提示：可用滑鼠「拖曳」積木到箱子，或「先點擊積木，再點擊箱子」。';
            container.appendChild(hintNode);

            // 處理掉落邏輯
            function processCategoryDrop(wordText, targetCat, targetContainer, selectedObj = null) {
                const wordData = qData.words.find(w => w.text === wordText);
                if (!wordData) return;

                const sourceEl = selectedObj || wordsContainer.querySelector(`[data-text="${wordText}"]`);
                if (!sourceEl) return;

                if (wordData.cat === targetCat) {
                    // 答對了，移動 DOM
                    sourceEl.className = 'bg-green-100 text-green-800 border border-green-500 font-bold py-1 px-2 rounded text-sm w-full shadow-sm m-0.5 flex items-center justify-center';
                    sourceEl.draggable = false;
                    sourceEl.onclick = null; // 移除點擊
                    // 答對後隱藏個別喇叭，保持整潔
                    const btn = sourceEl.querySelector('.tts-btn');
                    if (btn) btn.style.display = 'none';
                    
                    targetContainer.appendChild(sourceEl);
                    
                    // 檢查是否全部完成
                    if (wordsContainer.children.length === 0) {
                        setTimeout(() => handleResult(true), 500);
                    }
                } else {
                    // 答錯給提示 (震動特效)
                    sourceEl.classList.add('animate-shake', 'bg-red-500');
                    sourceEl.classList.remove('bg-indigo-600', 'bg-yellow-500');
                    setTimeout(() => {
                        sourceEl.classList.remove('animate-shake', 'bg-red-500');
                        sourceEl.classList.add('bg-indigo-600');
                    }, 500);
                    handleResult(false);
                }
                clearSelection();
            }

            function clearSelection() {
                document.querySelectorAll('.draggable-item').forEach(el => {
                    el.classList.remove('selected', 'bg-yellow-500');
                    // 只有還在下方容器的積木才恢復藍色
                    if(el.parentElement === wordsContainer) el.classList.add('bg-indigo-600');
                });
                globalSelectedObj = null;
            }
        }

        // 引擎 B: 選擇題 (含圖片、語音選項與懶音屏蔽解碼機制)
        function renderChoice(qData, container) {
            const level = sliLevels[state.currentLevelIndex];
            const isLispLevel = (level.id === 13 || level.id === 14);

            // 如果有圖片，先渲染圖片
            if(qData.image) {
                const img = document.createElement('img');
                img.src = qData.image;
                img.className = 'w-full max-h-48 object-cover rounded-xl shadow-sm mb-4 border-2 border-indigo-100';
                container.appendChild(img);
            }

            const qText = document.createElement('div');
            qText.className = 'bg-white border-l-4 border-indigo-500 p-4 rounded-r-xl shadow-sm w-full mb-6 relative whitespace-pre-wrap';
            qText.innerHTML = `<p class="text-base sm:text-lg font-bold text-gray-800">${qData.q}</p>`;

            const optsDiv = document.createElement('div');
            optsDiv.className = 'flex flex-col gap-3 w-full';

            qData.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'text-left w-full p-3 sm:p-4 border-2 border-gray-200 rounded-xl hover:border-indigo-400 hover:bg-indigo-50 transition text-gray-700 font-medium flex gap-3 items-center bg-white relative';
                
                // 懶音特訓（13、14關）：初始化只顯示拼音部分
                let initialTextToShow = optText;
                if (isLispLevel) {
                    const match = optText.match(/[\(（].*?[\)）]/);
                    if (match) {
                        initialTextToShow = match[0]; // 只提取出 "(Naam4)"
                    }
                }

                // 加入選項文字與喇叭按鈕
                btn.innerHTML = `
                    <div class="indicator-icon w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center shrink-0 transition-colors"></div> 
                    <span class="text-sm sm:text-base flex-1 option-display-text">${initialTextToShow}</span>
                    <div class="tts-btn bg-indigo-100 text-indigo-600 hover:bg-indigo-200 rounded-full w-8 h-8 flex items-center justify-center transition shrink-0 shadow-sm z-10" title="朗讀選項">
                        <i class="fa-solid fa-bullhorn text-xs pointer-events-none"></i>
                    </div>
                `;
                
                // 獨立處理喇叭點擊事件
                btn.querySelector('.tts-btn').addEventListener('click', (e) => {
                    e.stopPropagation(); // 阻止選項被選擇
                    playTTS(optText);
                });

                btn.onclick = (e) => {
                    if (e.target.closest('.tts-btn')) return;

                    // 鎖定所有按鈕
                    const allBtns = optsDiv.querySelectorAll('button');
                    allBtns.forEach(b => b.style.pointerEvents = 'none');
                    
                    // 觸發「解碼」顯示原本被屏蔽的中文字
                    if (isLispLevel) {
                        allBtns.forEach((b, sIdx) => {
                            const optSpan = b.querySelector('.option-display-text');
                            if(optSpan) optSpan.innerText = qData.options[sIdx];
                        });
                    }

                    const iconDiv = btn.querySelector('.indicator-icon');
                    
                    if (idx === qData.answer) {
                        btn.classList.remove('border-gray-200', 'hover:border-indigo-400', 'hover:bg-indigo-50');
                        btn.classList.add('border-green-500', 'bg-green-50', 'text-green-800');
                        iconDiv.classList.remove('border-gray-300');
                        iconDiv.classList.add('bg-green-500', 'border-green-500');
                        iconDiv.innerHTML = '<i class="fa-solid fa-check text-white text-[10px]"></i>';
                        handleResult(true);
                    } else {
                        btn.classList.remove('border-gray-200', 'hover:border-indigo-400', 'hover:bg-indigo-50');
                        btn.classList.add('border-red-500', 'bg-red-50', 'text-red-800');
                        iconDiv.classList.remove('border-gray-300');
                        iconDiv.classList.add('bg-red-500', 'border-red-500');
                        iconDiv.innerHTML = '<i class="fa-solid fa-xmark text-white text-[10px]"></i>';
                        handleResult(false);
                    }
                };
                optsDiv.appendChild(btn);
            });
            container.appendChild(qText);
            container.appendChild(optsDiv);
        }

        // 引擎 C: 排序題 (採用點擊重組代替複雜拖曳)
        function renderSequence(qData, container, submitBtn) {
            container.innerHTML = `<p class="text-sm font-bold text-gray-600 mb-2">請將以下情報重新組合：<br/><span class="text-indigo-600 text-lg">${qData.orig || ''}</span></p>`;
            
            const targetArea = document.createElement('div');
            targetArea.className = 'w-full min-h-[80px] bg-white border-2 border-dashed border-indigo-300 rounded-xl p-4 flex flex-wrap gap-2 mb-6 items-center shadow-inner transition-all';
            
            const sourceArea = document.createElement('div');
            sourceArea.className = 'flex flex-wrap gap-3 justify-center bg-gray-100 p-4 rounded-xl transition-all';
            
            let availableWords = [...qData.words].sort(() => Math.random() - 0.5);
            let isChecking = false;

            function updateView() {
                if(isChecking) return;
                
                targetArea.innerHTML = '';
                sourceArea.innerHTML = '';
                
                userSequence.forEach((word, index) => {
                    const el = document.createElement('div');
                    el.className = 'bg-indigo-500 text-white px-3 py-2 rounded-lg font-bold shadow cursor-pointer hover:bg-indigo-600 transition flex items-center gap-2 pr-2';
                    el.innerHTML = `<span>${word}</span><div class="tts-btn bg-black/20 hover:bg-black/40 text-white rounded-full w-6 h-6 flex items-center justify-center transition shrink-0" title="朗讀"><i class="fa-solid fa-bullhorn text-[10px] pointer-events-none"></i></div>`;
                    
                    el.querySelector('.tts-btn').addEventListener('click', (e) => { e.stopPropagation(); playTTS(word); });
                    el.onclick = () => { userSequence.splice(index, 1); availableWords.push(word); updateView(); };
                    targetArea.appendChild(el);
                });

                availableWords.forEach((word, index) => {
                    const el = document.createElement('div');
                    el.className = 'bg-white border-2 border-gray-300 text-gray-700 px-3 py-2 rounded-lg font-bold shadow-sm cursor-pointer hover:border-indigo-400 transition flex items-center gap-2 pr-2';
                    el.innerHTML = `<span>${word}</span><div class="tts-btn bg-gray-100 text-gray-500 hover:bg-gray-200 hover:text-indigo-500 rounded-full w-6 h-6 flex items-center justify-center transition shrink-0" title="朗讀"><i class="fa-solid fa-bullhorn text-[10px] pointer-events-none"></i></div>`;
                    
                    el.querySelector('.tts-btn').addEventListener('click', (e) => { e.stopPropagation(); playTTS(word); });
                    el.onclick = () => { availableWords.splice(index, 1); userSequence.push(word); updateView(); };
                    sourceArea.appendChild(el);
                });

                // 自動檢查機制
                if(availableWords.length === 0) {
                    isChecking = true;
                    const isCorrect = JSON.stringify(userSequence) === JSON.stringify(qData.answer);
                    
                    if(isCorrect) {
                        targetArea.classList.replace('border-indigo-300', 'border-green-500');
                        targetArea.classList.add('bg-green-50');
                        targetArea.style.pointerEvents = 'none';
                        handleResult(true);
                    } else {
                        targetArea.classList.replace('border-indigo-300', 'border-red-500');
                        targetArea.classList.add('bg-red-50', 'animate-shake');
                        targetArea.style.pointerEvents = 'none';
                        handleResult(false);
                    }
                }
            }
            
            container.appendChild(targetArea);
            container.appendChild(sourceArea);
            
            const hintNode = document.createElement('p');
            hintNode.className = 'text-xs text-gray-400 mt-4 w-full text-center';
            hintNode.innerHTML = '💡 依序點擊下方白色積木放入框中；點擊藍色積木可退回。';
            container.appendChild(hintNode);
            
            updateView();
            window.checkCurrentAnswer = undefined;
            submitBtn.classList.add('hidden');
        }

        // 引擎 D: 聽覺記憶 (選完後在下方方格顯示所選圖案並需要按「提交答案」來核對)
        function renderMemory(qData, container, submitBtn) {
            const controls = document.createElement('div');
            controls.className = 'mb-6 w-full flex flex-col items-center';
            controls.innerHTML = `<button onclick="playTTS()" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-4 px-8 rounded-full shadow-lg flex items-center gap-3 text-lg animate-bounce"><i class="fa-solid fa-volume-high text-2xl"></i> 點此播放長官指令</button>`;
            
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-3 gap-4 p-6 bg-gray-200 rounded-3xl w-full max-w-sm mx-auto shadow-inner';
            
            const shapes = [
                {id: 'red-square', color: 'bg-red-500', rounded: 'rounded-md'},
                {id: 'blue-circle', color: 'bg-blue-500', rounded: 'rounded-full'},
                {id: 'yellow-triangle', color: 'border-b-[50px] border-b-yellow-400 border-l-[30px] border-l-transparent border-r-[30px] border-r-transparent w-0 h-0', isTriangle: true},
                {id: 'green-circle', color: 'bg-green-500', rounded: 'rounded-full'},
                {id: 'red-circle', color: 'bg-red-500', rounded: 'rounded-full'},
                {id: 'blue-triangle', color: 'border-b-[50px] border-b-blue-500 border-l-[30px] border-l-transparent border-r-[30px] border-r-transparent w-0 h-0', isTriangle: true}
            ];

            const smallShapeMap = {
                'red-square': 'bg-red-500 rounded-sm w-4 h-4',
                'blue-circle': 'bg-blue-500 rounded-full w-4 h-4',
                'yellow-triangle': 'border-b-[16px] border-b-yellow-400 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent w-0 h-0',
                'green-circle': 'bg-green-500 rounded-full w-4 h-4',
                'red-circle': 'bg-red-500 rounded-full w-4 h-4',
                'blue-triangle': 'border-b-[16px] border-b-blue-500 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent w-0 h-0'
            };

            const answerDisplay = document.createElement('div');
            answerDisplay.className = 'mt-6 h-10 flex gap-3 justify-center w-full items-center';

            shapes.forEach(s => {
                const btnContainer = document.createElement('div');
                btnContainer.className = 'flex justify-center items-center h-20 w-20 bg-white rounded-2xl shadow-md cursor-pointer memory-btn transition hover:bg-gray-50';
                
                const shapeEl = document.createElement('div');
                if(s.isTriangle) shapeEl.className = s.color;
                else shapeEl.className = `w-12 h-12 ${s.color} ${s.rounded}`;
                
                btnContainer.appendChild(shapeEl);
                btnContainer.onclick = () => {
                    if (userSequence.length >= qData.answer.length) return;

                    btnContainer.classList.add('memory-flash');
                    setTimeout(() => btnContainer.classList.remove('memory-flash'), 500);
                    
                    userSequence.push(s.id);
                    
                    const wrap = document.createElement('div');
                    wrap.className = 'w-8 h-8 flex justify-center items-center bg-white border-2 border-gray-200 rounded-md shadow-sm animate-pulse';
                    const innerShape = document.createElement('div');
                    innerShape.className = smallShapeMap[s.id];
                    wrap.appendChild(innerShape);
                    
                    answerDisplay.appendChild(wrap);
                    
                    if (userSequence.length === qData.answer.length) {
                        submitBtn.classList.remove('hidden');
                    }
                };
                grid.appendChild(btnContainer);
            });

            container.appendChild(controls);
            container.appendChild(grid);
            container.appendChild(answerDisplay);

            window.checkCurrentAnswer = () => {
                const isCorrect = JSON.stringify(userSequence) === JSON.stringify(qData.answer);
                handleResult(isCorrect);
                if(!isCorrect) {
                    answerDisplay.innerHTML = ''; 
                }
            };
        }

        // 引擎 E: 填空題 (支援拖曳與點擊)
        function renderFillBlank(qData, container, submitBtn) {
            let htmlText = qData.text;
            qData.blanks.forEach((ans, idx) => {
                htmlText = htmlText.replace(`[__${idx+1}__]`, `<span class="drop-zone inline-block min-w-[90px] h-10 align-middle border-b-4 border-dashed border-indigo-400 mx-1 px-2 text-center text-indigo-700 font-bold bg-indigo-50/50 cursor-pointer blank-slot rounded-t-md transition-colors" data-idx="${idx}"></span>`);
            });

            const textBlock = document.createElement('div');
            textBlock.className = 'text-lg sm:text-xl leading-loose text-gray-800 bg-white p-6 rounded-2xl shadow-sm w-full border-2 border-gray-100';
            textBlock.innerHTML = htmlText;

            const optionsArea = document.createElement('div');
            optionsArea.className = 'flex flex-wrap gap-3 justify-center mt-6 p-5 bg-gray-100 rounded-xl w-full shadow-inner min-h-[80px]';

            let userAnswers = new Array(qData.blanks.length).fill(null);
            
            function clearSelection() {
                optionsArea.querySelectorAll('.draggable-item').forEach(el => el.classList.remove('selected'));
                globalSelectedObj = null;
            }

            function renderOptions() {
                optionsArea.innerHTML = '';
                qData.options.forEach(opt => {
                    if(!userAnswers.includes(opt)) {
                        const btn = document.createElement('div');
                        btn.className = 'draggable-item bg-indigo-600 text-white px-4 py-2.5 rounded-lg font-bold shadow-md cursor-grab select-none flex items-center gap-2 pr-2';
                        btn.draggable = true;
                        
                        btn.innerHTML = `
                            <span>${opt}</span>
                            <button class="tts-btn bg-black/20 hover:bg-black/40 text-white rounded-full w-6 h-6 flex items-center justify-center transition shrink-0" title="朗讀">
                                <i class="fa-solid fa-bullhorn text-[10px] pointer-events-none"></i>
                            </button>
                        `;

                        btn.querySelector('.tts-btn').addEventListener('click', (e) => {
                            e.stopPropagation();
                            playTTS(opt);
                        });
                        
                        btn.addEventListener('dragstart', (e) => {
                            e.dataTransfer.setData('text/plain', opt);
                            btn.style.opacity = '0.5';
                            clearSelection();
                        });
                        btn.addEventListener('dragend', (e) => { e.target.style.opacity = '1'; });
                        
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            clearSelection();
                            btn.classList.add('selected');
                            globalSelectedObj = btn;
                        });

                        optionsArea.appendChild(btn);
                    }
                });
            }

            function setupDropZones() {
                const slots = textBlock.querySelectorAll('.blank-slot');
                slots.forEach((slot, idx) => {
                    slot.innerText = userAnswers[idx] || '';
                    if(userAnswers[idx]) {
                        slot.classList.add('bg-indigo-100', 'border-indigo-600');
                    } else {
                        slot.classList.remove('bg-indigo-100', 'border-indigo-600');
                    }

                    slot.onclick = (e) => {
                        e.stopPropagation();
                        if (globalSelectedObj && !userAnswers[idx]) {
                            userAnswers[idx] = globalSelectedObj.innerText;
                            clearSelection();
                            updateState();
                        } 
                        else if (userAnswers[idx]) {
                            userAnswers[idx] = null;
                            updateState();
                        }
                    };

                    slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('dragover'); });
                    slot.addEventListener('dragleave', () => { slot.classList.remove('dragover'); });
                    slot.addEventListener('drop', (e) => {
                        e.preventDefault(); 
                        slot.classList.remove('dragover');
                        const text = e.dataTransfer.getData('text/plain');
                        if(!userAnswers[idx]) {
                            userAnswers[idx] = text;
                            updateState();
                        }
                    });
                });
            }

            function updateState() {
                setupDropZones();
                renderOptions();
                if(!userAnswers.includes(null)) submitBtn.classList.remove('hidden');
                else submitBtn.classList.add('hidden');
            }

            container.appendChild(textBlock);
            container.appendChild(optionsArea);
            
            const hintNode = document.createElement('p');
            hintNode.className = 'text-xs text-gray-500 mt-4 text-center w-full bg-yellow-100 p-2 rounded';
            hintNode.innerHTML = '<i class="fa-solid fa-hand-pointer"></i> 提示：將詞彙「拖曳」到空格中，或「先點擊詞彙，再點擊空格」。';
            container.appendChild(hintNode);
            
            updateState();

            window.checkCurrentAnswer = () => {
                const isCorrect = JSON.stringify(userAnswers) === JSON.stringify(qData.blanks);
                if(isCorrect) {
                    fireConfetti();
                    const fullText = qData.text.replace(/\[__\d+__\]/g, () => userAnswers.shift());
                    playTTS("任務圓滿成功！報告內容是：" + fullText);
                }
                handleResult(isCorrect);
            };
        }

        // ==========================================
        // 5. 結果判定與過場邏輯
        // ==========================================
        function handleResult(isCorrect) {
            const feedback = document.getElementById('feedback-area');
            const nextBtn = document.getElementById('next-btn');
            const submitBtn = document.getElementById('submit-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            feedback.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-green-50', 'text-green-700', 'border-green-200');
            submitBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            if (retryBtn) retryBtn.classList.add('hidden');

            if(isCorrect) {
                feedback.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
                feedback.innerHTML = '<i class="fa-solid fa-circle-check text-xl mb-1 block"></i> 答對了！特工做得好！';
                nextBtn.classList.remove('hidden');
            } else {
                feedback.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
                feedback.innerHTML = '<i class="fa-solid fa-circle-xmark text-xl mb-1 block"></i> 哎呀，不對喔！請看提示重試。';
                userSequence = []; 
                if (retryBtn) retryBtn.classList.remove('hidden');
            }
        }

        function retryQuestion() {
            renderQuestion();
        }

        function nextQuestion() {
            state.energyAnswered++;
            saveProgress();
            currentQIndex++;
            renderQuestion();
        }

        function showLevelComplete() {
            document.getElementById('interactive-area').innerHTML = `
                <div class="text-center animate-bounce mt-10">
                    <i class="fa-solid fa-trophy text-6xl text-yellow-400 mb-4 drop-shadow-md"></i>
                    <h2 class="text-2xl font-black text-gray-800 mb-2">任務完成！</h2>
                    <p class="text-gray-500 font-bold bg-gray-200 inline-block px-4 py-1 rounded-full text-sm">此訓練室已清理完畢</p>
                </div>
            `;
            document.getElementById('hint-content').innerText = "特工表現優異！請從左側目錄選擇下一關卡繼續挑戰。";
            document.getElementById('feedback-area').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('submit-btn').classList.add('hidden');
        }

        // ==========================================
        // 6. 煙火特效與語音 (TTS)
        // ==========================================
        function fireConfetti() {
            const colors = ['#fce18a', '#ff726d', '#b48def', '#f4306d'];
            for(let i=0; i<50; i++) {
                let confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000); 
            }
        }

        function playTTS(customText = null) {
            const level = sliLevels[state.currentLevelIndex];
            if(!level || !level.questions[currentQIndex]) return;
            const qData = level.questions[currentQIndex];
            
            let textToRead = customText;
            if(!textToRead) {
                if (qData.audioText) textToRead = qData.audioText;
                else if (level.type === 'drag-category') textToRead = qData.hint;
                else textToRead = (qData.q || "") + " " + (qData.orig || "請看畫面操作。");
            }

            // 過濾拼音，專注讀中文字
            let cleanedText = typeof textToRead === 'string' ? textToRead.replace(/[\(（].*?[\)）]/g, '') : textToRead;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(cleanedText);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.85; // 適合言語障礙學生聆聽
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
