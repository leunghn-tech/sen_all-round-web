<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASD 專注力特工訓練基地 | SEN Care Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; background-color: #f1f5f9; color: #334155; }
        
        h1, h2, h3, h4, h5, h6, p, .subtitle, .desc-text {
            word-wrap: break-word !important;
            overflow-wrap: break-word !important;
            white-space: normal !important;
            max-width: 100% !important;
        }
        .whitespace-nowrap { white-space: nowrap !important; }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .room-card { transition: all 0.3s ease; cursor: pointer; background-color: #ffffff; border: 1px solid #e2e8f0; }
        .room-card:hover { border-color: #0d9488; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .room-card.active { border-color: #0d9488; background-color: #f0fdfa; box-shadow: inset 4px 0 0 #0d9488, 0 4px 6px -1px rgba(0, 0, 0, 0.05); }

        #canvasContainer { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            overflow-y: auto !important; 
            overflow-x: hidden; 
            background-color: #e2e8f0; 
        }

        #posterScaleWrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100%;
            padding: 20px 0 60px 0;
            transform: none !important; 
        }

        #posterPrintArea {
            width: 92% !important;
            max-width: 780px !important;  
            margin: 20px auto !important;
            min-height: 80vh !important;
            height: auto !important;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            position: relative !important;
            top: auto !important;
            left: auto !important;
            transform: none !important;
            overflow: visible !important;
        }

        .room-content-wrapper {
            padding: 15px 20px !important;
            padding-bottom: 60px !important; 
        }
        .main-card, .sub-card {
            padding: 15px 20px !important;
            border-radius: 16px !important;
            border-width: 3px !important;
        }

        .level-nodes-container {
            display: flex !important;
            justify-content: space-around !important; 
            align-items: center !important;
            width: 100% !important;
            padding: 15px 5px !important;
            gap: 8px !important; 
            box-sizing: border-box !important;
        }

        .level-node-btn {
            width: 36px !important;
            height: 36px !important;
            line-height: 36px !important;
            font-size: 13px !important;
            flex-shrink: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            border-radius: 9999px !important;
        }

        @keyframes nodePulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.7); transform: scale(1.1); }
            50% { box-shadow: 0 0 0 10px rgba(20, 184, 166, 0); transform: scale(1.15); }
            100% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0); transform: scale(1.1); }
        }
        .node-glow { 
            animation: nodePulseGlow 1.5s infinite ease-out !important; 
            border-color: #0d9488 !important;
            color: #0d9488 !important;
            z-index: 20 !important;
        }

        /* 安全屋呼吸動畫 */
        @keyframes safeHouseBreathe {
            0% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 20px rgba(45, 212, 191, 0.3); }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 60px rgba(45, 212, 191, 0.8); }
            100% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 20px rgba(45, 212, 191, 0.3); }
        }
        .breathe-pulse { animation: safeHouseBreathe 1.5s infinite ease-in-out; } 

        /* 突發事件閃爍動畫 */
        @keyframes emergencyFlash {
            0%, 100% { border-color: #ef4444; box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); }
            50% { border-color: #fca5a5; box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        }
        .emergency-flash { animation: emergencyFlash 1.5s infinite ease-in-out; }

        #posterPrintArea h1, #posterPrintArea .main-title {
            font-size: 1.25rem !important; 
            line-height: 1.4 !important;
            margin-bottom: 0.5rem !important;
        }
        #posterPrintArea h2, #posterPrintArea h3, #posterPrintArea .subtitle {
            font-size: 1rem !important; 
            line-height: 1.4 !important;
            margin-bottom: 0.5rem !important;
        }
        #posterPrintArea p:not(.decoration-only), 
        #posterPrintArea button:not(.level-node-btn), 
        #posterPrintArea .desc-text {
            font-size: 0.95rem !important; 
            line-height: 1.5 !important;
        }
        #posterPrintArea .decoration-only {
            font-size: 4rem !important;
            margin-bottom: 0.5rem !important;
            line-height: 1 !important;
        }

        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .shake-bounce { animation: shakeBounce 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeBounce {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .scale-bounce { animation: scaleBounce 0.4s cubic-bezier(.175, .885, .32, 1.275) both; }
        @keyframes scaleBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }

        .sortable-item { cursor: grab; transition: transform 0.2s, background-color 0.2s, border-color 0.2s; }
        .sortable-item:active { cursor: grabbing; }
        .sortable-item.dragging { opacity: 0.4; transform: scale(0.98); }
        
        .blueprint-slot { min-height: 50px; border: 2px dashed #cbd5e1; border-radius: 0.5rem; transition: all 0.3s; }
        .blueprint-slot.drag-over { border-color: #8b5cf6; background-color: #f3e8ff; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col pb-12 bg-slate-50/50">

    <!-- 🛡️ 安全屋冷卻機制 Overlay -->
    <div id="safeHouseOverlay" class="fixed inset-0 z-[200] hidden bg-slate-900/95 backdrop-blur-lg flex-col items-center justify-center text-white transition-opacity duration-500 opacity-0">
        <h2 class="text-3xl font-black mb-16 text-teal-400 tracking-widest text-center">🛡️ 特工大腦冷卻中...</h2>
        <div class="w-48 h-48 rounded-full bg-teal-500/20 border-4 border-teal-400 flex items-center justify-center breathe-pulse">

    <!-- 🚨 突發任務系統 Overlay -->

    <!-- 頂部導航 -->

        <div class="flex items-center gap-2 sm:gap-4 shrink-0">

    <main class="flex-grow flex flex-col md:flex-row overflow-hidden relative bg-slate-50 w-full h-full">
        <!-- 左側選單 -->
        <aside id="sidebarMenu" class="flex-none w-full md:w-[320px] lg:w-[380px] h-[30%] md:h-full bg-white border-r border-slate-200 flex flex-col z-20 shadow-lg transition-all duration-300">

    <script>
        // ==========================================
        // 全局狀態變數
        // ==========================================
        let stamina = 100;
        let isSidebarOpen = true;

        let globalExp = 0;
        let globalLevel = 1;
        let currentCombo = 0;
        let consecutiveErrors = 0; 
        let showHint = false;      
        
        let currentRoomId = 'r1';
        let roomProgress = {}; 
        let roomAnswered = {}; 
        let roomResults = {};  
        let lastAnswerResult = null; 

        let currentSortableItems = [];
        let draggedSortItem = null;
        
        let firedEvents = new Set();
        let emergencyTimer = null;
        let activeEmergencyKey = null; // 🚨 防護鎖：確保緊急任務不會被重複計算或取消

        // ==========================================
        // 🧩 進階青少年版 12 大場景資料庫 (完整 8 題版)
        // ==========================================
        const roomsConfig = [
            { id: 'r1', type: 'quiz', title: '1. 表情解碼分析室', icon: '🎭', desc: '辨識複雜與微表情。觀察文字描述，選出對方真正的想法。' },
            { id: 'r2', type: 'quiz', title: '2. 感官過載調節艙', icon: '🌪️', desc: '中學校園情境：面對突如其來的感官刺激，選擇最佳調節戰術。' },
            { id: 'r3', type: 'quiz', title: '3. 突發狀況演習區', icon: '🔀', desc: '打破固執性：當常規被打亂時，選擇最具彈性的 Plan B。' },
            { id: 'r4', type: 'quiz', title: '4. 隱喻翻譯機', icon: '🗣️', desc: '青少年次文化與諷刺語氣解碼：這句隱喻真正的意思是甚麼？' },
            { id: 'r5', type: 'quiz', title: '5. 對話接球訓練場', icon: '💬', desc: '避免單向話題轟炸，選出最好的『接球與傳球』回應。' },
            { id: 'r6', type: 'quiz', title: '6. 社交距離雷達', icon: '📏', desc: '青春期人際界線：面對此人，應保持哪種安全距離？' },
            { id: 'r7', type: 'chunking', title: '7. 步驟邏輯排序台', icon: '🧩', desc: '請拖曳排序下方步驟，將大型任務切碎並粉碎它！' },
            { id: 'r8', type: 'chunking', title: '8. 切換頻道準備室', icon: '🧘', desc: '要切換到無聊的事，請「拖曳」正確執行中斷步驟！' },
            { id: 'r9', type: 'quiz', title: '9. 讀心透視鏡', icon: '🕵️', desc: '複雜心智解讀 (Theory of Mind)：猜猜對方現在真正的感受？' },
            { id: 'r10', type: 'quiz', title: '10. 肢體語言解碼器', icon: '👐', desc: '青春期微動作：這細微的肢體動作傳達了甚麼隱藏訊息？' },
            { id: 'r11', type: 'quiz', title: '11. 情報解碼室', icon: '📡', desc: '隱含語意訓練：看穿反諷與非語言線索，揪出真實意圖！' },
            { id: 'r12', type: 'blueprint', title: '12. 戰術藍圖室', icon: '🗺️', desc: '邏輯結構訓練：拖曳積木至正確的插槽，重組完整報告！' }
        ];

        // 🧠 Quiz 資料庫 (已修復：確保每關擁有 8 道獨立題目，不再重複)
        const quizDb = {
            "r1": [
                { q: "翻白眼，嘴角微撇", c: "不耐煩 / 覺得無聊", w1: "眼睛痛在做眼球運動", w2: "非常開心期待", hint: "💡 提示：翻白眼通常表示對當前情況感到無奈或不屑。" },

            "r2": [

                { q: "科學實驗室飄出刺鼻的化學藥劑味道", c: "戴上口罩 / 請求坐在通風處", w1: "把化學藥劑打翻", w2: "屏住呼吸直到頭暈", hint: "💡 提示：嗅覺過敏可以透過口罩阻隔，或遠離氣味源頭來解決。" },

        function resizeCanvas() {
            const wrapper = document.getElementById('posterScaleWrapper');
            const canvas = document.getElementById('posterPrintArea');
            if (wrapper) wrapper.style.transform = 'none';
            if (canvas) {
                canvas.style.transform = 'none';

                canvas.style.width = '92%'; 
            }
        }

        function updateHUD(staminaDiff) {
            stamina = Math.max(0, Math.min(100, stamina + staminaDiff));
            const bar = document.getElementById('hudStamina');
            const text = document.getElementById('hudStaminaText');
            if (bar && text) {
                bar.style.width = `${stamina}%`;
                text.innerText = `${stamina}%`;
                if(stamina <= 30) {
                    bar.className = "bg-rose-500 h-full transition-all duration-300";
                    text.className = "text-rose-600 min-w-[40px] text-right font-black animate-pulse";
                } else if(stamina <= 60) {
                    bar.className = "bg-amber-400 h-full transition-all duration-300";
                    text.className = "text-amber-600 min-w-[40px] text-right font-black";
                } else {
                    bar.className = "bg-emerald-500 h-full transition-all duration-300";
                    text.className = "text-emerald-600 min-w-[40px] text-right font-black";
                }
            }
        }

        function updateGlobalExp(amount) {
            globalExp += amount;
            let expNeeded = globalLevel * 50; 
            if (globalExp >= expNeeded) {
                globalExp -= expNeeded;
                globalLevel++;
                showToast(`🎉 升級！特工等級提升至 Lv.${globalLevel}`, "success");
                fireConfetti();
            }
            const levelTxt = document.getElementById('globalLevelTxt');
            const expBar = document.getElementById('globalExpBar');
            if (levelTxt) levelTxt.innerText = globalLevel;
            if (expBar) expBar.style.width = `${(globalExp / expNeeded) * 100}%`;
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            if (!toast || !toastMsg || !toastIcon) return;
            
            toastMsg.innerText = msg;
            toastIcon.className = type === 'error' ? "fa-solid fa-circle-exclamation text-rose-500 text-3xl" : "fa-solid fa-circle-check text-emerald-500 text-3xl";
            toast.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
            }, 3000);
        }

        function fireConfetti() {
            const container = document.getElementById('confetti-container');
            if (!container) return;
            container.innerHTML = ''; 
            const emojis = ['🎉', '✨', '🏆', '⭐', '🎈'];
            for(let i=0; i<40; i++) {
                let conf = document.createElement('div');
                conf.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                conf.style.position = 'absolute';
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = '-10%';
                conf.style.fontSize = (Math.random() * 30 + 30) + 'px';
                conf.style.transition = 'top 2s ease-in, opacity 2s ease-out';
                container.appendChild(conf);
                setTimeout(() => { conf.style.top = '110%'; conf.style.opacity = '0'; }, 50);
            }
        }

        // ==========================================
        // 拖曳排序 (Drag & Drop) 引擎
        // ==========================================
        function sortDragStart(e) {
            if (!e || !e.currentTarget || e.currentTarget.getAttribute('draggable') === 'false') {
                if (e) e.preventDefault();
                return;
            }
            draggedSortItem = e.currentTarget;
            const item = e.currentTarget;
            setTimeout(() => {
                if (item && item.classList) item.classList.add('opacity-50', 'scale-95');
            }, 0);
            if (e.dataTransfer) {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', item.getAttribute('data-id') || item.getAttribute('data-index'));
            }
        }

        function sortDragEnd(e) {
            if (!e || !e.currentTarget) return;
            if (e.currentTarget.classList) e.currentTarget.classList.remove('opacity-50', 'scale-95');
            document.querySelectorAll('.blueprint-slot').forEach(slot => {
                slot.classList.remove('drag-over');
            });
            document.querySelectorAll('.sortable-item').forEach(item => {
                item.style.borderTop = "";
                item.style.borderBottom = "";
            });
            draggedSortItem = null;
        }

        function sortDragEnter(e) {
            if (e && e.preventDefault) e.preventDefault();
        }

        function sortDragOver(e) {
            if (!e) return;
            if (e.preventDefault) e.preventDefault();
            const target = e.currentTarget;
            
            if (target && target.classList.contains('blueprint-slot')) {
                target.classList.add('drag-over');
                return;
            }

            if (target && draggedSortItem && target !== draggedSortItem && target.classList && target.classList.contains('sortable-item') && target.getAttribute('draggable') !== 'false') {
                const bounding = target.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                if (e.clientY - offset > 0) {
                    target.style.borderBottom = "6px solid #0d9488";
                    target.style.borderTop = "";
                } else {
                    target.style.borderTop = "6px solid #0d9488";
                    target.style.borderBottom = "";
                }
            }
        }

        function sortDragLeave(e) {
            if (!e || !e.currentTarget) return;
            const target = e.currentTarget;
            target.style.borderTop = "";
            target.style.borderBottom = "";
            if (target.classList.contains('blueprint-slot')) {
                target.classList.remove('drag-over');
            }
        }

        function sortDrop(e) {
            if (!e || !e.currentTarget) return;
            if (e.preventDefault) e.preventDefault();
            const target = e.currentTarget;
            target.style.borderTop = "";
            target.style.borderBottom = "";
            
            if (target.classList.contains('blueprint-slot')) {
                target.classList.remove('drag-over');
                if (draggedSortItem) {
                    if (target.children.length > 0) {
                        const existingItem = target.children[0];
                        document.getElementById('sortableContainer').appendChild(existingItem);
                    }
                    target.appendChild(draggedSortItem);
                }
                return;
            }

            if (target.id === 'sortableContainer' && draggedSortItem) {
                target.appendChild(draggedSortItem);
                return;
            }
            
            if (target && draggedSortItem && target !== draggedSortItem && target.classList && target.classList.contains('sortable-item') && target.getAttribute('draggable') !== 'false') {
                const bounding = target.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                const container = target.parentElement; 
                if (container) {
                    if (e.clientY - offset > 0) {
                        container.insertBefore(draggedSortItem, target.nextSibling);
                    } else {
                        container.insertBefore(draggedSortItem, target);
                    }
                }
            }
        }

        function verifyChunkingTask() {
            const slots = document.querySelectorAll('.blueprint-slot');
            const sourceContainer = document.getElementById('sortableContainer');
            let isAllCorrect = true;
            let filledSlots = 0;
            let hasErrors = false;

            slots.forEach(slot => {
                const expectedId = slot.getAttribute('data-slot-id'); 
                if (slot.children.length > 0) {
                    filledSlots++;
                    const child = slot.children[0];
                    const childId = child.getAttribute('data-id'); 
                    if (childId === expectedId) {
                        child.className = child.className.replace(/border-slate-200|border-rose-400|hover:border-purple-300|cursor-grab/g, 'border-emerald-400')
                                                        .replace(/bg-white|bg-rose-50/g, 'bg-emerald-50') + ' text-emerald-800 cursor-default';
                        child.setAttribute('draggable', 'false');
                        const icon = child.querySelector('.fa-grip-vertical');
                        if (icon) {
                            icon.className = "fa-solid fa-check text-emerald-500 mr-2 px-1 pointer-events-none";
                        }
                    } else {
                        isAllCorrect = false;
                        hasErrors = true;
                        sourceContainer.appendChild(child); 

                        child.classList.remove('shake-bounce');
                        void child.offsetWidth; 
                        child.classList.add('shake-bounce');
                        
                        child.classList.replace('border-slate-200', 'border-rose-400');
                        child.classList.replace('bg-white', 'bg-rose-50');
                        setTimeout(() => {
                            child.classList.replace('border-rose-400', 'border-slate-200');
                            child.classList.replace('bg-rose-50', 'bg-white');
                        }, 800);
                    }
                } else {
                    isAllCorrect = false; 
                }
            });

            const btn = document.getElementById('chkSortBtn');

            if (filledSlots < slots.length && !hasErrors) {
                showToast("⚠️ 請將所有步驟積木拖曳到插槽中！", "error");
                return;
            }

            if (isAllCorrect && filledSlots === slots.length) {
                consecutiveErrors = 0;
                if (btn) {
                    btn.className = btn.className.replace(/bg-purple-600|bg-rose-600/g, 'bg-emerald-600') + ' scale-bounce';
                    btn.innerHTML = `<i class="fa-solid fa-check-double"></i> 順序正確！即將自動跳轉...`;
                }
                
                if(!roomResults[currentRoomId]) roomResults[currentRoomId] = [];
                roomResults[currentRoomId][roomProgress[currentRoomId]] = true;

                updateGlobalExp(15);
                showToast("🏆 任務切割順序完全正確！", "success");
                fireConfetti();
                
                setTimeout(() => { nextQuizQuestion(); }, 1500);
            } else {
                if (hasErrors) {
                    if (btn) {
                        const origClass = btn.className;
                        const origText = btn.innerHTML;
                        btn.className = btn.className.replace(/bg-purple-600|bg-indigo-600/g, 'bg-rose-600');
                        btn.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> 順序錯誤！已退回錯誤步驟`;
                        setTimeout(() => { btn.className = origClass; btn.innerHTML = origText; }, 1500);
                    }
                    handleTaskError();
                }
            }
        }

                                <button id="chkSortBtn" onclick="window.verifyChunkingTask()" class="flex-grow bg-purple-600 hover:bg-purple-700 text-white font-black py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-check-double"></i> 確認完成
                                </button>
                                <button onclick="window.resetCurrentTask()" class="w-14 sm:w-auto px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition shadow-sm border-2 border-slate-200 flex items-center justify-center gap-2" title="重新排列">
                                    <i class="fa-solid fa-arrows-rotate"></i> <span class="hidden sm:inline text-sm">重排</span>

                    </div>

            }
            else if (config.type === 'blueprint') {
                const db = blueprintDb[currentRoomId];
                const data = (db && db[currentIndex]) ? db[currentIndex] : { title: "無資料", slots: [], fragments: [] };
                
                if (currentSortableItems.length === 0 && data.fragments) {
                    currentSortableItems = [...data.fragments].sort(() => Math.random() - 0.5);
                }

                let sourceBlocksHtml = currentSortableItems.map((item) => {
                    return `
                        <div draggable="true" data-id="${item.id}"
                             ondragstart="window.sortDragStart(event)"
                             ondragend="window.sortDragEnd(event)"
                             class="sortable-item w-full bg-white hover:bg-indigo-50 text-slate-700 border-[3px] border-slate-200 shadow-sm hover:border-indigo-300 transition-all font-bold rounded-xl flex items-center px-3 py-2 cursor-grab text-left mb-2">
                            <i class="fa-solid fa-grip-vertical text-slate-400 mr-2 px-1 pointer-events-none"></i>

                        </div>
                    `;
                }).join('');

                let slotsHtml = data.slots.map((slot) => {
                    return `
                        <div class="flex items-stretch gap-2 w-full mb-3">

                            </div>
                            <div class="blueprint-slot w-2/3 bg-slate-50 relative flex items-center justify-center p-2" 
                                 data-slot-id="${slot.id}"
                                 ondragover="window.sortDragOver(event)" ondrop="window.sortDrop(event)" ondragenter="window.sortDragEnter(event)" ondragleave="window.sortDragLeave(event)">
                            </div>

                    `;
                }).join('');

                let hintUI = "";
                if (showHint && data.hint) {
                    hintUI = `
                        <div class="bg-amber-50 border-2 border-amber-300 text-amber-800 p-3 rounded-xl shadow-md fade-in mb-4 text-sm font-bold">
                            ${data.hint}
                        </div>
                    `;
                }

                contentHtml = `
                    <div class="flex flex-col md:flex-row gap-6 flex-grow h-auto min-h-full pb-[80px]">
                        
                        <div class="main-card w-full md:w-[40%] flex flex-col bg-slate-100 border-slate-300 shadow-inner relative">
                            <h2 class="subtitle font-black text-slate-600 w-full mb-2"><i class="fa-solid fa-cubes text-indigo-500"></i> 句子碎片區</h2>
                            <p class="desc-text font-bold text-slate-500 mb-4">請將下列積木拖曳到右側的對應位置：</p>
                            
                            <div id="sortableContainer" class="w-full flex-grow overflow-y-auto custom-scrollbar pr-2 pb-2"

                            </div>

                        <div class="sub-card w-full md:w-[60%] bg-white border-indigo-300 flex flex-col shadow-xl h-auto">
                            <div class="bg-blue-50 border border-blue-200 text-blue-800 p-3 rounded-xl font-bold flex items-center gap-2 mb-4 w-full shrink-0 shadow-sm">

                            <div class="flex gap-3 mt-2 shrink-0 border-t border-slate-100 pt-4">
                                <button id="chkSortBtn" onclick="window.verifyBlueprintTask()" class="flex-grow bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">

                                </button>
                                <button onclick="window.resetCurrentTask()" class="w-14 sm:w-auto px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition shadow-sm border-2 border-slate-200 flex items-center justify-center gap-2" title="重新排列">
                                    <i class="fa-solid fa-arrows-rotate"></i> <span class="hidden sm:inline text-sm">重置</span>
                                </button>
                            </div>

                    </div>
                `;
            }

            html = `
                <div class="flex flex-col flex-grow bg-white relative rounded-[24px] h-auto min-h-full">
                    <div class="flex justify-between items-center border-b-2 border-slate-200 px-6 pt-6 pb-4 shrink-0 bg-white z-10 shadow-sm overflow-visible rounded-t-[24px]">
                        <div class="shrink-0 mr-6">
                            <span class="text-teal-600 font-bold text-sm leading-relaxed block">${config.title}</span>
                            <h1 class="main-title font-black text-slate-800 mt-1 leading-tight">${config.desc}</h1>
                        </div>
                    </div>
                    ${nodesHtml}
                    <!-- 🚨 確保觸發機制被正確初始化 -->
                    <div class="flex-grow p-6 bg-slate-50 overflow-y-auto custom-scrollbar flex flex-col relative pb-[140px] !important min-h-0">
                        ${contentHtml}
                    </div>
                </div>
            `;

            canvas.innerHTML = html;

            // 🚨 觸發隨機緊急事件 (特定關卡)
            clearTimeout(emergencyTimer);
            const eventKey = `${currentRoomId}_${currentIndex}`;
            if (currentIndex === 4 && !firedEvents.has(eventKey)) { 
                if (activeEmergencyKey !== eventKey) {
                    activeEmergencyKey = eventKey;
                    emergencyTimer = setTimeout(() => {
                        triggerRandomEvent("計畫有變！請將原本的規則反過來執行。");
                        firedEvents.add(eventKey);
                    }, 3000);
                }
            }

        Object.assign(window, {
            toggleSidebar, resizeCanvas, updateHUD, updateGlobalExp, showToast, fireConfetti, selectRoom, renderRoom, changeTask,
            checkQuizAnswer, nextQuizQuestion, retryRoom, resetCurrentTask,
            sortDragStart, sortDragEnd, sortDragEnter, sortDragOver, sortDragLeave, sortDrop, verifyChunkingTask, verifyBlueprintTask, scrollTabs,
            triggerRandomEvent, dismissEmergencyEvent
        });

        window.onload = function() { 
            initSidebar();
            selectRoom('r1'); 
        } 
    </script>
    <script>
    window.verifyChunkingTask = function() {
    const slots = document.querySelectorAll('.blueprint-slot');
    let allCorrect = true;
    let checkedCount = 0;

    slots.forEach(slot => {
        const expectedIndex = parseInt(slot.getAttribute('data-slot-id'));
        const item = slot.querySelector('.sortable-item');

        if (item) {
            checkedCount++;
            const actualIndex = parseInt(item.getAttribute('data-index'));

            if (actualIndex === expectedIndex) {
                // 【答對邏輯】：變更為綠色成功樣式
                item.classList.remove('border-slate-200', 'cursor-grab', 'hover:border-purple-300', 'hover:bg-purple-50');
                item.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
                
                const icon = item.querySelector('i');
                if (icon) {
                    icon.className = 'fa-solid fa-check text-emerald-600 mr-2 px-1 pointer-events-none';
                }

                // 【關鍵修復：徹底鎖定】
                // 1. 禁止拖曳
                item.setAttribute('draggable', 'false'); 
                // 2. 讓滑鼠點擊事件穿透（無法點選返回）
                item.style.pointerEvents = 'none'; 
                // 3. 移除積木上的 onClick 事件
                item.removeAttribute('onclick');
                // 4. 同時關閉該「插槽」的接收功能，防止其他積木又被硬塞進來
                slot.removeAttribute('ondragover');
                slot.removeAttribute('ondrop');
                slot.removeAttribute('ondragenter');
                slot.removeAttribute('ondragleave');
                
            } else {
                // 【答錯邏輯】：震動並退回左側庫存區
                allCorrect = false;
                
                item.classList.add('animate-shake', 'border-red-500', 'bg-red-50', 'text-red-800');
                const icon = item.querySelector('i');
                if(icon) {
                    icon.className = 'fa-solid fa-xmark text-red-600 mr-2 px-1 pointer-events-none';
                }

                setTimeout(() => {
                    item.classList.remove('animate-shake', 'border-red-500', 'bg-red-50', 'text-red-800');
                    item.classList.add('border-slate-200', 'bg-white', 'text-slate-700');
                    if(icon) {
                        icon.className = 'fa-solid fa-grip-vertical text-slate-400 mr-2 px-1 pointer-events-none';
                    }
                    const container = document.getElementById('sortableContainer');
                    if (container) {
                        container.appendChild(item);
                    }
                }, 800);
            }
        }
    });

    // 檢查是否全對並過關
    if (checkedCount === slots.length && allCorrect) {
        const db = chunkingDb[currentRoomId];
        if (db && db[currentIndex]) {
            roomProgress[currentRoomId] = Math.max(roomProgress[currentRoomId] || 0, currentIndex + 1);
            if(window.showReward) window.showReward(10, '成功粉碎任務！');
            setTimeout(() => {
                if(window.unlockNextRoom) window.unlockNextRoom(currentRoomId);
            }, 1000);
        }
    }
};
</script>
