<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASD 專注力特工訓練基地 | SEN Care Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; background-color: #f1f5f9; color: #334155; }
        
        h1, h2, h3, h4, h5, h6, p, .subtitle, .desc-text {
            word-wrap: break-word !important;
            overflow-wrap: break-word !important;
            white-space: normal !important;
            max-width: 100% !important;
        }
        .whitespace-nowrap { white-space: nowrap !important; }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .room-card { transition: all 0.3s ease; cursor: pointer; background-color: #ffffff; border: 1px solid #e2e8f0; }
        .room-card:hover { border-color: #0d9488; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .room-card.active { border-color: #0d9488; background-color: #f0fdfa; box-shadow: inset 4px 0 0 #0d9488, 0 4px 6px -1px rgba(0, 0, 0, 0.05); }

        #canvasContainer { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            overflow-y: auto !important; 
            overflow-x: hidden; 
            background-color: #e2e8f0; 
        }

        #posterScaleWrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100%;
            padding: 20px 0 60px 0;
            transform: none !important; 
        }

        #posterPrintArea {
            width: 92% !important;
            max-width: 780px !important;  
            margin: 20px auto !important;
            min-height: 80vh !important;
            height: auto !important;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            position: relative !important;
            top: auto !important;
            left: auto !important;
            transform: none !important;
            overflow: visible !important;
        }

        .room-content-wrapper {
            padding: 15px 20px !important;
            padding-bottom: 60px !important; 
        }
        .main-card, .sub-card {
            padding: 15px 20px !important;
            border-radius: 16px !important;
            border-width: 3px !important;
        }

        .level-nodes-container {
            display: flex !important;
            justify-content: space-around !important; 
            align-items: center !important;
            width: 100% !important;
            padding: 15px 5px !important;
            gap: 8px !important; 
            box-sizing: border-box !important;
        }

        .level-node-btn {
            width: 36px !important;
            height: 36px !important;
            line-height: 36px !important;
            font-size: 13px !important;
            flex-shrink: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            border-radius: 9999px !important;
        }

        @keyframes nodePulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.7); transform: scale(1.1); }
            50% { box-shadow: 0 0 0 10px rgba(20, 184, 166, 0); transform: scale(1.15); }
            100% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0); transform: scale(1.1); }
        }
        .node-glow { 
            animation: nodePulseGlow 1.5s infinite ease-out !important; 
            border-color: #0d9488 !important;
            color: #0d9488 !important;
            z-index: 20 !important;
        }

        /* ✨ 安全屋呼吸冷卻動畫 */
        @keyframes safeHouseBreathe {
            0% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 20px rgba(45, 212, 191, 0.3); }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 60px rgba(45, 212, 191, 0.8); }
            100% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 20px rgba(45, 212, 191, 0.3); }
        }
        .breathe-pulse { animation: safeHouseBreathe 1.5s infinite ease-in-out; } 

        #posterPrintArea h1, #posterPrintArea .main-title {
            font-size: 1.25rem !important; 
            line-height: 1.4 !important;
            margin-bottom: 0.5rem !important;
        }
        #posterPrintArea h2, #posterPrintArea h3, #posterPrintArea .subtitle {
            font-size: 1rem !important; 
            line-height: 1.4 !important;
            margin-bottom: 0.5rem !important;
        }
        #posterPrintArea p:not(.decoration-only), 
        #posterPrintArea button:not(.level-node-btn), 
        #posterPrintArea .desc-text {
            font-size: 0.95rem !important; 
            line-height: 1.5 !important;
        }
        #posterPrintArea .decoration-only {
            font-size: 4rem !important;
            margin-bottom: 0.5rem !important;
            line-height: 1 !important;
        }

        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .shake-bounce { animation: shakeBounce 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeBounce {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .scale-bounce { animation: scaleBounce 0.4s cubic-bezier(.175, .885, .32, 1.275) both; }
        @keyframes scaleBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        #confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }

        .sortable-item { cursor: grab; transition: transform 0.2s, background-color 0.2s, border-color 0.2s; }
        .sortable-item:active { cursor: grabbing; }
        .sortable-item.dragging { opacity: 0.4; transform: scale(0.98); }
        
        /* 藍圖與步驟插槽樣式 */
        .blueprint-slot { min-height: 50px; border: 2px dashed #cbd5e1; border-radius: 0.5rem; transition: all 0.3s; }
        .blueprint-slot.drag-over { border-color: #8b5cf6; background-color: #f3e8ff; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col pb-12 bg-slate-50/50">

    <!-- 🛡️ 安全屋冷卻機制 Overlay -->
    <div id="safeHouseOverlay" class="fixed inset-0 z-[200] hidden bg-slate-900/95 backdrop-blur-lg flex-col items-center justify-center text-white transition-opacity duration-500 opacity-0">

    <!-- 頂部導航 -->

        <div class="flex items-center gap-2 sm:gap-4 shrink-0">
            <a href="professional_dashboard.html" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 px-2.5 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900 font-bold">

        <div class="flex items-center gap-2 sm:gap-3 shrink-0 ml-4">

    <main class="flex-grow flex flex-col md:flex-row overflow-hidden relative bg-slate-50 w-full h-full">
        <!-- 左側選單 -->
        <aside id="sidebarMenu" class="flex-none w-full md:w-[320px] lg:w-[380px] h-[30%] md:h-full bg-white border-r border-slate-200 flex flex-col z-20 shadow-lg transition-all duration-300">
            <div class="p-4 border-b border-slate-100 bg-slate-50 shrink-0">

                <p class="text-xs text-slate-500 font-bold">專為中學情境與高階心智解讀設計</p>

        <!-- 右側畫布 -->

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-8 right-8 bg-white border border-slate-200 rounded-2xl shadow-2xl py-4 px-6 flex items-center gap-4 opacity-0 translate-y-10 transition-all duration-300 pointer-events-none z-[300]">

        <span id="toastMsg" class="text-lg font-black text-slate-800"></span>

    <script>
        // ==========================================
        // 全局狀態變數
        // ==========================================
        let stamina = 100;
        let isSidebarOpen = true;

        let globalExp = 0;
        let globalLevel = 1;
        let currentCombo = 0;
        let consecutiveErrors = 0; 
        let showHint = false;      
        
        let currentRoomId = 'r7';
        let roomProgress = {}; 
        let roomAnswered = {}; 
        let roomResults = {};  
        let lastAnswerResult = null; 

        let currentSortableItems = [];
        let draggedSortItem = null;

        // ==========================================
        // 🧩 進階青少年版 12 大場景資料庫 
        // ==========================================
        const roomsConfig = [
            { id: 'r1', type: 'quiz', title: '1. 表情解碼分析室', icon: '🎭', desc: '辨識複雜與微表情。觀察文字描述，選出對方真正的想法。' },
            { id: 'r2', type: 'quiz', title: '2. 感官過載調節艙', icon: '🌪️', desc: '中學校園情境：面對突如其來的感官刺激，選擇最佳調節戰術。' },
            { id: 'r3', type: 'quiz', title: '3. 突發狀況演習區', icon: '🔀', desc: '打破固執性：當常規被打亂時，選擇最具彈性的 Plan B。' },
            { id: 'r4', type: 'quiz', title: '4. 隱喻翻譯機', icon: '🗣️', desc: '青少年次文化與諷刺語氣解碼：這句隱喻真正的意思是甚麼？' },
            { id: 'r5', type: 'quiz', title: '5. 對話接球訓練場', icon: '💬', desc: '避免單向話題轟炸，選出最好的『接球與傳球』回應。' },
            { id: 'r6', type: 'quiz', title: '6. 社交距離雷達', icon: '📏', desc: '青春期人際界線：面對此人，應保持哪種安全距離？' },
            { id: 'r7', type: 'chunking', title: '7. 步驟邏輯排序台', icon: '🧩', desc: '拖曳積木至「步驟插槽」，將大型任務切碎並順序粉碎它！' },
            { id: 'r8', type: 'chunking', title: '8. 切換頻道準備室', icon: '🧘', desc: '要切換到無聊的事，請拖曳積木到「步驟插槽」完成中斷步驟！' },
            { id: 'r9', type: 'quiz', title: '9. 讀心透視鏡', icon: '🕵️', desc: '複雜心智解讀 (Theory of Mind)：猜猜對方現在真正的感受？' },
            { id: 'r10', type: 'quiz', title: '10. 肢體語言解碼器', icon: '👐', desc: '青春期微動作：這細微的肢體動作傳達了甚麼隱藏訊息？' },
            { id: 'r11', type: 'quiz', title: '11. 情報解碼室', icon: '📡', desc: '隱含語意訓練：看穿反諷與非語言線索，揪出真實意圖！' },
            { id: 'r12', type: 'blueprint', title: '12. 戰術藍圖室', icon: '🗺️', desc: '邏輯結構訓練：拖曳積木至正確的插槽，重組完整報告！' }
        ];

        const quizDb = {
            "r1": [ { q: "翻白眼，嘴角微撇", c: "不耐煩 / 覺得無聊", w1: "眼睛痛在做眼球運動", w2: "非常開心期待" } ],
            "r2": [ { q: "午餐時間飯堂人聲鼎沸非常吵雜", c: "戴上降噪耳機 / 尋找角落座位", w1: "摀住耳朵大聲尖叫抗議", w2: "勉強忍耐直到頭痛崩潰" } ],
            "r3": [ { q: "原本說好要去電腦室，老師突然改在原班", c: "默默把筆電收起來，拿出課本", w1: "堅持抱著筆電去電腦室抗議", w2: "對老師大發脾氣" } ],
            "r4": [ { q: "同學故意說：「哇，你『真聰明』喔！」(諷刺)", c: "他在笑我做了一件笨事", w1: "他真心稱讚我智商很高", w2: "他想要請教我數學問題" } ],
            "r5": [ { q: "「我昨天抽卡抽到最稀有的角色！」", c: "「哇太幸運了吧！借我看一下截圖！」", w1: "「我上次抽到更好的。」", w2: "「喔。」(句號)" } ],
            "r6": [ { q: "網路上認識、一起打遊戲的網友", c: "網路距離 (絕不透露住址與隱私)", w1: "個人距離 (約出來單獨去暗巷)", w2: "親密距離 (告訴他銀行密碼)" } ],
            "r9": [ { q: "你講了一個笑話，但全班一陣安靜沒人笑", c: "這個笑話可能不好笑或不合適", w1: "大家太蠢聽不懂", w2: "他們故意排擠我" } ],
            "r10": [ { q: "雙手插在口袋裡，肩膀高聳", c: "防備心重、不想被打擾、冷漠", w1: "覺得天氣很冷", w2: "準備要跳舞" } ],
            "r11": [
                { 
                    q: "同學看著你剛畫完的圖，嘴角抽搐了一下，然後用極為平淡的語氣說：『哇，畫得真...特別啊。』", 
                    c: "他其實覺得畫得很奇怪或不好看。", 
                    w1: "他覺得這幅畫非常有創意和特別。", 
                    w2: "他想要買下這幅畫。", 
                    hint: "💡 提示：注意他的「嘴角抽搐」和「語氣平淡」，加上「特別」這個詞在這裡是用來婉轉地表達不欣賞。" 
                }
            ]
        };

        ['r1','r2','r3','r4','r5','r6','r9','r10','r11'].forEach(id => {
            while(quizDb[id].length < 8) quizDb[id].push(quizDb[id][0]); 
        });

        // 🧩 Chunking 資料庫 (R7, R8) - 配合插槽驗證機制
        const chunkingDb = {
            "r7": [
                { name: "用 Google Classroom 交作業", steps: ["1. 登入帳號", "2. 點開班級", "3. 拍照/上傳檔案", "4. 點擊繳交", "5. 確認顯示已繳交"] }

            ]
        };
        ['r7','r8'].forEach(id => {
            while(chunkingDb[id].length < 8) chunkingDb[id].push(chunkingDb[id][0]);
        });

        // 🗺️ Blueprint 資料庫 (R12)
        const blueprintDb = {
            "r12": [
                {
                    title: "意外事件報告 (5W1H 結構)",
                    desc: "請將下方凌亂的線索，拖曳到正確的 5W1H 插槽中，重組事件報告。",
                    slots: [
                        { id: "when", label: "時間 (When)" },
                        { id: "where", label: "地點 (Where)" },
                        { id: "who", label: "人物 (Who)" },
                        { id: "what", label: "事件 (What)" },
                        { id: "why", label: "原因 (Why)" },
                        { id: "how", label: "結果 (How)" }
                    ],
                    fragments: [
                        { id: "when", text: "昨天下午三點小息時" },
                        { id: "where", text: "在學校三樓的男洗手間內" },
                        { id: "who", text: "中二級的陳大文和李小明" },
                        { id: "what", text: "發生了激烈的肢體推撞衝突" },
                        { id: "why", text: "因為排隊洗手時產生了誤會" },
                        { id: "how", text: "最終由訓導主任將兩人分開並調解" }
                    ],
                    hint: "💡 提示：報告通常以「時間、地點、人物」為開頭，接著描述「發生甚麼事、為何發生」，最後是「結果如何」。"
                },
                {
                    title: "議論文寫作 (起承轉合 結構)",
                    desc: "請將句子碎片拖曳到正確的寫作結構插槽中。",
                    slots: [
                        { id: "intro", label: "起 (引入主題)" },
                        { id: "body1", label: "承 (正面論述)" },
                        { id: "body2", label: "轉 (反面或轉折)" },
                        { id: "conclusion", label: "合 (總結立場)" }
                    ],
                    fragments: [
                        { id: "intro", text: "近年來，中學生應否帶手機回校引起了廣泛的爭議。" },
                        { id: "body1", text: "贊成者認為，手機方便學生隨時與家長保持聯繫，確保安全。" },
                        { id: "body2", text: "然而，反對者指出手機容易令學生上課分心，甚至沉迷遊戲。" },
                        { id: "conclusion", text: "總括而言，學校應容許帶手機，但必須設立嚴格的課堂寄存制度。" }
                    ],
                    hint: "💡 提示：「起」是背景介紹；「承」是支持論點；「轉」是『然而』開頭的反方意見；「合」是『總括而言』的結論。"

        function updateHUD(staminaDiff) {
            stamina = Math.max(0, Math.min(100, stamina + staminaDiff));
            const bar = document.getElementById('hudStamina');
            const text = document.getElementById('hudStaminaText');
            if (bar && text) {
                bar.style.width = `${stamina}%`;
                text.innerText = `${stamina}%`;
                if(stamina <= 30) {
                    bar.className = "bg-rose-500 h-full transition-all duration-300";
                    text.className = "text-rose-600 min-w-[40px] text-right font-black animate-pulse";
                } else if(stamina <= 60) {
                    bar.className = "bg-amber-400 h-full transition-all duration-300";
                    text.className = "text-amber-600 min-w-[40px] text-right font-black";
                } else {
                    bar.className = "bg-emerald-500 h-full transition-all duration-300";
                    text.className = "text-emerald-600 min-w-[40px] text-right font-black";
                }
            }
        }

        function updateGlobalExp(amount) {
            globalExp += amount;
            let expNeeded = globalLevel * 50; 
            if (globalExp >= expNeeded) {
                globalExp -= expNeeded;
                globalLevel++;
                showToast(`🎉 升級！特工等級提升至 Lv.${globalLevel}`, "success");
                fireConfetti();
            }
            const levelTxt = document.getElementById('globalLevelTxt');
            const expBar = document.getElementById('globalExpBar');
            if (levelTxt) levelTxt.innerText = globalLevel;
            if (expBar) expBar.style.width = `${(globalExp / expNeeded) * 100}%`;
        }

        function showToast(msg, type = "success") {

            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            if (!toast || !toastMsg || !toastIcon) return;

            toastIcon.className = type === 'error' ? "fa-solid fa-circle-exclamation text-rose-500 text-3xl" : "fa-solid fa-circle-check text-emerald-500 text-3xl";
            toast.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {

        // ==========================================

        function handleTaskError() {

        // ==========================================

        function selectRoom(roomId) {
            currentRoomId = roomId;
            currentCombo = 0; 
            consecutiveErrors = 0;

            currentSortableItems = [];
            document.querySelectorAll('.room-card').forEach(c => c.classList.remove('active'));
            const activeBtn = document.getElementById(`btn_${roomId}`);

        function changeTask(index) {
            roomProgress[currentRoomId] = index;
            roomAnswered[currentRoomId] = false;
            lastAnswerResult = null;
            currentSortableItems = []; 
            consecutiveErrors = 0;
            showHint = false;
            renderRoom();
        }

        function checkQuizAnswer(selectedIdx, correctIdx) {
            if (roomAnswered[currentRoomId]) return;
            const isCorrect = (selectedIdx === correctIdx);
            
            if (isCorrect) {
                roomAnswered[currentRoomId] = true;
                if(!roomResults[currentRoomId]) roomResults[currentRoomId] = [];
                roomResults[currentRoomId][roomProgress[currentRoomId]] = true;

                consecutiveErrors = 0; 
                currentCombo++;
                let comboMultiplier = currentCombo >= 3 ? 1.5 : 1;
                let expGained = Math.floor(10 * comboMultiplier);
                updateGlobalExp(expGained);
                updateHUD(10);
                showToast(`🏆 判斷正確！+${expGained} EXP`, "success");
            } else {
                handleTaskError();
            }
            
            lastAnswerResult = { isCorrect, selectedIdx };
            renderRoom();
        }

        function nextQuizQuestion() {
            if (roomProgress[currentRoomId] >= 7) {
                roomProgress[currentRoomId] = 8; 
                fireConfetti();
            } else {
                roomProgress[currentRoomId]++;
            }
            roomAnswered[currentRoomId] = false;
            lastAnswerResult = null;
            currentSortableItems = []; 
            consecutiveErrors = 0;
            showHint = false;
            renderRoom();
            scrollTabs(1);
        }

        function retryRoom() {
            roomProgress[currentRoomId] = 0;
            roomResults[currentRoomId] = [];
            roomAnswered[currentRoomId] = false;
            currentCombo = 0;

        function resetCurrentTask() {

        // ==========================================
        // 拖曳排序 (Drag & Drop) 引擎 (支援 Blueprint-Slot)
        // ==========================================
        function sortDragStart(e) {
            if (!e || !e.currentTarget || e.currentTarget.getAttribute('draggable') === 'false') {
                if (e) e.preventDefault();
                return;
            }
            draggedSortItem = e.currentTarget;
            const item = e.currentTarget;
            setTimeout(() => {
                if (item && item.classList) item.classList.add('opacity-50', 'scale-95');
            }, 0);
            if (e.dataTransfer) {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', item.getAttribute('data-id') || item.getAttribute('data-index'));
            }
        }

        function sortDragEnd(e) {
            if (!e || !e.currentTarget) return;
            if (e.currentTarget.classList) e.currentTarget.classList.remove('opacity-50', 'scale-95');
            document.querySelectorAll('.blueprint-slot').forEach(slot => {
                slot.classList.remove('drag-over');
            });
            document.querySelectorAll('.sortable-item').forEach(item => {
                item.style.borderTop = "";
                item.style.borderBottom = "";
            });
            draggedSortItem = null;
        }

        function sortDragEnter(e) {
            if (e && e.preventDefault) e.preventDefault();
        }

        function sortDragOver(e) {
            if (!e) return;
            if (e.preventDefault) e.preventDefault();
            const target = e.currentTarget;
            
            // 處理進入插槽 (Blueprint & Chunking)
            if (target && target.classList.contains('blueprint-slot')) {
                target.classList.add('drag-over');
                return;
            }

            // 處理回到源容器中的同層排序
            if (target && draggedSortItem && target !== draggedSortItem && target.classList && target.classList.contains('sortable-item') && target.getAttribute('draggable') !== 'false') {
                const bounding = target.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                if (e.clientY - offset > 0) {
                    target.style.borderBottom = "6px solid #0d9488";
                    target.style.borderTop = "";
                } else {
                    target.style.borderTop = "6px solid #0d9488";
                    target.style.borderBottom = "";
                }
            }
        }

        function sortDragLeave(e) {
            if (!e || !e.currentTarget) return;
            const target = e.currentTarget;
            target.style.borderTop = "";
            target.style.borderBottom = "";
            if (target.classList.contains('blueprint-slot')) {
                target.classList.remove('drag-over');
            }
        }

        function sortDrop(e) {
            if (!e || !e.currentTarget) return;
            if (e.preventDefault) e.preventDefault();
            const target = e.currentTarget;
            target.style.borderTop = "";
            target.style.borderBottom = "";
            
            // 如果目標是插槽 (R7, R8, R12 都使用插槽)
            if (target.classList.contains('blueprint-slot')) {
                target.classList.remove('drag-over');
                if (draggedSortItem) {
                    // 如果插槽內已經有積木，將它退回源容器
                    if (target.children.length > 0) {
                        const existingItem = target.children[0];
                        document.getElementById('sortableContainer').appendChild(existingItem);
                    }
                    target.appendChild(draggedSortItem);
                }
                return;
            }

            // 返回庫存區
            if (target.id === 'sortableContainer' && draggedSortItem) {
                target.appendChild(draggedSortItem);
                return;
            }
            
            // 一般同層排序
            if (target && draggedSortItem && target !== draggedSortItem && target.classList && target.classList.contains('sortable-item') && target.getAttribute('draggable') !== 'false') {
                const bounding = target.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                const container = target.parentElement; 
                if (container) {
                    if (e.clientY - offset > 0) {
                        container.insertBefore(draggedSortItem, target.nextSibling);
                    } else {
                        container.insertBefore(draggedSortItem, target);
                    }
                }
            }
        }

        // ✨ 驗證 Chunking (R7, R8 改版：使用插槽)
        function verifyChunkingTask() {
            const slots = document.querySelectorAll('.blueprint-slot');
            const sourceContainer = document.getElementById('sortableContainer');
            let isAllCorrect = true;
            let filledSlots = 0;
            let hasErrors = false;

            slots.forEach(slot => {
                const expectedId = slot.getAttribute('data-slot-id'); // 0, 1, 2...
                if (slot.children.length > 0) {
                    filledSlots++;
                    const child = slot.children[0];
                    const childId = child.getAttribute('data-id'); // matches idx
                    if (childId === expectedId) {
                        child.className = child.className.replace(/border-slate-200|border-rose-400|hover:border-purple-300|cursor-grab/g, 'border-emerald-400')
                                                        .replace(/bg-white|bg-rose-50/g, 'bg-emerald-50') + ' text-emerald-800 cursor-default';
                        child.setAttribute('draggable', 'false');
                        const icon = child.querySelector('.fa-grip-vertical');
                        if (icon) {
                            icon.className = "fa-solid fa-check text-emerald-500 mr-2 px-1 pointer-events-none";
                        }
                    } else {
                        isAllCorrect = false;
                        hasErrors = true;
                        sourceContainer.appendChild(child); // 退回源容器

                        child.classList.remove('shake-bounce');
                        void child.offsetWidth; 
                        child.classList.add('shake-bounce');
                        
                        child.classList.replace('border-slate-200', 'border-rose-400');
                        child.classList.replace('bg-white', 'bg-rose-50');
                        setTimeout(() => {
                            child.classList.replace('border-rose-400', 'border-slate-200');
                            child.classList.replace('bg-rose-50', 'bg-white');
                        }, 800);
                    }
                } else {
                    isAllCorrect = false; 
                }
            });

            const btn = document.getElementById('chkSortBtn');

            if (filledSlots < slots.length && !hasErrors) {
                showToast("⚠️ 請將所有步驟積木拖曳到插槽中！", "error");
                return;
            }

            if (isAllCorrect && filledSlots === slots.length) {
                consecutiveErrors = 0;
                if (btn) {
                    btn.className = btn.className.replace(/bg-purple-600|bg-rose-600/g, 'bg-emerald-600') + ' scale-bounce';
                    btn.innerHTML = `<i class="fa-solid fa-check-double"></i> 順序正確！即將自動跳轉...`;
                }
                
                if(!roomResults[currentRoomId]) roomResults[currentRoomId] = [];
                roomResults[currentRoomId][roomProgress[currentRoomId]] = true;

                updateGlobalExp(15);
                showToast("🏆 任務切割順序完全正確！", "success");
                fireConfetti();
                
                setTimeout(() => { nextQuizQuestion(); }, 1500);
            } else {
                if (hasErrors) {
                    if (btn) {
                        const origClass = btn.className;
                        const origText = btn.innerHTML;
                        btn.className = btn.className.replace(/bg-purple-600|bg-indigo-600/g, 'bg-rose-600');
                        btn.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> 順序錯誤！已退回錯誤步驟`;
                        setTimeout(() => { btn.className = origClass; btn.innerHTML = origText; }, 1500);
                    }
                    handleTaskError();
                }
            }
        }

                        <div class="flex gap-4 w-full max-w-lg">
                            <button onclick="window.retryRoom()" class="flex-1 bg-white border-slate-300 hover:bg-slate-100 text-slate-600 font-black transition shadow-sm rounded-xl py-3 border-[3px]">重新挑戰</button>
                            <button onclick="window.toggleSidebar()" class="flex-1 bg-teal-500 hover:bg-teal-600 border-teal-600 text-white font-black transition shadow-md rounded-xl py-3 border-[3px]">選擇其他訓練</button>
                        </div>
                    </div>
                `;
            } 
            else if (config.type === 'quiz') {
                const db = quizDb[currentRoomId];
                const data = (db && db[currentIndex]) ? db[currentIndex] : { q: "無資料", c: "無", w1: "無", w2: "無", emoji: "❓" };

                let opts = [
                    { text: data.c, correct: true, originalIdx: 0 },
                    { text: data.w1, correct: false, originalIdx: 1 },
                    { text: data.w2, correct: false, originalIdx: 2 }
                ];
                const seed = data.q ? data.q.length % 3 : 0;
                if(seed === 1) opts = [opts[1], opts[0], opts[2]];
                if(seed === 2) opts = [opts[2], opts[1], opts[0]];

                const isAnswered = roomAnswered[currentRoomId];
                let cardAnimClass = "";

                let optionsHtml = opts.map((opt, idx) => {
                    let btnClass = "bg-slate-50 hover:bg-teal-50 border-slate-300 text-slate-700 cursor-pointer";
                    let animClass = "";
                    if (isAnswered) {
                        if (opt.correct) {
                            btnClass = "bg-emerald-50 border-emerald-400 text-emerald-800";
                            if (lastAnswerResult && lastAnswerResult.isCorrect && lastAnswerResult.selectedIdx === idx) animClass = "scale-bounce"; 
                        } else if (lastAnswerResult && !lastAnswerResult.isCorrect && lastAnswerResult.selectedIdx === idx) {
                            btnClass = "bg-rose-50 border-rose-400 text-rose-800";
                            cardAnimClass = "shake-bounce"; 
                        } else {
                            btnClass = "bg-slate-50 border-slate-200 text-slate-400 opacity-50 cursor-not-allowed";
                        }
                    }
                    return `<button onclick="window.checkQuizAnswer(${idx}, ${opts.findIndex(o => o.correct)})" class="w-full border-[3px] ${btnClass} ${animClass} font-bold rounded-xl transition-all text-left px-5 py-3 shadow-sm relative overflow-hidden">${opt.text}</button>`;
                }).join('');

                let feedbackHtml = "";
                if (isAnswered) {
                    const isCorrect = lastAnswerResult && lastAnswerResult.isCorrect;
                    feedbackHtml = `
                        <div class="mt-4 p-4 rounded-xl border-[3px] ${isCorrect ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-rose-100 border-rose-300 text-rose-800'} fade-in shadow-inner shrink-0 relative overflow-hidden">
                            <h4 class="font-black text-lg mb-1">${isCorrect ? '✅ 判斷正確！' : '❌ 發生誤判！'}</h4>
                            <p class="desc-text font-bold leading-relaxed">${isCorrect ? data.feedbackCorrect || '幹得好！你成功看穿了隱藏的線索！' : data.feedbackWrong || '注意！請避免衝動解讀。'}</p>
                        </div>
                        <button onclick="window.nextQuizQuestion()" class="w-full bg-teal-500 hover:bg-teal-600 border-[3px] border-teal-600 text-white font-black py-3 rounded-xl transition shadow-md mt-4 shrink-0 flex items-center justify-center gap-2">前往下一關 <i class="fa-solid fa-arrow-right"></i></button>
                    `;
                }

                let hintUI = "";
                if (showHint && data.hint) {
                    hintUI = `
                        <div class="absolute top-4 inset-x-4 bg-amber-50 border-2 border-amber-300 text-amber-800 p-3 rounded-xl shadow-md fade-in z-20 text-sm font-bold">
                            ${data.hint}
                        </div>
                    `;
                }

                let comboUI = currentCombo >= 3 ? `<div class="absolute -top-4 -right-4 bg-gradient-to-r from-orange-500 to-red-600 text-white font-black px-4 py-1.5 rounded-full shadow-2xl transform rotate-12 animate-pulse text-lg border-2 border-white z-50">🔥 Combo x${currentCombo}!</div>` : '';

                contentHtml = `
                    <div class="flex flex-col md:flex-row gap-6 flex-grow h-auto min-h-full pb-[80px]">
                        <div id="quizMainCard" class="main-card w-full md:w-[48%] flex flex-col justify-center items-center bg-white border-slate-200 shadow-inner relative ${cardAnimClass}">
                            ${hintUI}
                            ${comboUI}
                            <div class="decoration-only drop-shadow-lg mt-4 text-[80px]">${data.emoji || config.icon}</div>
                            <h3 class="subtitle font-black text-slate-800 text-center w-full px-2">${data.q || data.situation || "無情境"}</h3>
                        </div>
                        <div class="sub-card w-full md:w-[52%] bg-white border-teal-300 flex flex-col shadow-xl h-auto">
                            <div class="bg-blue-50 border border-blue-200 text-blue-800 p-3 rounded-xl font-bold flex items-center gap-2 mb-4 w-full shrink-0 shadow-sm">
                                <i class="fa-solid fa-bullseye text-lg shrink-0 text-blue-500"></i> 任務目標：請選出對方的「真實意圖」或應對
                            </div>
                            <div class="space-y-3 flex-grow flex flex-col justify-center">
                                ${optionsHtml}
                            </div>
                            ${feedbackHtml}
                        </div>
                    </div>
                `;
            } 
            else if (config.type === 'chunking') {
                const db = chunkingDb[currentRoomId];
                const data = (db && db[currentIndex]) ? db[currentIndex] : { name: "無資料", steps: [] };
                
                if (currentSortableItems.length === 0 && data.steps && data.steps.length > 0) {
                    currentSortableItems = data.steps.map((step, idx) => ({
                        id: idx,
                        text: step.replace(/^\d+\.\s*/, '') 
                    })).sort(() => Math.random() - 0.5);
                }

                let sourceBlocksHtml = currentSortableItems.map((item) => {
                    return `
                        <div draggable="true" data-id="${item.id}"
                             ondragstart="window.sortDragStart(event)"
                             ondragend="window.sortDragEnd(event)"
                             class="sortable-item w-full bg-white hover:bg-purple-50 text-slate-700 border-[3px] border-slate-200 shadow-sm hover:border-purple-300 transition-all font-bold rounded-xl flex items-center px-3 py-2 cursor-grab text-left mb-2">
                            <i class="fa-solid fa-grip-vertical text-slate-400 mr-2 px-1 pointer-events-none"></i>
                            <span class="desc-text flex-grow pointer-events-none">${item.text}</span>
                        </div>
                    `;
                }).join('');

                const numberWords = ['一', '二', '三', '四', '五', '六', '七', '八'];
                let slotsHtml = data.steps.map((_, idx) => {
                    return `
                        <div class="flex items-stretch gap-2 w-full mb-3">
                            <div class="w-1/4 sm:w-1/5 bg-slate-100 border-2 border-slate-200 rounded-lg p-2 flex items-center justify-center text-center font-bold text-slate-600 text-sm shrink-0">
                                步驟${numberWords[idx]}
                            </div>
                            <div class="blueprint-slot w-3/4 sm:w-4/5 bg-slate-50 relative flex items-center justify-center p-2" 
                                 data-slot-id="${idx}"
                                 ondragover="window.sortDragOver(event)" ondrop="window.sortDrop(event)" ondragenter="window.sortDragEnter(event)" ondragleave="window.sortDragLeave(event)">
                            </div>
                        </div>
                    `;
                }).join('');

                let hintUI = "";
                if (showHint && data.hint) {
                    hintUI = `
                        <div class="bg-amber-50 border-2 border-amber-300 text-amber-800 p-3 rounded-xl shadow-md fade-in mb-4 text-sm font-bold">
                            ${data.hint}
                        </div>
                    `;
                }

                contentHtml = `
                    <div class="flex flex-col md:flex-row gap-6 flex-grow h-auto min-h-full pb-[80px]">
                        <div class="main-card w-full md:w-[40%] flex flex-col bg-slate-100 border-slate-300 shadow-inner relative text-center">
                            <h2 class="subtitle font-black text-slate-600 w-full mb-2">恐懼牆 (Wall of Awful)</h2>
                            <div class="decoration-only drop-shadow-xl text-[60px] mb-2">👹</div>
                            <h3 class="font-black text-slate-800 text-lg mb-4">${data.name || "無名稱"}</h3>
                            
                            <div class="border-t-2 border-slate-200 pt-4 w-full flex-grow flex flex-col">
                                <p class="desc-text font-bold text-slate-500 mb-3 text-left">請將下方步驟拖入右側插槽：</p>
                                <div id="sortableContainer" class="w-full flex-grow overflow-y-auto custom-scrollbar pr-2 pb-2 text-left"
                                     ondragover="window.sortDragOver(event)" ondrop="window.sortDrop(event)" ondragenter="window.sortDragEnter(event)" ondragleave="window.sortDragLeave(event)">
                                    ${sourceBlocksHtml}
                                </div>
                            </div>
                        </div>
                        <div class="sub-card w-full md:w-[60%] bg-white border-purple-300 flex flex-col shadow-xl h-auto">
                            <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl font-bold flex items-center gap-2 mb-4 w-full shrink-0 shadow-sm">
                                <i class="fa-solid fa-lightbulb text-lg text-amber-500 shrink-0"></i> 任務目標：請依正確執行順序排列步驟
                            </div>
                            
                            ${hintUI}
                            
                            <div id="blueprintArea" class="w-full flex flex-col flex-grow transition-all duration-300">
                                ${slotsHtml}
                            </div>
                            
                            <div class="flex gap-3 mt-2 shrink-0 border-t border-slate-100 pt-4">
                                <button id="chkSortBtn" onclick="window.verifyChunkingTask()" class="flex-grow bg-purple-600 hover:bg-purple-700 text-white font-black py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-check-double"></i> 確認完成
                                </button>
                                <button onclick="window.resetCurrentTask()" class="w-14 sm:w-auto px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition shadow-sm border-2 border-slate-200 flex items-center justify-center gap-2" title="重新排列">
                                    <i class="fa-solid fa-arrows-rotate"></i> <span class="hidden sm:inline text-sm">重排</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (config.type === 'blueprint') {
                const db = blueprintDb[currentRoomId];
                const data = (db && db[currentIndex]) ? db[currentIndex] : { title: "無資料", slots: [], fragments: [] };
                
                if (currentSortableItems.length === 0 && data.fragments) {
                    currentSortableItems = [...data.fragments].sort(() => Math.random() - 0.5);
                }

                let sourceBlocksHtml = currentSortableItems.map((item) => {
                    return `
                        <div draggable="true" data-id="${item.id}"
                             ondragstart="window.sortDragStart(event)"
                             ondragend="window.sortDragEnd(event)"
                             class="sortable-item w-full bg-white hover:bg-indigo-50 text-slate-700 border-[3px] border-slate-200 shadow-sm hover:border-indigo-300 transition-all font-bold rounded-xl flex items-center px-3 py-2 cursor-grab text-left mb-2">
                            <i class="fa-solid fa-grip-vertical text-slate-400 mr-2 px-1 pointer-events-none"></i>
                            <span class="desc-text flex-grow pointer-events-none">${item.text}</span>
                        </div>
                    `;
                }).join('');

                let slotsHtml = data.slots.map((slot) => {
                    return `
                        <div class="flex items-stretch gap-2 w-full mb-3">
                            <div class="w-1/3 bg-slate-100 border-2 border-slate-200 rounded-lg p-3 flex items-center justify-center text-center font-bold text-slate-600 text-sm shrink-0">
                                ${slot.label}
                            </div>
                            <div class="blueprint-slot w-2/3 bg-slate-50 relative flex items-center justify-center p-2" 
                                 data-slot-id="${slot.id}"
                                 ondragover="window.sortDragOver(event)" ondrop="window.sortDrop(event)" ondragenter="window.sortDragEnter(event)" ondragleave="window.sortDragLeave(event)">
                            </div>
                        </div>
                    `;
                }).join('');

                let hintUI = "";
                if (showHint && data.hint) {
                    hintUI = `
                        <div class="bg-amber-50 border-2 border-amber-300 text-amber-800 p-3 rounded-xl shadow-md fade-in mb-4 text-sm font-bold">
                            ${data.hint}
                        </div>
                    `;
                }

                contentHtml = `
                    <div class="flex flex-col md:flex-row gap-6 flex-grow h-auto min-h-full pb-[80px]">
                        
                        <div class="main-card w-full md:w-[40%] flex flex-col bg-slate-100 border-slate-300 shadow-inner relative">
                            <h2 class="subtitle font-black text-slate-600 w-full mb-2"><i class="fa-solid fa-cubes text-indigo-500"></i> 句子碎片區</h2>
                            <p class="desc-text font-bold text-slate-500 mb-4">請將下列積木拖曳到右側的對應位置：</p>
                            
                            <div id="sortableContainer" class="w-full flex-grow overflow-y-auto custom-scrollbar pr-2 pb-2"
                                 ondragover="window.sortDragOver(event)" ondrop="window.sortDrop(event)" ondragenter="window.sortDragEnter(event)" ondragleave="window.sortDragLeave(event)">
                                ${sourceBlocksHtml}
                            </div>
                        </div>

                        <div class="sub-card w-full md:w-[60%] bg-white border-indigo-300 flex flex-col shadow-xl h-auto">
                            <div class="bg-blue-50 border border-blue-200 text-blue-800 p-3 rounded-xl font-bold flex items-center gap-2 mb-4 w-full shrink-0 shadow-sm">
                                <i class="fa-solid fa-map text-lg shrink-0 text-blue-500"></i> 任務目標：重組「${data.title}」
                            </div>
                            
                            ${hintUI}
                            
                            <div id="blueprintArea" class="w-full flex flex-col flex-grow transition-all duration-300">
                                ${slotsHtml}
                            </div>
                            
                            <div class="flex gap-3 mt-2 shrink-0 border-t border-slate-100 pt-4">
                                <button id="chkSortBtn" onclick="window.verifyBlueprintTask()" class="flex-grow bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-check-double"></i> 確認藍圖
                                </button>
                                <button onclick="window.resetCurrentTask()" class="w-14 sm:w-auto px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition shadow-sm border-2 border-slate-200 flex items-center justify-center gap-2" title="重新排列">
                                    <i class="fa-solid fa-arrows-rotate"></i> <span class="hidden sm:inline text-sm">重置</span>
                                </button>
                            </div>
                        </div>

                    </div>
                `;
            }

            html = `
                <div class="flex flex-col flex-grow bg-white relative rounded-[24px] h-auto min-h-full">
                    <div class="flex justify-between items-center border-b-2 border-slate-200 px-6 pt-6 pb-4 shrink-0 bg-white z-10 shadow-sm overflow-visible rounded-t-[24px]">
                        <div class="shrink-0 mr-6">
                            <span class="text-teal-600 font-bold text-sm leading-relaxed block">${config.title}</span>
                            <h1 class="main-title font-black text-slate-800 mt-1 leading-tight">${config.desc}</h1>
                        </div>
                    </div>
                    ${nodesHtml}
                    <!-- 配置 pb-[140px] 呼吸空間，確保內容溢出時向下滑動不被切除 -->
                    <div class="flex-grow p-6 bg-slate-50 overflow-y-auto custom-scrollbar flex flex-col relative pb-[140px] !important min-h-0">
                        ${contentHtml}
                    </div>
                </div>
            `;

            canvas.innerHTML = html;
        }

        // ==========================================
        // 初始化與安全掛載
        // ==========================================
        Object.assign(window, {
            toggleSidebar, resizeCanvas, updateHUD, updateGlobalExp, showToast, fireConfetti, selectRoom, renderRoom, changeTask,
            checkQuizAnswer, nextQuizQuestion, retryRoom, resetCurrentTask,
            sortDragStart, sortDragEnd, sortDragEnter, sortDragOver, sortDragLeave, sortDrop, verifyChunkingTask, verifyBlueprintTask, scrollTabs
        });

        window.onload = function() { 
            initSidebar();
            selectRoom('r7'); 
        } 
    </script>
</body>
</html>
