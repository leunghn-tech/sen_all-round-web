<!DOCTYPE html>
<html lang="zh-HK">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; background-color: #f1f5f9; color: #334155; }
        
        /* ==========================================
           🎨 1. 全域排版修復 (文字防裁切/自動換行)
           ========================================== */
        h1, h2, h3, h4, h5, h6, p, .subtitle, .desc-text {
            word-wrap: break-word !important;
            overflow-wrap: break-word !important;
            white-space: normal !important;
            max-width: 100% !important;
        }
        .whitespace-nowrap { white-space: nowrap !important; }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .room-card { transition: all 0.3s ease; cursor: pointer; background-color: #ffffff; border: 1px solid #e2e8f0; }
        .room-card:hover { border-color: #0d9488; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .room-card.active { border-color: #0d9488; background-color: #f0fdfa; box-shadow: inset 4px 0 0 #0d9488, 0 4px 6px -1px rgba(0, 0, 0, 0.05); }

        /* ==========================================
           🚀 2. 拓寬主容器與自適應黃金高度 (Golden Ratio Width)
           ========================================== */
        #canvasContainer { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            overflow-y: auto !important; 
            overflow-x: hidden; 
            background-color: #e2e8f0; 
        }

        #posterScaleWrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100%;
            padding: 20px 0 60px 0;
            transform: none !important; 
        }

        /* 📐 主容器縮減為黃金寬度 */
        #posterPrintArea {
            width: 92% !important;
            max-width: 780px !important;  /* 🛠️ 縮小至最舒適的 Web App 寬度，維持視覺緊湊 */
            margin: 20px auto !important;
            min-height: 80vh !important;
            height: auto !important;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            position: relative !important;
            top: auto !important;
            left: auto !important;
            transform: none !important;
            overflow: visible !important;
        }

        /* 📐 主容器與內邊距微調 (減少垂直留白) */
        .room-content-wrapper {
            padding: 15px 20px !important;
            padding-bottom: 60px !important; 
        }
        .main-card, .sub-card {
            padding: 15px 20px !important;
            border-radius: 16px !important;
            border-width: 3px !important;
        }

        /* 🔵 關卡節點精細排版 */
        .level-nodes-container {
            display: flex !important;
            justify-content: space-around !important; 
            align-items: center !important;
            width: 100% !important;
            padding: 15px 5px !important;
            gap: 8px !important; 
            box-sizing: border-box !important;
        }

        /* 🔵 節點尺寸微調縮小 */
        .level-node-btn {
            width: 36px !important;
            height: 36px !important;
            line-height: 36px !important;
            font-size: 13px !important;
            flex-shrink: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            border-radius: 9999px !important;
        }

        /* 🔤 全域字體微調縮小 (Typography Scaling) */
        #posterPrintArea h1, #posterPrintArea .main-title {
            font-size: 1.55rem !important;
            line-height: 1.4 !important;
            margin-bottom: 0.5rem !important;
        }
        #posterPrintArea h2, #posterPrintArea h3, #posterPrintArea .subtitle {
            font-size: 1.15rem !important;
            line-height: 1.4 !important;
            margin-bottom: 0.5rem !important;
        }
        #posterPrintArea p:not(.decoration-only), 
        #posterPrintArea button:not(.level-node-btn), 
        #posterPrintArea .desc-text {
            font-size: 0.95rem !important;
            line-height: 1.5 !important;
        }
        /* 防止 Emoji 被過度縮小 */
        #posterPrintArea .decoration-only {
            font-size: 4.5rem !important;
            margin-bottom: 0.5rem !important;
            line-height: 1 !important;
        }

        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 錯誤震動彈回動畫 (Shake-bounce) */
        .shake-bounce { animation: shakeBounce 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeBounce {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        /* 正確放大彈跳動畫 (Scale-bounce) */
        .scale-bounce { animation: scaleBounce 0.4s cubic-bezier(.175, .885, .32, 1.275) both; }
        @keyframes scaleBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pop-anim { animation: popOut 0.3s forwards; }
        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        #confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }

        /* 可拖曳排序物件樣式 */
        .sortable-item { cursor: grab; transition: transform 0.2s, background-color 0.2s, border-color 0.2s; }
        .sortable-item:active { cursor: grabbing; }
        .sortable-item.dragging { opacity: 0.4; transform: scale(0.98); }
    </style>
</head>

            if (levelTxt) levelTxt.innerText = globalLevel;
            if (expBar) expBar.style.width = `${(globalExp / expNeeded) * 100}%`;
        }

            const toastIcon = document.getElementById('toastIcon');
            if (!toast || !toastMsg || !toastIcon) return;
            
            toastMsg.innerText = msg;
            toastIcon.className = type === 'error' ? "fa-solid fa-circle-exclamation text-rose-500 text-3xl" : "fa-solid fa-circle-check text-emerald-500 text-3xl";
            toast.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');

            if(!roomResults[currentRoomId]) roomResults[currentRoomId] = [];
            roomResults[currentRoomId][roomProgress[currentRoomId]] = isCorrect;

        // ==========================================
        // 拖曳排序 (Drag & Drop) 引擎 (R7, R8 專用)
        // ==========================================
        function sortDragStart(e) {
            if (!e || !e.currentTarget) return;
            draggedSortItem = e.currentTarget;
            const item = e.currentTarget;
            setTimeout(() => {
                if (item && item.classList) item.classList.add('opacity-50', 'scale-95');
            }, 0);
            if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
        }

        function sortDragEnd(e) {
            if (!e || !e.currentTarget) return;
            if (e.currentTarget.classList) e.currentTarget.classList.remove('opacity-50', 'scale-95');
            document.querySelectorAll('.sortable-item').forEach(item => {
                item.style.borderTop = "";
                item.style.borderBottom = "";
            });
            draggedSortItem = null;
        }

        function sortDragEnter(e) {
            if (e && e.preventDefault) e.preventDefault();
        }

        function sortDragOver(e) {
            if (!e) return;
            if (e.preventDefault) e.preventDefault();
            const target = e.currentTarget;
            if (target && draggedSortItem && target !== draggedSortItem && target.classList && target.classList.contains('sortable-item')) {
                const bounding = target.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                if (e.clientY - offset > 0) {
                    target.style.borderBottom = "6px solid #0d9488";
                    target.style.borderTop = "";
                } else {
                    target.style.borderTop = "6px solid #0d9488";
                    target.style.borderBottom = "";
                }
            }
        }

        function sortDragLeave(e) {
            if (!e || !e.currentTarget) return;
            e.currentTarget.style.borderTop = "";
            e.currentTarget.style.borderBottom = "";
        }

        function sortDrop(e) {
            if (!e || !e.currentTarget) return;
            if (e.preventDefault) e.preventDefault();
            const target = e.currentTarget;
            target.style.borderTop = "";
            target.style.borderBottom = "";
            
            if (target && draggedSortItem && target !== draggedSortItem && target.classList && target.classList.contains('sortable-item')) {
                const bounding = target.getBoundingClientRect();
                const offset = bounding.y + (bounding.height / 2);
                const container = document.getElementById('sortableContainer');
                if (container) {
                    if (e.clientY - offset > 0) {
                        container.insertBefore(draggedSortItem, target.nextSibling);
                    } else {
                        container.insertBefore(draggedSortItem, target);
                    }
                }
            }
        }

                    btn.innerHTML = `<i class="fa-solid fa-check-double"></i> 驗證正確！即將自動跳轉...`;
                }
                
                if(!roomResults[currentRoomId]) roomResults[currentRoomId] = [];
                roomResults[currentRoomId][roomProgress[currentRoomId]] = true;

                updateGlobalExp(15);
                showToast("🏆 排序完全正確！大腦切換成功！", "success");
                fireConfetti();
                
                // 延遲 1000ms 自動跳轉下一題
                setTimeout(() => {
                    nextQuizQuestion();
                }, 1000);
            } else {
                // 答錯邏輯
                container.classList.remove('shake-bounce');
                void container.offsetWidth; // trigger reflow
                container.classList.add('shake-bounce');
                
                items.forEach(item => {
                    item.classList.replace('border-slate-200', 'border-rose-400');
                    item.classList.replace('bg-white', 'bg-rose-50');
                    setTimeout(() => {
                        item.classList.replace('border-rose-400', 'border-slate-200');
                        item.classList.replace('bg-rose-50', 'bg-white');
                    }, 800);
                });
                
                if (btn) {
                    const origClass = btn.className;
                    const origText = btn.innerHTML;
                    btn.className = btn.className.replace(/bg-purple-600|bg-indigo-600/g, 'bg-rose-600');
                    btn.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> 順序錯誤！請重新調整`;
                    
                    setTimeout(() => {
                        btn.className = origClass;
                        btn.innerHTML = origText;
                    }, 1200);
                }

                showToast("❌ 順序不正確！大腦出現混亂，請再試一次。", "error");
            }
        }

        // ==========================================
        // 歷史相容空函數預防 (ASD特有)
        // ==========================================
        function toggleTimeBlindness() {}
        function handleEnergyAction() {}

        // ==========================================
        // 渲染主畫面
        // ==========================================
        function renderRoom() {
            const canvas = document.getElementById('posterPrintArea');
            if (!canvas) return;

            // 🛠️ 安全防護 1：確保 config 存在，避免崩潰
            let config = roomsConfig.find(r => r.id === currentRoomId);
            if (!config) {
                currentRoomId = 'r1';
                config = roomsConfig.find(r => r.id === 'r1');
            }

            // 🛠️ 安全防護 2：確保 currentIndex 是有效的數字
            let currentIndex = roomProgress[currentRoomId];
            if (currentIndex === undefined || currentIndex === null || isNaN(currentIndex)) {
                roomProgress[currentRoomId] = 0;
                currentIndex = 0;
            }
            
            let totalTasks = 8;
            
            // 🛠️ 關卡節點排版微調
            let nodesHtml = `
                <div class="w-full overflow-x-auto hide-scrollbar pb-2">
                    <div class="level-nodes-container relative min-w-[500px] max-w-[800px] mx-auto px-4 mt-2">
                        <div class="absolute left-[6.25%] right-[6.25%] top-1/2 -translate-y-1/2 h-1.5 bg-slate-200 z-0 rounded-full"></div>
                        <div class="absolute left-[6.25%] top-1/2 -translate-y-1/2 h-1.5 bg-teal-500 z-0 rounded-full transition-all duration-500" style="width: ${(Math.min(currentIndex, totalTasks-1) / (totalTasks - 1)) * 100}%"></div>
            `;
            
            for(let i=0; i<totalTasks; i++) {
                let stateClass, icon;
                if (i < currentIndex || (currentIndex === 8 && i <= 7)) { 
                    stateClass = "bg-teal-500 text-white border-teal-600 shadow-md"; 
                    icon = "✓"; 
                } else if (i === currentIndex) { 
                    stateClass = "bg-white border-teal-500 text-teal-600 shadow-[0_0_15px_rgba(20,184,166,0.5)] ring-4 ring-teal-100 transform scale-110"; 
                    icon = i + 1; 
                } else { 
                    stateClass = "bg-slate-100 border-slate-300 text-slate-400"; 
                    icon = "🔒"; 
                }
                nodesHtml += `<button onclick="window.changeTask(${i})" class="level-node-btn border-[3px] flex items-center justify-center font-black z-10 transition-all duration-300 ${stateClass} cursor-pointer hover:scale-110">${icon}</button>`;
            }
            nodesHtml += `</div></div>`;

            let contentHtml = "";

            // 結算畫面
            if (currentIndex >= totalTasks) {
                const results = roomResults[currentRoomId] || [];
                const correctCount = results.filter(Boolean).length;
                let stars = 1;
                let titleMsg = "特工，再接再厲！";
                let descMsg = "失敗是學習的一部分，成長心態會幫助你越來越強！";
                
                if (correctCount >= 8) { 
                    stars = 3; titleMsg = "完美潛入！神級特工！"; 
                    descMsg = "你的大腦煞車與社交雷達無可挑剔，完美破關！";
                }
                else if (correctCount >= 5) { 
                    stars = 2; titleMsg = "表現優異！"; 
                    descMsg = "你已經掌握了大部分的特工技巧，再稍微留意陷阱就完美了！";
                }

                let starsHtml = "";
                for(let i=0; i<3; i++) {
                    if (i < stars) starsHtml += `<i class="fa-solid fa-star text-yellow-400 text-[100px] drop-shadow-md transform hover:scale-110 transition animate-bounce decoration-only" style="animation-delay: ${i*0.1}s"></i>`;
                    else starsHtml += `<i class="fa-solid fa-star text-slate-200 text-[100px] drop-shadow-sm decoration-only"></i>`;
                }

                contentHtml = `
                    <div class="flex flex-col items-center justify-center h-full w-full fade-in py-6 text-center room-content-wrapper">
                        <div class="flex gap-4 mb-6">
                            ${starsHtml}
                        </div>
                        <h2 class="main-title font-black text-teal-600 drop-shadow-sm">${titleMsg}</h2>
                        <div class="sub-card bg-white border-slate-200 shadow-sm mb-4">
                            <p class="subtitle text-slate-700 font-black">答對率：<span class="text-teal-600">${correctCount} / ${totalTasks}</span></p>
                        </div>
                        <p class="desc-text text-slate-500 font-bold mb-8 max-w-2xl">${descMsg}</p>
                        <div class="flex gap-4 w-full max-w-lg">
                            <button onclick="window.retryRoom()" class="flex-1 bg-white border-slate-300 hover:bg-slate-100 text-slate-600 font-black transition shadow-sm rounded-xl py-3 border-[3px]">重新挑戰</button>
                            <button onclick="window.toggleSidebar()" class="flex-1 bg-teal-500 hover:bg-teal-600 border-teal-600 text-white font-black transition shadow-md rounded-xl py-3 border-[3px]">選擇其他訓練</button>
                        </div>
                    </div>
                `;
            } 
            else if (config.type === 'quiz') {
                const db = quizDb[currentRoomId];
                if (!db || !db[currentIndex]) {
                    roomProgress[currentRoomId] = 0;
                    currentIndex = 0;
                }
                const data = (db && db[currentIndex]) ? db[currentIndex] : { q: "無資料", c: "無", w1: "無", w2: "無", emoji: "❓" };

                // 🛠️ 安全防護 3：檢查 data.c 是否存在，防止 TypeError
                let optC = data.c !== undefined ? data.c : "正確選項";
                let optW1 = data.w1 !== undefined ? data.w1 : "錯誤選項 1";
                let optW2 = data.w2 !== undefined ? data.w2 : "錯誤選項 2";

                let opts = [
                    { text: optC, correct: true, originalIdx: 0 },
                    { text: optW1, correct: false, originalIdx: 1 },
                    { text: optW2, correct: false, originalIdx: 2 }
                ];
                
                const seed = data.q ? data.q.length % 3 : 0;
                if(seed === 1) opts = [opts[1], opts[0], opts[2]];
                if(seed === 2) opts = [opts[2], opts[1], opts[0]];

                const isAnswered = roomAnswered[currentRoomId];
                let cardAnimClass = "";

                let optionsHtml = opts.map((opt, idx) => {
                    let btnClass = "bg-slate-50 hover:bg-teal-50 border-slate-300 text-slate-700 cursor-pointer";
                    let animClass = "";
                    
                    if (isAnswered) {
                        if (opt.correct) {
                            btnClass = "bg-emerald-50 border-emerald-400 text-emerald-800";
                            if (lastAnswerResult && lastAnswerResult.isCorrect && lastAnswerResult.selectedIdx === idx) {
                                animClass = "scale-bounce"; 
                            }
                        } else if (lastAnswerResult && !lastAnswerResult.isCorrect && lastAnswerResult.selectedIdx === idx) {
                            btnClass = "bg-rose-50 border-rose-400 text-rose-800";
                            cardAnimClass = "shake-bounce"; 
                        } else {
                            btnClass = "bg-slate-50 border-slate-200 text-slate-400 opacity-50 cursor-not-allowed";
                        }
                    }
                    return `<button onclick="window.checkQuizAnswer(${idx}, ${opts.findIndex(o => o.correct)})" class="w-full border-[3px] ${btnClass} ${animClass} font-bold rounded-xl transition-all text-left px-5 py-3 shadow-sm relative overflow-hidden">${opt.text}</button>`;
                }).join('');

                let feedbackHtml = "";
                if (isAnswered) {
                    const isCorrect = lastAnswerResult && lastAnswerResult.isCorrect;
                    feedbackHtml = `
                        <div class="mt-4 p-4 rounded-xl border-[3px] ${isCorrect ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-rose-100 border-rose-300 text-rose-800'} fade-in shadow-inner shrink-0 relative overflow-hidden">
                            <h4 class="font-black text-lg mb-1">${isCorrect ? '✅ 判端正確！' : '❌ 發生誤判！'}</h4>
                            <p class="desc-text font-bold leading-relaxed">${isCorrect ? data.feedbackCorrect || '幹得好！你成功看穿了隱藏的社交線索，沒有被表面的事物騙倒。' : data.feedbackWrong || '注意！自閉症特工容易因為「字面解讀」或「衝動」而誤解別人的意思，請再仔細看看正確答案的解析！'}</p>
                        </div>
                        <button onclick="window.nextQuizQuestion()" class="w-full bg-teal-500 hover:bg-teal-600 border-[3px] border-teal-600 text-white font-black py-3 rounded-xl transition shadow-md mt-4 shrink-0 flex items-center justify-center gap-2">前往下一關 <i class="fa-solid fa-arrow-right"></i></button>
                    `;
                }

                let comboUI = currentCombo >= 3 ? `<div class="absolute -top-4 -right-4 bg-gradient-to-r from-orange-500 to-red-600 text-white font-black px-4 py-1.5 rounded-full shadow-2xl transform rotate-12 animate-pulse text-lg border-2 border-white z-50">🔥 Combo x${currentCombo}!</div>` : '';

                contentHtml = `
                    <div class="flex flex-col md:flex-row gap-6 flex-grow h-auto min-h-full pb-[80px]">
                        <div id="quizMainCard" class="main-card w-full md:w-[48%] flex flex-col justify-center items-center bg-white border-slate-200 shadow-inner relative ${cardAnimClass}">
                            ${comboUI}
                            <div class="decoration-only drop-shadow-lg mt-4 text-[80px]">${data.emoji || config.icon}</div>
                            <h3 class="subtitle font-black text-slate-800 text-center w-full px-2">${data.q || data.situation || "無情境"}</h3>
                        </div>
                        <div class="sub-card w-full md:w-[52%] bg-white border-teal-300 flex flex-col shadow-xl h-auto">
                            <h3 class="subtitle font-black text-slate-800 flex items-center gap-2 border-b-2 border-slate-100 pb-2 shrink-0"><i class="fa-solid fa-crosshairs text-teal-500"></i> 請選出正確的解讀或回應：</h3>
                            <div class="space-y-3 flex-grow flex flex-col justify-center mt-2">
                                ${optionsHtml}
                            </div>
                            ${feedbackHtml}
                        </div>
                    </div>
                `;
            } 
            else if (config.type === 'chunking') {
                const db = chunkingDb[currentRoomId];
                if (!db || !db[currentIndex]) {
                    roomProgress[currentRoomId] = 0;
                    currentIndex = 0;
                }
                const data = (db && db[currentIndex]) ? db[currentIndex] : { name: "無資料", steps: [] };
                
                // 初次載入或切換題目時，初始化並打亂順序
                if (currentSortableItems.length === 0 && data.steps && data.steps.length > 0) {
                    currentSortableItems = data.steps.map((step, idx) => ({
                        id: idx,
                        text: step.replace(/^\d+\.\s*/, '') // 移除數字前綴
                    })).sort(() => Math.random() - 0.5);
                }

                let stepsHtml = currentSortableItems.map((item) => {
                    return `
                        <div draggable="true" data-id="${item.id}"
                             ondragstart="window.sortDragStart(event)"
                             ondragover="window.sortDragOver(event)"
                             ondrop="window.sortDrop(event)"
                             ondragenter="window.sortDragEnter(event)"
                             ondragleave="window.sortDragLeave(event)"
                             ondragend="window.sortDragEnd(event)"
                             class="sortable-item w-full bg-white hover:bg-purple-50 text-slate-700 border-[3px] border-slate-200 shadow-sm hover:border-purple-300 transition-all font-bold rounded-xl flex items-center px-4 py-2 cursor-grab text-left">
                            <i class="fa-solid fa-grip-vertical text-slate-400 text-xl mr-3 px-1 pointer-events-none"></i>
                            <span class="desc-text flex-grow pointer-events-none">${item.text}</span>
                        </div>
                    `;
                }).join('');

                contentHtml = `
                    <div class="flex flex-col md:flex-row gap-6 flex-grow h-auto min-h-full pb-[80px]">
                        <div class="main-card w-full md:w-[45%] flex flex-col justify-center items-center bg-slate-200 border-slate-400 shadow-inner relative text-center">
                            <h2 class="subtitle font-black text-slate-600 w-full">恐懼牆 (Wall of Awful)</h2>
                            <div class="decoration-only drop-shadow-xl text-[80px] mb-4">👹</div>
                            <h3 class="main-title font-black text-slate-800">${data.name || "無名稱"}</h3>
                            <p class="desc-text font-bold text-slate-500 mt-2">打亂順序的任務，大腦最討厭了！</p>
                        </div>
                        <div class="sub-card w-full md:w-[55%] bg-white border-purple-300 flex flex-col shadow-xl h-auto">
                            <h3 class="subtitle font-black text-slate-800 flex items-center gap-2 border-b-2 border-slate-100 pb-2 shrink-0"><i class="fa-solid fa-scissors text-purple-500"></i> 任務切碎與邏輯排序</h3>
                            <p class="desc-text text-slate-500 font-bold mb-2">請「拖曳」下方步驟，排成正確的執行順序：</p>
                            
                            <div id="sortableContainer" class="w-full flex flex-col gap-2 flex-grow justify-center transition-all duration-300">
                                ${stepsHtml}
                            </div>
                            
                            <button id="chkSortBtn" onclick="window.verifySortableTask()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-black py-3 rounded-xl transition shadow-md mt-4 shrink-0 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-check-double"></i> 確認完成 / 檢查答案
                            </button>
                        </div>
                    </div>
                `;
            }

            html = `
                <div class="flex flex-col flex-grow bg-white relative rounded-[24px] h-auto min-h-full">
                    <div class="flex justify-between items-center border-b-2 border-slate-200 px-6 pt-6 pb-4 shrink-0 bg-white z-10 shadow-sm overflow-visible rounded-t-[24px]">
                        <div class="shrink-0 mr-6">
                            <span class="text-teal-600 font-bold text-sm leading-relaxed block">${config.title}</span>
                            <h1 class="main-title font-black text-slate-800 mt-1 leading-tight">${config.desc}</h1>
                        </div>
                    </div>
                    ${nodesHtml}
                    <!-- 🛠️ 修復：配置 pb-[140px] 呼吸空間，確保內容溢出時向下滑動不被切除 -->
                    <div class="flex-grow p-6 bg-slate-50 overflow-y-auto custom-scrollbar flex flex-col relative pb-[140px] !important min-h-0">
                        ${contentHtml}
                    </div>
                </div>
            `;

            canvas.innerHTML = html;
        }

        // ==========================================
        // 初始化與安全掛載
        // ==========================================
        Object.assign(window, {
            toggleSidebar, resizeCanvas, showToast, fireConfetti, selectRoom, renderRoom, changeTask,
            checkQuizAnswer, nextQuizQuestion, retryRoom,
            sortDragStart, sortDragEnd, sortDragEnter, sortDragOver, sortDragLeave, sortDrop, verifySortableTask, scrollTabs
        });

        window.onload = function() { 
            initSidebar();
            selectRoom('r1'); 
        } 
    </script>
</body>
</html>
