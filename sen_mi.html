    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 拖曳與選取互動樣式 - 療癒的薰衣草/靛藍色系 */
        .drop-zone { transition: all 0.2s ease; border-width: 4px; }
        .drop-zone.dragover { background-color: #e0e7ff; border-color: #6366f1; transform: scale(1.05); }
        .draggable-item { cursor: grab; transition: transform 0.1s, box-shadow 0.1s; touch-action: none; border: 2px solid transparent; }
        .draggable-item:active { cursor: grabbing; transform: scale(0.95); }
        .draggable-item.selected { border-color: #818cf8; background-color: #e0e7ff; transform: translateY(-3px); box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2); color: #4338ca; }
        
        /* 特殊互動特效 */
        .memory-flash { animation: flash 0.5s ease-in-out; }
        @keyframes flash { 0%, 100% { opacity: 1; filter: brightness(1); } 50% { opacity: 0.8; filter: brightness(1.2); box-shadow: 0 0 20px #a5b4fc;} }

        /* 煙火特效粒子 */
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 9999; pointer-events: none; animation: fall linear forwards; border-radius: 2px; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.5); opacity: 0; }
        }
        
        /* 錯誤震動特效 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .pointer-events-none { pointer-events: none; }
        
        /* 心靈濾鏡淨化動畫 */
        @keyframes purify {
            0% { transform: scale(1); filter: grayscale(100%); opacity: 0.7; }
            50% { transform: scale(1.08); filter: grayscale(0%); box-shadow: 0 0 25px rgba(52, 211, 153, 0.6); }
            100% { transform: scale(1); filter: grayscale(0%); }
        }
        .animate-purify { animation: purify 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* 呼吸/充填呼吸燈 */
        @keyframes pulse-energy {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.03); opacity: 1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
        }
        .battery-fill-active { animation: pulse-energy 2s infinite ease-in-out; }

        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15%); }
        }
        .animate-bounce-short { animation: bounce-short 0.5s ease-in-out; }
    </style>
</head>

        let state = { currentLevelIndex: 0, energyAnswered: 0 };
        const totalQuestions = blLevels.reduce((sum, level) => sum + level.questions.length, 0);

        let currentQIndex = 0;
        let userSequence = []; 
        let globalSelectedObj = null;
        let checkCurrentAnswer = () => {}; 

        document.addEventListener("DOMContentLoaded", () => {
            loadProgress();
            initSidebar();
            loadLevel(state.currentLevelIndex);
            
            // 任務目錄開關按鈕
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggle-sidebar');
            const closeBtn = document.getElementById('close-sidebar');

            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (window.innerWidth >= 768) {
                    sidebar.classList.toggle('md:translate-x-0');
                    sidebar.classList.toggle('md:-translate-x-full');
                    sidebar.classList.toggle('md:absolute');
                } else {
                    sidebar.classList.toggle('-translate-x-full');
                }
            });

            closeBtn.addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
                if (window.innerWidth >= 768) {
                    sidebar.classList.add('md:-translate-x-full');
                }
            });
        });

        function saveProgress() {
            try {
                localStorage.setItem('senMiState', JSON.stringify(state));
            } catch(e) {
                console.warn("無法儲存進度：", e);
            }
            updateEnergy();
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('senMiState');
                if(saved) {
                    const parsedState = JSON.parse(saved);
                    if (parsedState && typeof parsedState.currentLevelIndex === 'number') {
                        state.currentLevelIndex = parsedState.currentLevelIndex;
                    }
                    if (parsedState && typeof parsedState.energyAnswered === 'number') {
                        state.energyAnswered = parsedState.energyAnswered;
                    }
                    if(state.currentLevelIndex >= blLevels.length || state.currentLevelIndex < 0) {
                        state.currentLevelIndex = 0;
                    }
                }
            } catch(e) {
                console.warn("無法讀取進度，以初始狀態載入：", e);
                state = { currentLevelIndex: 0, energyAnswered: 0 };
            }
            updateEnergy();
        }

        function triggerResetModal() {
            document.getElementById('reset-modal').classList.remove('hidden');
        }

        function closeResetModal() {
            document.getElementById('reset-modal').classList.add('hidden');
        }

        function confirmReset() {
            closeResetModal();
            state = { currentLevelIndex: 0, energyAnswered: 0 };
            saveProgress();
            initSidebar();
            loadLevel(0);
        }

        function updateEnergy() {
            const bar = document.getElementById('energy-bar');
            const text = document.getElementById('energy-text');
            let percent = Math.min(Math.round((state.energyAnswered / totalQuestions) * 100), 100);
            bar.style.width = percent + '%';
            text.innerText = percent + '%';
        }

        function initSidebar() {
            const list = document.getElementById('level-list');
            list.innerHTML = '';
            let currentStage = "";
            
            blLevels.forEach((level, index) => {
                if (level.stage !== currentStage) {
                    currentStage = level.stage;
                    const stageDiv = document.createElement('div');
                    stageDiv.className = 'text-xs font-black text-indigo-500 mt-5 mb-2 px-2 border-l-4 border-indigo-500';
                    stageDiv.innerText = currentStage;
                    list.appendChild(stageDiv);
                }

                const btn = document.createElement('button');
                const isActive = index === state.currentLevelIndex;
                btn.className = `w-full text-left px-3 py-3 rounded-2xl border-2 transition font-bold text-sm flex items-center gap-2 ${isActive ? 'border-indigo-500 bg-indigo-50 text-indigo-800 shadow-md transform scale-[1.02]' : 'border-indigo-100 bg-white hover:border-indigo-400 text-gray-600'}`;
                btn.innerHTML = `<i class="fa-solid fa-heart-pulse ${isActive ? 'text-indigo-500 animate-pulse' : 'text-gray-300'} w-5 text-center"></i> <span class="truncate">${level.title}</span>`;
                
                btn.onclick = () => {
                    state.currentLevelIndex = index;
                    saveProgress();
                    initSidebar(); 
                    loadLevel(state.currentLevelIndex);
                    if (window.innerWidth < 768) {
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                    }
                };
                list.appendChild(btn);
            });
        }

        function loadLevel(levelIndex) {
            currentQIndex = 0;
            const level = blLevels[levelIndex];
            
            document.getElementById('current-stage-tag').innerText = level.stage;
            document.getElementById('current-level-title').innerText = level.title;
            document.getElementById('current-level-desc').innerText = level.desc;
            
            renderProgressNodes(level);
            renderQuestion();
        }

        function renderProgressNodes(level) {
            const container = document.getElementById('progress-nodes');
            container.innerHTML = '';
            const qCount = level.questions.length;
            
            for(let i=0; i<qCount; i++) {
                const node = document.createElement('div');
                node.className = 'flex items-center gap-1';
                const circle = document.createElement('div');
                circle.className = `w-8 h-8 rounded-full flex items-center justify-center font-black text-sm border-2 transition-all duration-300 ${i < currentQIndex ? 'bg-indigo-500 border-indigo-500 text-white shadow-md' : (i === currentQIndex ? 'bg-yellow-300 border-yellow-400 text-yellow-800 shadow-md scale-110' : 'bg-gray-100 border-gray-200 text-gray-400')}`;
                circle.innerHTML = i < currentQIndex ? '<i class="fa-solid fa-check"></i>' : (i + 1);
                node.appendChild(circle);
                container.appendChild(node);
            }
        }

        function renderQuestion() {
            const level = blLevels[state.currentLevelIndex];
            if(currentQIndex >= level.questions.length) {
                showLevelComplete();
                return;
            }

            const qData = level.questions[currentQIndex];
            const area = document.getElementById('interactive-area');
            const hintArea = document.getElementById('hint-content');
            const feedback = document.getElementById('feedback-area');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            area.innerHTML = ''; 
            feedback.className = 'hidden'; 
            submitBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            if(retryBtn) retryBtn.classList.add('hidden');
            userSequence = [];
            globalSelectedObj = null;
            checkCurrentAnswer = () => {}; 
            
            renderProgressNodes(level);
            hintArea.innerHTML = `<span class="text-indigo-600 block mb-2"><i class="fa-solid fa-comment-dots"></i> 暖心小提示：</span>${qData.hint || "請仔細閱讀並選擇最合適的答案。"}`;
            
            setTimeout(() => playTTS(qData.q || qData.text || qData.audioText || qData.negText || level.desc), 500);
            
            if (level.type === 'drag-category') {
                renderCategory(qData, area, submitBtn);
            } else if (level.type === 'choice') {
                renderChoice(qData, area, submitBtn);
            } else if (level.type === 'sequence') {
                renderSequence(qData, area, submitBtn);
            } else if (level.type === 'fill-blank') {
                renderFillBlank(qData, area, submitBtn);
            } else if (level.type === 'lens-purify') {
                renderLensPurify(qData, area, submitBtn);
            } else if (level.type === 'drag-battery') {
                renderDragBattery(qData, area, submitBtn);
            }
        }

        function clearSelection() {
            document.querySelectorAll('.draggable-item').forEach(el => el.classList.remove('selected', 'ring-4', 'ring-indigo-400'));
            globalSelectedObj = null;
        }

        function dismissWarning() {
            const feedbackArea = document.getElementById('feedback-area');
            if (feedbackArea.classList.contains('bg-amber-50')) {
                feedbackArea.classList.add('hidden');
            }
        }

        function renderCategory(qData, container, submitBtn) {
            const boxesContainer = document.createElement('div');
            boxesContainer.className = 'flex flex-col md:flex-row gap-6 w-full justify-center mb-8';

            qData.categories.forEach(cat => {
                const boxWrapper = document.createElement('div');
                boxWrapper.className = 'flex flex-col items-center flex-1 w-full min-w-[200px]';
                
                const box = document.createElement('div');
                box.className = 'drop-zone w-full min-h-[160px] border-4 border-dashed border-indigo-300 rounded-3xl flex flex-col items-center p-3 bg-indigo-50/50 shadow-sm transition relative overflow-hidden';
                box.innerHTML = `
                    <div class="bg-white rounded-full w-14 h-14 flex items-center justify-center mb-2 shadow-sm pointer-events-none">
                        <i class="fa-solid fa-box-open text-3xl text-indigo-500"></i>
                    </div>
                    <span class="font-black text-sm sm:text-base bg-indigo-200 text-indigo-900 px-4 py-1 rounded-full pointer-events-none whitespace-nowrap">${cat}</span>
                `;
                
                const itemContainer = document.createElement('div');
                itemContainer.className = 'w-full flex flex-wrap justify-center gap-2 mt-4 pointer-events-none';
                box.appendChild(itemContainer);

                box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('dragover'); });
                box.addEventListener('dragleave', () => { box.classList.remove('dragover'); });
                box.addEventListener('drop', (e) => {
                    e.preventDefault(); box.classList.remove('dragover');
                    const wordText = e.dataTransfer.getData('text/plain');
                    if(wordText) processCategoryDrop(wordText, itemContainer);
                });
                
                box.addEventListener('click', () => {
                    if(globalSelectedObj) processCategoryDrop(globalSelectedObj.dataset.text, itemContainer, globalSelectedObj);
                });

                boxWrapper.appendChild(box);
                boxesContainer.appendChild(boxWrapper);
            });

            const wordsContainer = document.createElement('div');
            wordsContainer.className = 'flex flex-wrap gap-4 w-full justify-center min-h-[100px] bg-gray-100 p-6 rounded-3xl shadow-inner border-2 border-gray-200';
            
            let shuffledWords = [...qData.words].sort(() => Math.random() - 0.5);

            shuffledWords.forEach(w => {
                const wordBlock = document.createElement('div');
                wordBlock.className = 'draggable-item bg-white text-gray-800 border-2 border-indigo-200 font-black text-base sm:text-lg py-2 sm:py-3 px-4 sm:px-5 rounded-2xl shadow-md select-none transition flex items-center gap-3 cursor-pointer';
                wordBlock.draggable = true;
                wordBlock.dataset.text = w.text;
                
                wordBlock.innerHTML = `
                    <span>${w.text}</span>
                    <button class="tts-btn bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-full w-8 h-8 flex items-center justify-center transition shrink-0" onclick="event.stopPropagation(); playTTS('${w.text}')" title="聆聽">
                        <i class="fa-solid fa-volume-low text-sm"></i>
                    </button>
                `;

                wordBlock.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', w.text);
                    e.dataTransfer.effectAllowed = 'move';
                    setTimeout(() => wordBlock.classList.add('opacity-50'), 0);
                    clearSelection();
                    dismissWarning();
                });
                wordBlock.addEventListener('dragend', () => wordBlock.classList.remove('opacity-50'));
                
                wordBlock.addEventListener('click', (e) => {
                    if (e.target.closest('.tts-btn')) return;
                    dismissWarning();
                    if (wordBlock.classList.contains('selected')) {
                        clearSelection();
                        return;
                    }
                    clearSelection();
                    wordBlock.classList.add('selected');
                    globalSelectedObj = wordBlock;
                });
                
                wordsContainer.appendChild(wordBlock);
            });

            container.appendChild(boxesContainer);
            container.appendChild(wordsContainer);
            
            submitBtn.classList.remove('hidden');
            
            function processCategoryDrop(wordText, itemContainer, originalEl = null) {
                let elToMove = originalEl || document.querySelector(`.draggable-item[data-text="${wordText}"]`);
                if (elToMove) {
                    itemContainer.appendChild(elToMove);
                    clearSelection();
                    dismissWarning();
                }
            }

            checkCurrentAnswer = () => {
                let allCorrect = true;
                let sortedItems = 0;
                
                qData.categories.forEach((cat, index) => {
                    const boxWrapper = boxesContainer.children[index];
                    const itemContainer = boxWrapper.querySelector('div:last-child');
                    const items = itemContainer.querySelectorAll('.draggable-item');
                    sortedItems += items.length;
                    
                    items.forEach(item => {
                        const wordText = item.dataset.text;
                        const correctCat = qData.words.find(w => w.text === wordText).cat;
                        if (correctCat !== cat) {
                            allCorrect = false;
                        }
                    });
                });
                
                /* 強制提交檢查與即時拒絕邏輯 */
                if (sortedItems < qData.words.length) {
                    showFeedback("warning", "請將所有情緒都分類完畢，我們再一起對答案喔！");
                    return;
                }
                
                showFeedback(allCorrect, allCorrect ? "太棒了！您對情緒分類掌握得非常好！" : "有些情緒需要重新安放，再次確認喔。");
            };
        }

        function renderLensPurify(qData, container, submitBtn) {
            const negBubble = document.createElement('div');
            negBubble.className = 'w-full bg-slate-100 border-4 border-slate-300 p-6 rounded-3xl text-center shadow-inner relative transition duration-500 overflow-hidden';
            negBubble.id = 'trash-thought-bubble';
            negBubble.innerHTML = `
                <div class="absolute -top-1 -right-1 bg-slate-400 text-white text-xs font-black px-3 py-1 rounded-bl-2xl">
                    <i class="fa-solid fa-cloud-showers-heavy mr-1"></i> 負面思想灰塵
                </div>
                <p class="text-xl sm:text-2xl font-black text-slate-600 tracking-wide line-through decoration-slate-400/50" id="neg-thought-text">${qData.negText}</p>
            `;
            container.appendChild(negBubble);

            const actionText = document.createElement('p');
            actionText.className = 'text-indigo-600 font-black text-sm text-center -my-2 flex items-center gap-2 justify-center';
            actionText.innerHTML = '<i class="fa-solid fa-magnifying-glass animate-bounce"></i> 請點擊下方一個健康的「客觀鏡片」來淨化這段想法：';
            container.appendChild(actionText);

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'flex flex-col gap-4 w-full max-w-2xl';

            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'bg-white border-2 border-indigo-100 hover:border-indigo-400 hover:bg-indigo-50 text-gray-700 font-bold text-base sm:text-lg p-4 sm:p-5 rounded-2xl text-left transition shadow-sm flex items-center justify-between group';
                btn.innerHTML = `
                    <span class="flex-1 pr-4 text-left"><i class="fa-solid fa-circle-nodes text-indigo-400 mr-2"></i> ${opt}</span>
                    <i class="fa-solid fa-wand-magic-sparkles text-2xl text-gray-200 group-hover:text-indigo-300 transition shrink-0"></i>
                `;
                btn.onclick = () => {
                    const buttons = optionsContainer.querySelectorAll('button');
                    buttons.forEach(b => {
                        b.classList.remove('border-indigo-500', 'bg-indigo-50', 'ring-2', 'ring-indigo-300');
                        b.querySelector('i').classList.replace('text-indigo-500', 'text-gray-200');
                    });
                    btn.classList.add('border-indigo-500', 'bg-indigo-50', 'ring-2', 'ring-indigo-300');
                    btn.querySelector('i').classList.replace('text-gray-200', 'text-indigo-500');
                    
                    userSequence = [index]; 
                    submitBtn.classList.remove('hidden');
                };
                optionsContainer.appendChild(btn);
            });
            container.appendChild(optionsContainer);
            
            checkCurrentAnswer = () => {
                if (userSequence.length === 0) return showFeedback(false, "請先點擊選擇一個淨化鏡片！");
                const isCorrect = userSequence[0] === qData.answer;

                }
                
                showFeedback(allCorrect, allCorrect ? "充填完畢！太棒了，您成功避開了毒素，為內心灌注了滿滿的健康正能量！" : "發現有些不健康的發洩放進了電池，或者健康的充電被扔掉了，再確認一下！");

        function renderSequence(qData, container, submitBtn) {
            const isBomb = qData.orig.includes("炸彈") || qData.orig.includes("焦慮");
            
            const desc = document.createElement('div');
            desc.className = 'w-full max-w-xl text-center mb-6';
            
            if (isBomb) {
                desc.innerHTML = `
                    <div class="inline-flex items-center gap-3 bg-rose-50 border-2 border-rose-200 px-6 py-3 rounded-2xl shadow-sm">
                        <i class="fa-solid fa-bomb text-3xl text-rose-500 animate-bounce"></i>
                        <span class="text-rose-800 font-black text-lg">⚠️ 焦慮炸彈即將爆發！請排好冷靜積木以拆除：</span>
                    </div>
                `;
            } else {
                desc.innerHTML = `
                    <div class="inline-flex items-center gap-3 bg-indigo-50 border-2 border-indigo-200 px-6 py-3 rounded-2xl shadow-sm">
                        <i class="fa-solid fa-wind text-3xl text-indigo-500 animate-pulse"></i>
                        <span class="text-indigo-800 font-black text-lg">請拖曳或點擊積木，按正確順序排列：</span>
                    </div>
                `;
            }
            container.appendChild(desc);

            const listContainer = document.createElement('div');
            listContainer.className = 'flex flex-col gap-3 w-full max-w-xl';
            
            let shuffled = [...qData.words].sort(() => Math.random() - 0.5);
            let seqSelected = null;
            
            shuffled.forEach((word, index) => {
                const item = document.createElement('div');
                item.className = 'draggable-item bg-white border-2 border-indigo-200 p-4 rounded-2xl shadow-sm text-base sm:text-lg font-bold flex items-center justify-between cursor-move';
                item.draggable = true;
                item.dataset.index = index;
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-black order-num shrink-0">?</div>
                        <span>${word}</span>
                    </div>
                    <i class="fa-solid fa-grip-lines text-gray-400 shrink-0 ml-2"></i>
                `;
                
                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', item.dataset.index);
                    setTimeout(() => item.classList.add('opacity-50'), 0);
                });
                item.addEventListener('dragend', () => item.classList.remove('opacity-50'));
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    item.classList.add('border-dashed', 'border-indigo-400', 'bg-indigo-50');
                });
                item.addEventListener('dragleave', () => item.classList.remove('border-dashed', 'border-indigo-400', 'bg-indigo-50'));
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    item.classList.remove('border-dashed', 'border-indigo-400', 'bg-indigo-50');
                    const draggedIdx = e.dataTransfer.getData('text/plain');
                    if (draggedIdx !== '' && draggedIdx != item.dataset.index) {
                        const draggedEl = Array.from(listContainer.children).find(el => el.dataset.index == draggedIdx);
                        if(draggedEl) {
                            const allItems = Array.from(listContainer.children);
                            const fromIdx = allItems.indexOf(draggedEl);
                            const toIdx = allItems.indexOf(item);
                            if (fromIdx < toIdx) {
                                item.after(draggedEl);
                            } else {
                                item.before(draggedEl);
                            }
                            updateSequenceIndices();
                        }
                    }
                });
                
                item.addEventListener('click', () => {
                    if (seqSelected === null) {
                        seqSelected = item;
                        item.classList.add('ring-4', 'ring-indigo-400');
                    } else if (seqSelected === item) {
                        seqSelected = null;
                        item.classList.remove('ring-4', 'ring-indigo-400');
                    } else {
                        const parent = item.parentNode;
                        const p1 = seqSelected.nextSibling === item ? seqSelected : seqSelected.nextSibling;
                        parent.insertBefore(seqSelected, item.nextSibling);
                        parent.insertBefore(item, p1);
                        
                        seqSelected.classList.remove('ring-4', 'ring-indigo-400');
                        seqSelected = null;
                        updateSequenceIndices();
                    }
                });
                
                listContainer.appendChild(item);
            });
            
            function updateSequenceIndices() {
                Array.from(listContainer.children).forEach((child, i) => {
                    child.dataset.index = i;
                    child.querySelector('.order-num').innerText = i + 1;
                });
            }
            
            updateSequenceIndices(); 
            container.appendChild(listContainer);
            submitBtn.classList.remove('hidden');

            checkCurrentAnswer = () => {
                const currentOrder = Array.from(listContainer.children).map(el => el.querySelector('span').innerText);
                const isCorrect = JSON.stringify(currentOrder) === JSON.stringify(qData.answer);
                
                if (isCorrect && isBomb) {
                    desc.innerHTML = `
                        <div class="inline-flex items-center gap-3 bg-emerald-50 border-2 border-emerald-200 px-6 py-3 rounded-2xl shadow-sm">
                            <i class="fa-solid fa-heart-circle-check text-3xl text-emerald-500"></i>
                            <span class="text-emerald-800 font-black text-lg">🎉 拆彈成功！危機安全解除！</span>
                        </div>
                    `;
                }
                
                showFeedback(isCorrect, isCorrect ? "排序完全正確！這套危機處理步驟能迅速穩住大腦！" : "步驟好像有一點錯亂，請參照提示，再次重新排列吧！");
            };
        }

        function renderFillBlank(qData, container, submitBtn) {
            const textContainer = document.createElement('div');
            textContainer.className = 'bg-white p-6 md:p-10 rounded-3xl shadow-sm border-2 border-indigo-100 text-lg sm:text-xl leading-loose font-bold text-gray-700 w-full max-w-3xl mb-8';
            
            let htmlText = qData.text;
            qData.blanks.forEach((blank, i) => {
                htmlText = htmlText.replace(`[__${i+1}__]`, `<span class="inline-flex items-center justify-center min-w-[120px] h-[40px] border-b-4 border-dashed border-indigo-400 mx-2 text-center text-indigo-600 px-2 drop-zone empty-blank align-middle bg-gray-50 rounded-t-lg transition-colors cursor-pointer" data-index="${i}">?</span>`);
            });
            textContainer.innerHTML = htmlText;
            container.appendChild(textContainer);

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'flex flex-wrap gap-3 justify-center w-full bg-gray-100 p-5 rounded-2xl min-h-[80px]';
            
            let shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(opt => {
                const wordBlock = document.createElement('div');
                wordBlock.className = 'draggable-item bg-indigo-50 border-2 border-indigo-200 text-indigo-800 font-black py-2 px-4 rounded-xl shadow-sm cursor-grab select-none inline-block';
                wordBlock.draggable = true;
                wordBlock.innerText = opt;
                
                wordBlock.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', opt);
                    e.dataTransfer.effectAllowed = 'move';
                    setTimeout(() => wordBlock.classList.add('opacity-50'), 0);
                    globalSelectedObj = wordBlock;
                });
                wordBlock.addEventListener('dragend', () => {
                    wordBlock.classList.remove('opacity-50');
                    globalSelectedObj = null;
                });
                
                wordBlock.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (wordBlock.parentElement.classList.contains('empty-blank')) {
                        const parentBlank = wordBlock.parentElement;
                        optionsContainer.appendChild(wordBlock);
                        parentBlank.innerText = '?';
                        parentBlank.dataset.filled = "false";
                        checkFillBlankReady();
                        return;
                    }
                    
                    if (wordBlock.classList.contains('selected')) {
                        clearSelection();
                    } else {
                        clearSelection();
                        wordBlock.classList.add('selected');
                        globalSelectedObj = wordBlock;
                    }
                });
                
                optionsContainer.appendChild(wordBlock);
            });
            container.appendChild(optionsContainer);

            const blanks = textContainer.querySelectorAll('.empty-blank');
            blanks.forEach(blank => {
                blank.addEventListener('dragover', e => { e.preventDefault(); blank.classList.add('bg-indigo-100'); });
                blank.addEventListener('dragleave', () => blank.classList.remove('bg-indigo-100'));
                blank.addEventListener('drop', e => {
                    e.preventDefault();
                    blank.classList.remove('bg-indigo-100');
                    const text = e.dataTransfer.getData('text/plain');
                    handleBlankFill(blank, text);
                });
                
                blank.addEventListener('click', () => {
                    if(globalSelectedObj && !blank.dataset.filled) {
                        handleBlankFill(blank, globalSelectedObj.innerText);
                        clearSelection();
                    }
                });
            });

            function handleBlankFill(blank, text) {
                const wordEl = Array.from(optionsContainer.children).find(el => el.innerText === text) || 
                               Array.from(textContainer.querySelectorAll('.draggable-item')).find(el => el.innerText === text);
                
                if (wordEl) {
                    if (blank.dataset.filled === "true") {
                        const existingWord = blank.querySelector('.draggable-item');
                        if (existingWord) optionsContainer.appendChild(existingWord);
                    }
                    blank.innerText = '';
                    blank.appendChild(wordEl);
                    blank.dataset.filled = "true";
                    checkFillBlankReady();
                }
            }

            function checkFillBlankReady() {
                let allFilled = true;
                blanks.forEach(b => { if(b.dataset.filled !== "true") allFilled = false; });
                if(allFilled) submitBtn.classList.remove('hidden');
                else submitBtn.classList.add('hidden');
            }

            checkCurrentAnswer = () => {
                let allCorrect = true;
                blanks.forEach((blank, i) => {
                    const filledItem = blank.querySelector('.draggable-item');
                    if(filledItem && filledItem.innerText !== qData.blanks[i]) {
                        allCorrect = false;
                    } else if (!filledItem) {
                        allCorrect = false;
                    }
                });
                showFeedback(allCorrect, allCorrect ? "完全正確！當需要幫助時，主動跨出這步是非常令人自豪的！" : "有些詞語填錯了，請對照著情境再讀一次。");
            };
        }

        function showFeedback(status, msg, isCategory = false) {
            const feedbackArea = document.getElementById('feedback-area');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            feedbackArea.classList.remove('hidden');
            
            // 處理溫柔警告狀態 ( status === "warning" )
            if (status === "warning") {
                feedbackArea.className = `p-4 rounded-xl text-base sm:text-lg font-black text-center transition-all shadow-sm bg-amber-50 text-amber-800 border-2 border-amber-200`;
                feedbackArea.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-2 text-amber-500 animate-pulse"></i> ${msg}`;
                playTTS(msg);
                
                // 保留提交按鈕，不顯示下一步或重試，也不觸發錯誤動態
                submitBtn.classList.remove('hidden');
                nextBtn.classList.add('hidden');
                if (retryBtn) retryBtn.classList.add('hidden');
                return;
            }

            const isCorrect = status === true;
            feedbackArea.className = `p-4 rounded-xl text-lg font-black text-center transition-all shadow-sm ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`;
            feedbackArea.innerHTML = `<i class="fa-solid ${isCorrect ? 'fa-check-circle' : 'fa-circle-xmark'} mr-2"></i> ${msg}`;
            
            submitBtn.classList.add('hidden');
            
            if (isCorrect) {
                createConfetti();
                playTTS(msg);
                nextBtn.classList.remove('hidden');
                if(retryBtn) retryBtn.classList.add('hidden');
                
                if(!isCategory) state.energyAnswered++;
                else if (currentQIndex === 0 && !window.catAnswered) {
                    state.energyAnswered++;
                    window.catAnswered = true;
                }
                saveProgress();
                
                document.getElementById('interactive-area').style.pointerEvents = 'none';
            } else {
                playTTS(msg);
                const area = document.getElementById('interactive-area');
                area.classList.add('animate-shake');
                setTimeout(() => area.classList.remove('animate-shake'), 400);
                if(retryBtn) retryBtn.classList.remove('hidden');
                nextBtn.classList.add('hidden');
            }
        }

        function retryQuestion() {
            renderQuestion();
        }

        function nextQuestion() {
            currentQIndex++;
            window.catAnswered = false;
            document.getElementById('interactive-area').style.pointerEvents = 'auto'; 
            renderQuestion();
        }

        }

        function startNextLevel() {
            if(state.currentLevelIndex < blLevels.length - 1) {
                state.currentLevelIndex++;
                saveProgress();
                initSidebar();
                loadLevel(state.currentLevelIndex);
            }
        }

        function playTTS(text) {
            if (!text) return;
            const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/\[__[0-9]+__\]/g, '空格');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("瀏覽器不支援語音合成。");
            }
        }

        function createConfetti(amount = 50) {
            const colors = ['#818cf8', '#a78bfa', '#fbbf24', '#f472b6', '#34d399'];
            for (let i = 0; i < amount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000); 
            }
        }
    </script>
</body>
</html>
