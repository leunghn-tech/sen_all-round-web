    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 拖曳與選取互動樣式 - 適合較成熟的主題色 */
        .drop-zone { transition: all 0.2s ease; border-width: 4px; }
        .drop-zone.dragover { background-color: #ccfbf1; border-color: #14b8a6; transform: scale(1.05); }
        .draggable-item { cursor: grab; transition: transform 0.1s, box-shadow 0.1s; touch-action: none; border: 2px solid transparent; }
        .draggable-item:active { cursor: grabbing; transform: scale(0.95); }
        .draggable-item.selected { border-color: #0ea5e9; background-color: #e0f2fe; transform: translateY(-3px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);[...]
        
        /* 購物/任務清單按鈕特效 */
        .shopping-btn { transition: transform 0.2s, box-shadow 0.2s; }
        .shopping-btn:active { transform: scale(0.9); }
        .memory-flash { animation: flash 0.5s ease-in-out; }
        @keyframes flash { 0%, 100% { opacity: 1; filter: brightness(1); } 50% { opacity: 0.8; filter: brightness(1.2); box-shadow: 0 0 20px #5eead4;} }

        /* 煙火特效粒子 */
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 9999; pointer-events: none; animation: fall linear forwards; border-radius: 2px; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.5); opacity: 0; }
        }
        
        /* 錯誤震動特效 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .pointer-events-none { pointer-events: none; }
        
        /* 小動畫特效 */
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25%); }
        }
        .animate-bounce-short { animation: bounce-short 0.5s ease-in-out; }
    </style>

        function saveProgress() {
            try {
                localStorage.setItem('senBorderlineState', JSON.stringify(state));
            } catch(e) {
                console.warn("無法儲存進度：", e);
            }
            updateEnergy();
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('senBorderlineState');
                if(saved) {
                    const parsedState = JSON.parse(saved);
                    if (parsedState && typeof parsedState.currentLevelIndex === 'number') {
                        state.currentLevelIndex = parsedState.currentLevelIndex;
                    }
                    if (parsedState && typeof parsedState.energyAnswered === 'number') {
                        state.energyAnswered = parsedState.energyAnswered;
                    }
                    if(state.currentLevelIndex >= blLevels.length || state.currentLevelIndex < 0) {
                        state.currentLevelIndex = 0;
                    }
                }
            } catch(e) {
                console.warn("無法讀取進度，以初始狀態載入：", e);
                state = { currentLevelIndex: 0, energyAnswered: 0 };
            }
            updateEnergy();
        }

        function resetProgress() {
            if(confirm("確定要重新開始所有訓練任務嗎？進度將會清空。")) {
                state = { currentLevelIndex: 0, energyAnswered: 0 };
                saveProgress();
                initSidebar();
                loadLevel(0);
            }
        }

        function updateEnergy() {
            const bar = document.getElementById('energy-bar');
            const text = document.getElementById('energy-text');
            let percent = Math.min(Math.round((state.energyAnswered / totalQuestions) * 100), 100);
            bar.style.width = percent + '%';
            text.innerText = percent + '%';
        }

        function initSidebar() {
            const list = document.getElementById('level-list');
            list.innerHTML = '';
            let currentStage = "";
            
            blLevels.forEach((level, index) => {
                if (level.stage !== currentStage) {
                    currentStage = level.stage;
                    const stageDiv = document.createElement('div');
                    stageDiv.className = 'text-xs font-black text-teal-500 mt-5 mb-2 px-2 border-l-4 border-teal-500';
                    stageDiv.innerText = currentStage;
                    list.appendChild(stageDiv);
                }

                const btn = document.createElement('button');
                const isActive = index === state.currentLevelIndex;
                btn.className = `w-full text-left px-3 py-3 rounded-2xl border-2 transition font-bold text-sm flex items-center gap-2 ${isActive ? 'border-teal-500 bg-teal-50 text-teal-800 shadow[...]

        function loadLevel(levelIndex) {
            currentQIndex = 0;

            document.getElementById('current-level-desc').innerText = level.desc;
            
            renderProgressNodes(level);
            renderQuestion();
        }

        function renderProgressNodes(level) {
            const container = document.getElementById('progress-nodes');
            container.innerHTML = '';
            const qCount = level.questions.length;
            
            for(let i=0; i<qCount; i++) {
                const node = document.createElement('div');
                node.className = 'flex items-center gap-1';
                const circle = document.createElement('div');
                circle.className = `w-8 h-8 rounded-full flex items-center justify-center font-black text-sm border-2 transition-all duration-300 ${i < currentQIndex ? 'bg-emerald-500 border-emer[...]
                circle.innerHTML = i < currentQIndex ? '<i class="fa-solid fa-check"></i>' : (i + 1);
                node.appendChild(circle);
                container.appendChild(node);
            }
        }

        function renderQuestion() {
            const level = blLevels[state.currentLevelIndex];
            if(currentQIndex >= level.questions.length) {
                showLevelComplete();
                return;
            }

            const qData = level.questions[currentQIndex];
            const area = document.getElementById('interactive-area');
            const hintArea = document.getElementById('hint-content');
            const feedback = document.getElementById('feedback-area');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            area.innerHTML = ''; 
            feedback.className = 'hidden'; 
            submitBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            if(retryBtn) retryBtn.classList.add('hidden');
            userSequence = [];
            globalSelectedObj = null;
            checkCurrentAnswer = () => {}; // Reset submit handler
            
            renderProgressNodes(level);
            hintArea.innerHTML = `<span class="text-teal-600 block mb-2"><i class="fa-solid fa-comment-dots"></i> 小提示：</span>${qData.hint || "請仔細思考後，嘗試找出答案。"}`[...]
            
            // 延遲播放題目語音，避免切換太突兀
            setTimeout(() => playTTS(qData.q || qData.text || qData.audioText || level.desc), 500);
            
            if (level.type === 'drag-category') renderCategory(qData, area, submitBtn);
            else if (level.type === 'choice') renderChoice(qData, area, submitBtn);
            else if (level.type === 'sequence') renderSequence(qData, area, submitBtn);
            else if (level.type === 'memory') renderShoppingMemory(qData, area, submitBtn);
            else if (level.type === 'fill-blank') renderFillBlank(qData, area, submitBtn);
        }

            document.querySelectorAll('.draggable-item').forEach(el => el.classList.remove('selected', 'ring-4', 'ring-emerald-400'));

        function renderCategory(qData, container, submitBtn) {
            const boxesContainer = document.createElement('div');
            boxesContainer.className = 'flex flex-col md:flex-row gap-6 w-full justify-center mb-8';

            qData.categories.forEach(cat => {
                const boxWrapper = document.createElement('div');
                boxWrapper.className = 'flex flex-col items-center flex-1 w-full min-w-[200px]';
                
                const box = document.createElement('div');
                box.className = 'drop-zone w-full min-h-[160px] border-4 border-dashed border-teal-300 rounded-3xl flex flex-col items-center p-3 bg-teal-50 shadow-sm transition relative overflow[...]
                box.innerHTML = `
                    <div class="bg-white rounded-full w-14 h-14 flex items-center justify-center mb-2 shadow-sm pointer-events-none">
                        <i class="fa-solid fa-box-open text-3xl text-teal-500"></i>

                itemContainer.className = 'w-full flex flex-wrap justify-center gap-2 mt-4 pointer-events-none';
                box.appendChild(itemContainer);

                // 拖放事件
                box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('dragover'); });
                box.addEventListener('dragleave', () => { box.classList.remove('dragover'); });
                box.addEventListener('drop', (e) => {
                    e.preventDefault(); box.classList.remove('dragover');
                    const wordText = e.dataTransfer.getData('text/plain');
                    if(wordText) processCategoryDrop(wordText, itemContainer);
                });
                
                // 點擊放入事件 (支援手機版)
                box.addEventListener('click', () => {
                    if(globalSelectedObj) processCategoryDrop(globalSelectedObj.dataset.text, itemContainer, globalSelectedObj);
                });

                boxWrapper.appendChild(box);
                boxesContainer.appendChild(boxWrapper);
            });

            const wordsContainer = document.createElement('div');
            wordsContainer.className = 'flex flex-wrap gap-4 w-full justify-center min-h-[100px] bg-gray-100 p-6 rounded-3xl shadow-inner border-2 border-gray-200';
            
            // 打亂選項
            let shuffledWords = [...qData.words].sort(() => Math.random() - 0.5);

            shuffledWords.forEach(w => {
                const wordBlock = document.createElement('div');
                wordBlock.className = 'draggable-item bg-white text-gray-800 border-2 border-teal-200 font-black text-base sm:text-lg py-2 sm:py-3 px-4 sm:px-5 rounded-2xl shadow-md select-none t[...]
                wordBlock.draggable = true;
                wordBlock.dataset.text = w.text;
                
                // 補齊原本被截斷的 HTML 結構
                wordBlock.innerHTML = `
                    <span>${w.text}</span>
                    <button class="tts-btn bg-cyan-100 hover:bg-cyan-200 text-cyan-700 rounded-full w-8 h-8 flex items-center justify-center transition shrink-0" onclick="event.stopPropagation();[...]
                        <i class="fa-solid fa-volume-low text-sm"></i>
                    </button>
                `;

                wordBlock.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', w.text);
                    e.dataTransfer.effectAllowed = 'move';
                    setTimeout(() => wordBlock.classList.add('opacity-50'), 0);
                    clearSelection();
                });
                wordBlock.addEventListener('dragend', () => wordBlock.classList.remove('opacity-50'));
                
                wordBlock.addEventListener('click', (e) => {
                    if (e.target.closest('.tts-btn')) return;
                    // 如果已經選中，則取消選中
                    if (wordBlock.classList.contains('selected')) {
                        clearSelection();
                        return;
                    }
                    clearSelection();
                    wordBlock.classList.add('selected');
                    globalSelectedObj = wordBlock;
                });
                
                wordsContainer.appendChild(wordBlock);
            });

            container.appendChild(boxesContainer);
            container.appendChild(wordsContainer);
            
            submitBtn.classList.remove('hidden');
            
            function processCategoryDrop(wordText, itemContainer, originalEl = null) {
                let elToMove = originalEl || document.querySelector(`.draggable-item[data-text="${wordText}"]`);
                if (elToMove) {
                    itemContainer.appendChild(elToMove);
                    clearSelection();

            }

            checkCurrentAnswer = () => {
                let allCorrect = true;
                let sortedItems = 0;
                
                qData.categories.forEach((cat, index) => {
                    const boxWrapper = boxesContainer.children[index];
                    const itemContainer = boxWrapper.querySelector('div:last-child');
                    const items = itemContainer.querySelectorAll('.draggable-item');
                    sortedItems += items.length;
                    
                    items.forEach(item => {
                        const wordText = item.dataset.text;
                        const correctCat = qData.words.find(w => w.text === wordText).cat;
                        if (correctCat !== cat) {
                            allCorrect = false;
                        }
                    });
                });
                
                if (sortedItems < qData.words.length) {
                    showFeedback(false, "請將所有物品都放進回收箱！");
                    return;

                showFeedback(allCorrect, allCorrect ? "太棒了！分類完全正確！" : "有些物品放錯了，再檢查一下材質吧！", true);

        function renderChoice(qData, container, submitBtn) {

            container.appendChild(desc);

                const item = document.createElement('div');
                item.className = 'draggable-item bg-white border-2 border-teal-200 p-4 rounded-2xl shadow-sm text-base sm:text-lg font-bold flex items-center justify-between cursor-move';

                    </div>
                    <i class="fa-solid fa-grip-lines text-gray-400 shrink-0 ml-2"></i>
                `;
                
                // 拖拉邏輯
                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', item.dataset.index);
                    setTimeout(() => item.classList.add('opacity-50'), 0);
                });
                item.addEventListener('dragend', () => item.classList.remove('opacity-50'));
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    item.classList.add('border-dashed', 'border-emerald-400', 'bg-emerald-50');
                });
                item.addEventListener('dragleave', () => item.classList.remove('border-dashed', 'border-emerald-400', 'bg-emerald-50'));
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    item.classList.remove('border-dashed', 'border-emerald-400', 'bg-emerald-50');
                    const draggedIdx = e.dataTransfer.getData('text/plain');
                    if (draggedIdx !== '' && draggedIdx != item.dataset.index) {
                        const draggedEl = Array.from(listContainer.children).find(el => el.dataset.index == draggedIdx);
                        if(draggedEl) {
                            // 判斷往前或往後插入
                            const allItems = Array.from(listContainer.children);
                            const fromIdx = allItems.indexOf(draggedEl);
                            const toIdx = allItems.indexOf(item);
                            if (fromIdx < toIdx) {
                                item.after(draggedEl);
                            } else {
                                item.before(draggedEl);
                            }
                            updateSequenceIndices();
                        }
                    }
                });
                
                // 點擊交換邏輯 (手機友善)
                item.addEventListener('click', () => {
                    if (seqSelected === null) {

                        item.classList.add('ring-4', 'ring-emerald-400');
                    } else if (seqSelected === item) {
                        seqSelected = null;
                        item.classList.remove('ring-4', 'ring-emerald-400');
                    } else {
                        // 交換節點位置
                        const parent = item.parentNode;
                        const p1 = seqSelected.nextSibling === item ? seqSelected : seqSelected.nextSibling;
                        parent.insertBefore(seqSelected, item.nextSibling);
                        parent.insertBefore(item, p1);
                        
                        seqSelected.classList.remove('ring-4', 'ring-emerald-400');
                        seqSelected = null;
                        updateSequenceIndices();
                    }
                });
                
                listContainer.appendChild(item);
            });
            
            function updateSequenceIndices() {
                Array.from(listContainer.children).forEach((child, i) => {
                    child.dataset.index = i;
                    child.querySelector('.order-num').innerText = i + 1;
                });
            }
            
            updateSequenceIndices(); // 初始化序號
            container.appendChild(listContainer);
            submitBtn.classList.remove('hidden');

            checkCurrentAnswer = () => {
                const currentOrder = Array.from(listContainer.children).map(el => el.querySelector('span').innerText);
                const isCorrect = JSON.stringify(currentOrder) === JSON.stringify(qData.answer);
                showFeedback(isCorrect, isCorrect ? "排序完全正確！你掌握了步驟！" : "順序有點不對，請再思考一下做事的先後次序。");
            };
        }

        function renderShoppingMemory(qData, container, submitBtn) {
            const playBtn = document.createElement('button');
            playBtn.className = 'w-20 h-20 sm:w-24 sm:h-24 bg-cyan-400 hover:bg-cyan-500 rounded-full flex items-center justify-center text-white shadow-xl transition transform hover:scale-110 mb-6 an[...]
            playBtn.innerHTML = '<i class="fa-solid fa-ear-listen text-3xl sm:text-4xl"></i>';
            playBtn.onclick = () => {
                playTTS(qData.audioText);
                playBtn.classList.remove('animate-bounce');
                playBtn.classList.add('memory-flash');
                setTimeout(() => playBtn.classList.remove('memory-flash'), 500);
            };
            container.appendChild(playBtn);
            
            const hintText = document.createElement('p');
            hintText.className = 'text-base sm:text-lg font-bold text-gray-500 mb-6 text-center px-4';
            hintText.innerText = "請點擊上方喇叭專心聆聽，然後在下方按順序選出物品。";
            container.appendChild(hintText);

            const displayArea = document.createElement('div');
            displayArea.className = 'w-full max-w-2xl min-h-[100px] bg-yellow-50 border-4 border-dashed border-yellow-200 rounded-3xl p-4 flex flex-wrap gap-3 mb-8 justify-center items-center';
            container.appendChild(displayArea);

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'flex flex-wrap gap-3 justify-center max-w-2xl';
            
            // 混入干擾項
            let allOptions = [...qData.answer];
            const distractors = ["🛒 廁紙", "🧴 洗手液", "🍎 蘋果", "🍞 麵包", "🥛 牛奶", "🧃 果汁", "📝 筆記簿", "✂️ 剪刀", "📐 間尺"];
            while(allOptions.length < 8) {
                const rand = distractors[Math.floor(Math.random() * distractors.length)];
                if(!allOptions.includes(rand)) allOptions.push(rand);
            }
            allOptions.sort(() => Math.random() - 0.5);

            allOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'bg-white border-2 border-gray-200 hover:border-cyan-400 text-gray-700 font-bold py-2 sm:py-3 px-4 sm:px-5 rounded-2xl shadow-sm transition shopping-btn text-sm sm:text[...]
                btn.innerText = opt;
                btn.onclick = () => {
                    if (userSequence.includes(opt)) return;
                    userSequence.push(opt);
                    
                    const selectedItem = document.createElement('div');
                    selectedItem.className = 'bg-cyan-100 text-cyan-800 font-black px-3 sm:px-4 py-2 rounded-xl flex items-center gap-2 animate-bounce-short text-sm sm:text-base';
                    selectedItem.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-xmark cursor-pointer hover:text-red-500 p-1"></i>`;
                    
                    selectedItem.querySelector('i').onclick = (e) => {
                        e.stopPropagation();
                        userSequence = userSequence.filter(item => item !== opt);
                        selectedItem.remove();
                        btn.classList.remove('opacity-50', 'pointer-events-none');
                        if(userSequence.length === 0) submitBtn.classList.add('hidden');
                    };
                    
                    displayArea.appendChild(selectedItem);
                    btn.classList.add('opacity-50', 'pointer-events-none');
                    submitBtn.classList.remove('hidden');
                };
                optionsContainer.appendChild(btn);
            });
            
            container.appendChild(optionsContainer);
            
            checkCurrentAnswer = () => {
                if(userSequence.length === 0) return showFeedback(false, "清單是空的，請選擇你要購買的物品！");
                if(userSequence.length !== qData.answer.length) return showFeedback(false, "購買的數量不對喔，再聽一次確認買了幾樣東西。");
                
                const isCorrect = JSON.stringify(userSequence) === JSON.stringify(qData.answer);
                showFeedback(isCorrect, isCorrect ? "記憶力超強！物品和順序都全對了！" : "物品或順序不太對，再聽一次試試看。");
            };
        }

        function renderFillBlank(qData, container, submitBtn) {
            const textContainer = document.createElement('div');
            textContainer.className = 'bg-white p-6 md:p-10 rounded-3xl shadow-sm border-2 border-teal-100 text-lg sm:text-xl leading-loose font-bold text-gray-700 w-full max-w-3xl mb-8';
            
            let htmlText = qData.text;
            qData.blanks.forEach((blank, i) => {
                htmlText = htmlText.replace(`[__${i+1}__]`, `<span class="inline-flex items-center justify-center min-w-[100px] h-[40px] border-b-4 border-dashed border-teal-400 mx-2 text-center [...]
            });
            textContainer.innerHTML = htmlText;
            container.appendChild(textContainer);

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'flex flex-wrap gap-3 justify-center w-full bg-gray-100 p-5 rounded-2xl min-h-[80px]';
            
            let shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(opt => {
                const wordBlock = document.createElement('div');
                wordBlock.className = 'draggable-item bg-teal-50 border-2 border-teal-200 text-teal-800 font-black py-2 px-4 rounded-xl shadow-sm cursor-grab select-none inline-block';
                wordBlock.draggable = true;
                wordBlock.innerText = opt;
                
                wordBlock.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', opt);
                    setTimeout(() => wordBlock.classList.add('opacity-50'), 0);
                    globalSelectedObj = wordBlock;
                });
                wordBlock.addEventListener('dragend', () => {
                    wordBlock.classList.remove('opacity-50');
                    globalSelectedObj = null;
                });
                
                // 點擊選取邏輯
                wordBlock.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // 如果點擊的是已經在空格內的詞語，把它放回下方選項區
                    if (wordBlock.parentElement.classList.contains('empty-blank')) {
                        const parentBlank = wordBlock.parentElement;
                        optionsContainer.appendChild(wordBlock);
                        parentBlank.innerText = '?';
                        parentBlank.dataset.filled = "false";
                        checkFillBlankReady();
                        return;
                    }
                    
                    if (wordBlock.classList.contains('selected')) {
                        clearSelection();
                    } else {
                        clearSelection();
                        wordBlock.classList.add('selected');
                        globalSelectedObj = wordBlock;
                    }
                });
                
                optionsContainer.appendChild(wordBlock);
            });
            container.appendChild(optionsContainer);

            const blanks = textContainer.querySelectorAll('.empty-blank');
            blanks.forEach(blank => {
                blank.addEventListener('dragover', e => { e.preventDefault(); blank.classList.add('bg-teal-100'); });
                blank.addEventListener('dragleave', () => blank.classList.remove('bg-teal-100'));
                blank.addEventListener('drop', e => {
                    e.preventDefault();
                    blank.classList.remove('bg-teal-100');
                    const text = e.dataTransfer.getData('text/plain');
                    handleBlankFill(blank, text);
                });
                
                // 點擊空格放入選取的詞語
                blank.addEventListener('click', () => {
                    if(globalSelectedObj && !blank.dataset.filled) {
                        handleBlankFill(blank, globalSelectedObj.innerText);
                        clearSelection();
                    }
                });
            });

            function handleBlankFill(blank, text) {
                const wordEl = Array.from(optionsContainer.children).find(el => el.innerText === text) || 
                               Array.from(textContainer.querySelectorAll('.draggable-item')).find(el => el.innerText === text);
                
                if (wordEl) {
                    // 如果空格已經有東西，先把舊的退回選項區
                    if (blank.dataset.filled === "true") {
                        const existingWord = blank.querySelector('.draggable-item');
                        if (existingWord) optionsContainer.appendChild(existingWord);
                    }
                    blank.innerText = '';
                    blank.appendChild(wordEl);
                    blank.dataset.filled = "true";
                    checkFillBlankReady();
                }
            }

            function checkFillBlankReady() {
                let allFilled = true;
                blanks.forEach(b => { if(b.dataset.filled !== "true") allFilled = false; });
                if(allFilled) submitBtn.classList.remove('hidden');
                else submitBtn.classList.add('hidden');
            }

            checkCurrentAnswer = () => {
                let allCorrect = true;
                blanks.forEach((blank, i) => {
                    const filledItem = blank.querySelector('.draggable-item');
                    if(filledItem && filledItem.innerText !== qData.blanks[i]) {
                        allCorrect = false;
                    } else if (!filledItem) {
                        allCorrect = false;
                    }
                });
                showFeedback(allCorrect, allCorrect ? "太棒了！句子填寫完全正確，語氣很通順！" : "有些詞語放錯位置了，請再讀一次句子看看順不順。");
            };
        }

        function showFeedback(isCorrect, msg, isCategory = false) {
            const feedbackArea = document.getElementById('feedback-area');
            const submitBtn = document.getElementById('submit-btn');
            const nextBtn = document.getElementById('next-btn');
            const retryBtn = document.getElementById('retry-btn');
            
            feedbackArea.className = `p-4 rounded-xl text-lg font-black text-center transition-all shadow-sm ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`;
            feedbackArea.innerHTML = `<i class="fa-solid ${isCorrect ? 'fa-check-circle' : 'fa-circle-xmark'} mr-2"></i> ${msg}`;
            feedbackArea.classList.remove('hidden');
            
            submitBtn.classList.add('hidden');
            
            if (isCorrect) {
                createConfetti();
                playTTS(msg);
                nextBtn.classList.remove('hidden');
                if(retryBtn) retryBtn.classList.add('hidden');
                
                // 更新進度，分類題防重複計分
                if(!isCategory) state.energyAnswered++;
                else if (currentQIndex === 0 && !window.catAnswered) {
                    state.energyAnswered++;
                    window.catAnswered = true;
                }
                saveProgress();
                
                // 答對後禁止繼續操作
                document.getElementById('interactive-area').style.pointerEvents = 'none';
            } else {
                playTTS(msg);
                const area = document.getElementById('interactive-area');
                area.classList.add('animate-shake');
                setTimeout(() => area.classList.remove('animate-shake'), 400);
                if(retryBtn) retryBtn.classList.remove('hidden');
                nextBtn.classList.add('hidden');
            }
        }

        function retryQuestion() {
            renderQuestion();
        }

        function nextQuestion() {
            currentQIndex++;
            window.catAnswered = false;
            document.getElementById('interactive-area').style.pointerEvents = 'auto'; // 恢復操作
            renderQuestion();
        }

        function showLevelComplete() {
            const area = document.getElementById('interactive-area');
            const hintArea = document.getElementById('hint-content');
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('retry-btn').classList.add('hidden');
            document.getElementById('feedback-area').classList.add('hidden');
            
            hintArea.innerHTML = "<span class='text-teal-600 block mb-2'><i class='fa-solid fa-bullhorn'></i> 系統廣播：</span>任務完成！你可以繼續挑戰下一個關卡。";
            
            area.innerHTML = `
                <div class="text-center flex flex-col items-center justify-center h-full p-8 w-full">
                    <i class="fa-solid fa-award text-7xl sm:text-8xl text-yellow-400 mb-6 drop-shadow-lg animate-bounce"></i>
                    <h3 class="text-2xl sm:text-3xl font-black text-teal-800 mb-4">任務大成功！</h3>
                    <p class="text-gray-600 mb-8 text-base sm:text-lg">你已經完成了「${blLevels[state.currentLevelIndex].title}」的所有挑戰。</p>
                    ${state.currentLevelIndex < blLevels.length - 1 ? 
                    `<button onclick="startNextLevel()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-6 sm:px-8 py-3 sm:py-4 rounded-full text-lg sm:text-xl font-black shadow-lg transition transform hover:scale-105 flex items-center gap-2">
                        挑戰下一關 <i class="fa-solid fa-arrow-right"></i>
                    </button>` : 
                    `<div class="bg-teal-100 text-teal-800 p-6 rounded-2xl font-black text-lg sm:text-xl border-4 border-teal-300 w-full max-w-md">
                        🎉 恭喜你完成所有生活技能訓練！你是真正的城市實踐家！ 🎉
                    </div>`}
                </div>
            `;
            createConfetti(80);
            playTTS("任務大成功！");
        }

        function startNextLevel() {
            if(state.currentLevelIndex < blLevels.length - 1) {
                state.currentLevelIndex++;
                saveProgress();
                initSidebar();
                loadLevel(state.currentLevelIndex);
            }
        }

        function playTTS(text) {
            if (!text) return;
            // 清除 HTML 標籤
            const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/\[__[0-9]+__\]/g, '空格');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'zh-HK';
                utterance.rate = 0.9; // 語速稍微放慢適合 SEN 學生
                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("瀏覽器不支援語音合成功能。");
            }
        }

        function createConfetti(amount = 50) {
            const colors = ['#34d399', '#fbbf24', '#f87171', '#60a5fa', '#a78bfa'];
            for (let i = 0; i < amount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000); // 動畫結束後移除
            }
        }
    </script>
</body>
